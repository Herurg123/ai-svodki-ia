name: Apply v4 patch once

on:
  push:
    branches:
      - agent/reuters-openai-recall-v4
    paths:
      - .github/workflows/apply-v4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/reuters-openai-recall-v4
          fetch-depth: 0
      - name: Apply patch
        run: python automation/scripts/patch_v4_temp.py
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/scripts/patch_v4_temp.py
          rm -f .github/workflows/apply-v4-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use targeted OpenAI Reuters recall query'
          git push origin HEAD:agent/reuters-openai-recall-v4
