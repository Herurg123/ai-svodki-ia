name: Patch agency domain routing v2

on:
  push:
    branches:
      - agent/fix-agency-domain-routing
    paths:
      - .github/workflows/patch-agency-domain-routing-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-agency-domain-routing
          fetch-depth: 0
      - name: Reuse exact patch program
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-agency-domain-routing.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          program = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_patch.py').write_text(program, encoding='utf-8')
          PY
          python /tmp/apply_patch.py
          git rm .github/workflows/patch-agency-domain-routing.yml .github/workflows/patch-agency-domain-routing-v2.yml
          git status --short
      - name: Commit patched branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route agency recall through disjoint domain filters"
          git push origin HEAD:agent/fix-agency-domain-routing
