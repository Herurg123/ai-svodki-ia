name: Stage2 Source Pulse hardening patch
on:
  push:
    branches:
      - integrate/source-pulse-v1-shadow
    paths:
      - .github/workflows/stage2-hardening-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate/source-pulse-v1-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply Source Pulse hardening
        run: python automation/scripts/_stage2_hardening_patch.py
      - name: Remove one-time patch machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/scripts/_stage2_hardening_patch.py .github/workflows/stage2-hardening-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Source Pulse production shadow"
          git push origin HEAD:integrate/source-pulse-v1-shadow
