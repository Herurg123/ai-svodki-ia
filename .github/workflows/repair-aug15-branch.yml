name: Repair Aug 15 digest on PR branch

on:
  push:
    branches:
      - fix/aug15-editorial-retry-window
    paths:
      - ".github/workflows/repair-aug15-branch.yml"

permissions:
  actions: read
  contents: write

jobs:
  promote-validated-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLICATION_DATE: "2026-08-15"
      REPAIR_ARTIFACT_ID: "9241667173"
      REPAIR_ARTIFACT_SHA256: "5c7685f3d64adc745c67c38acb86a2f9f402879cd685b4f68aaf92abdfea107f"

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/aug15-editorial-retry-window
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download already validated repair artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/aug15-repair /tmp/aug15-repair.zip automation/preview/repair-replay
          mkdir -p /tmp/aug15-repair automation/preview/repair-replay/candidate automation/preview/repair-replay/image
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/aug15-repair.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REPAIR_ARTIFACT_ID}/zip"
          [[ "$(sha256sum /tmp/aug15-repair.zip | awk '{print $1}')" == "${REPAIR_ARTIFACT_SHA256}" ]]
          unzip -q /tmp/aug15-repair.zip -d /tmp/aug15-repair
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('/tmp/aug15-repair')
          artifact_validation = json.loads((base/'2026-08-15/artifact-validation.json').read_text(encoding='utf-8'))
          site_validation = json.loads((base/'production-daily/candidate/site-validation.json').read_text(encoding='utf-8'))
          cover_validation = json.loads((base/'production-daily/image/2026-08-15/cover-validation.json').read_text(encoding='utf-8'))
          assert artifact_validation['status'] == 'ok'
          assert site_validation['status'] == 'ok' and site_validation['stories'] == 4
          assert cover_validation['status'] == 'ok'
          print('Validated repair artifact: 4 stories, site ok, cover ok.')
          PY
          cp -a /tmp/aug15-repair/production-daily/candidate/posts automation/preview/repair-replay/candidate/posts
          cp -a /tmp/aug15-repair/production-daily/image/2026-08-15 automation/preview/repair-replay/image/2026-08-15

      - name: Remove only current broken latest release in ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0, 'automation/scripts')
          from production_daily_common import parse_rss

          target = '2026-08-15'
          target_url = f'https://rybalka.one/posts/{target}/'
          rss_path = Path('posts/rss.xml')
          rss = parse_rss(rss_path)
          latest = rss['latest_item']
          if latest.get('date') != target or latest.get('link') != target_url:
              raise SystemExit(f'Replacement allowed only for current latest release: {latest!r}')
          tree = ET.parse(rss_path)
          root = tree.getroot()
          channel = root.find('channel')
          if channel is None:
              raise SystemExit('RSS channel missing')
          matches = [item for item in channel.findall('item') if (item.findtext('link') or '').strip() == target_url]
          if len(matches) != 1:
              raise SystemExit(f'Expected one target RSS item, got {len(matches)}')
          channel.remove(matches[0])
          tree.write(rss_path, encoding='utf-8', xml_declaration=True)
          article_dir = Path('posts') / target
          image = Path('posts/images') / f'ai-svodka-{target}.png'
          content_dir = Path('automation/content') / target
          for required in (article_dir / 'index.html', image, content_dir):
              if not required.exists():
                  raise SystemExit(f'Expected current release path missing: {required}')
          shutil.rmtree(article_dir)
          image.unlink()
          shutil.rmtree(content_dir)
          print('Broken latest release removed only from this checkout.')
          PY

      - name: Promote already validated replacement
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/promote_production_site.py \
            --config automation/config/production-daily.json \
            --candidate-posts automation/preview/repair-replay/candidate/posts \
            --live-posts posts \
            --source-dir automation/preview/repair-replay/image/2026-08-15 \
            --content-root automation/content \
            --publication-date "${PUBLICATION_DATE}" \
            --report automation/preview/repair-replay/promotion-replay.json

      - name: Rebuild archive from replacement
        run: python automation/scripts/bootstrap_archive.py

      - name: Validate rebuilt archive
        run: python automation/scripts/validate_archive.py

      - name: Validate final RSS and Dzen feed
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/validate_rss.py --rss posts/rss.xml
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --report automation/preview/repair-replay/final-dzen-feed-validation.json

      - name: Stage only canonical replacement paths
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/validate_publish_changes.py \
            --publication-date "${PUBLICATION_DATE}" \
            --report automation/preview/repair-replay/publish-changes.json
          git diff --cached --stat

      - name: Commit validated replacement to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace AI digest for ${PUBLICATION_DATE} after retry fix"
          git push origin HEAD:fix/aug15-editorial-retry-window
