name: Apply Aug 16 production fixes v2
on:
  push:
    branches:
      - fix/aug16-source-health-editorial
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reuse deterministic source patch and update stale contract tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          harness = Path('.github/workflows/apply-aug16-fix.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(harness) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(harness)) if harness[i].strip() == 'PY')
          source_patch = textwrap.dedent('\n'.join(harness[start + 1:end]))
          exec(compile(source_patch, 'apply-aug16-fix-source-patch', 'exec'), {})

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'automation/tests/test_primary_recall_query_discipline.py',
              'self.assertIn("`bloomberg.com` + `ft.com`", text)',
              'self.assertIn("Reuters/AP/Bloomberg/FT", text)\n        self.assertIn("latest AI chips data centers investments deals policy security", text)',
              'query discipline agency expectation',
          )

          p = Path('automation/tests/test_primary_recall_search.py')
          text = p.read_text(encoding='utf-8')
          old = 'prs.BLOOMBERG_FT_DOMAINS'
          if text.count(old) != 2:
              raise SystemExit(f'primary recall search domain expectations: expected 2, got {text.count(old)}')
          p.write_text(text.replace(old, 'prs.AGENCY_DOMAINS'), encoding='utf-8')
          PY
      - name: Remove one-shot workflows from final diff
        run: git rm .github/workflows/apply-aug16-fix.yml .github/workflows/apply-aug16-fix-v2.yml
      - name: Compile and run all offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts
          python -m unittest discover -s automation/tests -p 'test_*.py'
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Harden Aug 16 agency retrieval and editorial recovery"
          git push origin HEAD
