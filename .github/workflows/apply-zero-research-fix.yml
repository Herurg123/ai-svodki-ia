name: Temporary zero research recovery fix

on:
  push:
    branches:
      - fix/zero-research-to-coverage-2026-08-09
    paths:
      - .github/workflows/apply-zero-research-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/zero-research-to-coverage-2026-08-09
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply zero research fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The Aug 9 model used a semantically equivalent empty-pool phrase that
          # the wrapper did not recognize, so completed paid research was treated
          # as a hard failure before mandatory coverage.
          replace_once(
              'automation/scripts/run_digest_preview.py',
              '''EMPTY_RESEARCH_MARKERS = (\n    "не найдено ни одного",\n    "не осталось ни одного достойного",\n    "пул кандидатов пуст",\n)\n''',
              '''EMPTY_RESEARCH_MARKERS = (\n    "не найдено ни одного",\n    "не осталось ни одного достойного",\n    "не удалось подтвердить ни одного",\n    "пул кандидатов пуст",\n)\n''',
          )

          # Recovery must recognize and normalize the same paid zero-pool result,
          # otherwise rerunning after this fix would pay for main research again.
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              'TEMPORAL_ANCHOR_VERSION = 1\n\nIMAGE_RECOVERY_REQUIRED = (\n',
              '''TEMPORAL_ANCHOR_VERSION = 1\nEMPTY_RESEARCH_MARKERS = (\n    "не найдено ни одного",\n    "не осталось ни одного достойного",\n    "не удалось подтвердить ни одного",\n    "пул кандидатов пуст",\n)\n\nIMAGE_RECOVERY_REQUIRED = (\n''',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              '''def research_is_reusable(source_dir: Path) -> tuple[bool, str | None]:\n    run_info = read_json(source_dir / "run-info.json")\n    candidates = read_json(source_dir / "candidates.json")\n    if not isinstance(run_info, dict):\n        return False, "run-info.json должен содержать объект"\n    research = run_info.get("research")\n    if not isinstance(research, dict) or research.get("status") != "ok":\n        return False, "research.status не равен ok"\n    if not isinstance(candidates, dict) or not isinstance(candidates.get("candidates"), list):\n        return False, "candidates.json не содержит candidates[]"\n''',
              '''def completed_empty_research(\n    run_info: dict[str, Any],\n    candidates: dict[str, Any],\n) -> bool:\n    if candidates.get("candidates") != []:\n        return False\n    if not isinstance(candidates.get("coverage"), list):\n        return False\n    if not isinstance(candidates.get("search_window"), dict):\n        return False\n    research = run_info.get("research")\n    if not isinstance(research, dict):\n        return False\n    response = research.get("response")\n    if not isinstance(response, dict) or response.get("response_status") != "completed":\n        return False\n    try:\n        completed_searches = int(response.get("web_search_calls", 0) or 0)\n    except (TypeError, ValueError):\n        return False\n    if completed_searches < 1:\n        return False\n    messages = " ".join(\n        str(value or "")\n        for value in (\n            candidates.get("error_message"),\n            research.get("error"),\n            run_info.get("error"),\n        )\n    ).casefold()\n    return any(marker in messages for marker in EMPTY_RESEARCH_MARKERS)\n\n\ndef normalize_completed_empty_research(target_dir: Path) -> bool:\n    run_info_path = target_dir / "run-info.json"\n    candidates_path = target_dir / "candidates.json"\n    run_info = read_json(run_info_path)\n    candidates = read_json(candidates_path)\n    if not isinstance(run_info, dict) or not isinstance(candidates, dict):\n        return False\n    if not completed_empty_research(run_info, candidates):\n        return False\n    candidates["status"] = "ok"\n    candidates["error_message"] = None\n    research = run_info.get("research")\n    if not isinstance(research, dict):\n        return False\n    research["status"] = "ok"\n    research["error"] = None\n    warnings = run_info.get("warnings")\n    if not isinstance(warnings, list):\n        warnings = []\n        run_info["warnings"] = warnings\n    warning = (\n        "Восстановлен завершённый основной Web Search с нулевым пулом; "\n        "результат передан обязательному coverage audit без повторного research."\n    )\n    if warning not in warnings:\n        warnings.append(warning)\n    write_json(candidates_path, candidates)\n    write_json(run_info_path, run_info)\n    return True\n\n\ndef research_is_reusable(source_dir: Path) -> tuple[bool, str | None]:\n    run_info = read_json(source_dir / "run-info.json")\n    candidates = read_json(source_dir / "candidates.json")\n    if not isinstance(run_info, dict):\n        return False, "run-info.json должен содержать объект"\n    if not isinstance(candidates, dict) or not isinstance(candidates.get("candidates"), list):\n        return False, "candidates.json не содержит candidates[]"\n    research = run_info.get("research")\n    if not isinstance(research, dict):\n        return False, "run-info.json не содержит research"\n    if research.get("status") != "ok" and not completed_empty_research(run_info, candidates):\n        return False, "research.status не равен ok и это не завершённый нулевой research"\n''',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              '''    if target_dir.exists():\n        shutil.rmtree(target_dir)\n    shutil.copytree(source_dir, target_dir)\n\n    merged_research = restore_merged_coverage_research(\n''',
              '''    if target_dir.exists():\n        shutil.rmtree(target_dir)\n    shutil.copytree(source_dir, target_dir)\n    normalized_empty_research = normalize_completed_empty_research(target_dir)\n\n    merged_research = restore_merged_coverage_research(\n''',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              '''        "removed_stage_files": removed,\n        "merged_coverage_research": merged_research,\n''',
              '''        "removed_stage_files": removed,\n        "normalized_empty_research": normalized_empty_research,\n        "merged_coverage_research": merged_research,\n''',
          )

          test = r'''from __future__ import annotations

import json
import sys
import tempfile
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
sys.path.insert(0, str(ROOT / "automation" / "scripts"))

import recover_digest_artifact as recovery
import run_digest_preview as wrapper

AUG9_MESSAGE = (
    "В строгом окне не удалось подтвердить ни одного достойного нового события "
    "по открываемым первичным источникам."
)


def payloads(*, response_status: str = "completed", web_search_calls: int = 6, message: str = AUG9_MESSAGE):
    candidates = {
        "status": "error",
        "error_message": message,
        "publication_date": "2026-08-09",
        "search_window": {
            "start_at": "2026-08-08T02:48:25+03:00",
            "end_at": "2026-08-09T09:37:32+03:00",
        },
        "coverage": [{"area": "world", "status": "gap", "notes": "checked"}],
        "candidates": [],
        "rejected_as_duplicates": [],
        "research_notes": "search complete",
    }
    run_info = {
        "status": "error",
        "error": "RuntimeError: " + message,
        "publication_date": "2026-08-09",
        "finished_at": "2026-08-09T09:38:54+03:00",
        "warnings": [],
        "research": {
            "status": "error",
            "error": "RuntimeError: " + message,
            "temporal_anchor_version": 1,
            "response": {
                "response_status": response_status,
                "web_search_calls": web_search_calls,
            },
        },
    }
    return run_info, candidates


def write_artifact(root: Path, *, response_status: str = "completed", web_search_calls: int = 6, message: str = AUG9_MESSAGE):
    run_info, candidates = payloads(
        response_status=response_status,
        web_search_calls=web_search_calls,
        message=message,
    )
    (root / "run-info.json").write_text(json.dumps(run_info, ensure_ascii=False), encoding="utf-8")
    (root / "candidates.json").write_text(json.dumps(candidates, ensure_ascii=False), encoding="utf-8")
    (root / "research-output-raw.json").write_text(json.dumps(candidates, ensure_ascii=False), encoding="utf-8")


class ZeroResearchRecoveryTests(unittest.TestCase):
    def test_aug9_phrase_is_normalized_by_wrapper(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            root = Path(temp)
            write_artifact(root)
            self.assertTrue(wrapper.normalize_completed_empty_research(root))
            self.assertEqual(json.loads((root / "candidates.json").read_text())["status"], "ok")
            self.assertEqual(json.loads((root / "run-info.json").read_text())["research"]["status"], "ok")

    def test_aug9_paid_research_is_reusable_and_normalized_on_recovery(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            recovery_root = Path(temp) / "recovery"
            source = recovery_root / "2026-08-09"
            source.mkdir(parents=True)
            write_artifact(source)
            usable, reason = recovery.research_is_reusable(source)
            self.assertTrue(usable, reason)
            target = Path(temp) / "target"
            report = recovery.recover(
                recovery_root,
                target,
                "2026-08-09",
                Path(temp) / "report.json",
            )
            self.assertEqual(report["recovery_mode"], "research_only")
            self.assertTrue(report["normalized_empty_research"])
            self.assertEqual(json.loads((target / "candidates.json").read_text())["status"], "ok")
            self.assertEqual(json.loads((target / "run-info.json").read_text())["research"]["status"], "ok")

    def test_transport_failure_is_not_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            source = Path(temp)
            write_artifact(source, response_status="failed")
            usable, _ = recovery.research_is_reusable(source)
            self.assertFalse(usable)
            self.assertFalse(wrapper.normalize_completed_empty_research(source))

    def test_zero_search_calls_are_not_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            source = Path(temp)
            write_artifact(source, web_search_calls=0)
            usable, _ = recovery.research_is_reusable(source)
            self.assertFalse(usable)

    def test_unrelated_model_error_is_not_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            source = Path(temp)
            write_artifact(source, message="Внутренняя ошибка анализа источников")
            usable, _ = recovery.research_is_reusable(source)
            self.assertFalse(usable)


if __name__ == "__main__":
    unittest.main()
'''
          Path('automation/tests/test_zero_research_recovery.py').write_text(test, encoding='utf-8')
          PY
      - name: Run focused tests
        env:
          PYTHONPATH: automation/scripts
        run: |
          python -m unittest \
            automation.tests.test_zero_research_recovery \
            automation.tests.test_gapless_research_window \
            automation.tests.test_temporal_anchor_contract \
            automation.tests.test_coverage_search_upgrade
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add \
            automation/scripts/run_digest_preview.py \
            automation/scripts/recover_digest_artifact.py \
            automation/tests/test_zero_research_recovery.py
          git diff --cached --check
          git commit -m "Передавать нулевой research в coverage audit"
          git push origin HEAD:fix/zero-research-to-coverage-2026-08-09
