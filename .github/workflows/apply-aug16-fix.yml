name: Apply Aug 16 production fixes
on:
  push:
    branches:
      - fix/aug16-source-health-editorial
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # 1) Primary agency route: keep one search slot, but let it reach all
          # four authoritative agency families and use the Terra-validated
          # high-signal query contract instead of a generic AI-news phrase.
          path = "automation/scripts/primary_recall_search.py"
          text = read(path)
          text = replace_once(
              text,
              '"Отдельный high-signal sweep Bloomberg и Financial Times: модели, "\n            "чипы, инфраструктура, инвестиции, M&A, партнёрства, policy, legal "\n            "и security. Это дополнительный publisher route, не мировой catch-all."\n        ),\n        "allowed_domains": BLOOMBERG_FT_DOMAINS,',
              '"Отдельный high-signal sweep Reuters, Associated Press, Bloomberg и "\n            "Financial Times: чипы, инфраструктура, инвестиции, M&A, партнёрства, "\n            "policy, legal и security. Это дополнительный publisher route, не "\n            "мировой catch-all."\n        ),\n        "allowed_domains": AGENCY_DOMAINS,',
              "primary major_agencies route",
          )
          write(path, text)

          path = "automation/prompts/primary_recall_pass.md"
          text = read(path)
          text = replace_once(
              text,
              '`major_agencies` остаётся отдельным дополнительным high-signal каналом с API\nfilter `bloomberg.com` + `ft.com`; query при этом source-neutral и date-free,\nнапример `latest major artificial intelligence news`. Это дополнительный шанс\nranking, а не доказательство отсутствия события вне этих издателей.',
              '`major_agencies` остаётся отдельным дополнительным high-signal каналом с API\nfilter Reuters/AP/Bloomberg/FT. Для этого прохода фактический query должен быть\nровно `latest AI chips data centers investments deals policy security`. Он\nостаётся коротким, date-free и не кодирует издателя в query text; publisher\nrouting задаётся API domain filter. Это дополнительный шанс ranking, а не\nдоказательство отсутствия события вне этих издателей.',
              "primary prompt agency contract",
          )
          write(path, text)

          # 2) Agency rescue target taxonomy: rank event families, not only exact
          # strings, so acquisition_closed/funding_extension/etc. do not fall out.
          path = "automation/scripts/ensure_story_coverage.py"
          text = read(path)
          text = replace_once(text, "import json\nimport sys\n", "import json\nimport re\nimport sys\n", "ensure import re")
          marker = "def _select_agency_corroboration_target(\n"
          helper = '''def _agency_event_family(event_type: str) -> str:\n    \"\"\"Normalize common event-type variants for rescue target ranking.\"\"\"\n    raw = str(event_type or \"\").casefold().strip()\n    if raw == \"m&a\":\n        return raw\n    normalized = re.sub(r\"[^a-z0-9]+\", \"_\", raw).strip(\"_\")\n    for family in (\n        \"funding\",\n        \"acquisition\",\n        \"merger\",\n        \"investment\",\n        \"data_center\",\n        \"infrastructure\",\n        \"partnership\",\n    ):\n        if normalized == family or normalized.startswith(family + \"_\"):\n            return family\n    return normalized\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("agency target selector marker mismatch")
          text = text.replace(marker, helper + marker, 1)
          text = replace_once(
              text,
              "priority = event_priority.get(event_type)",
              "priority = event_priority.get(_agency_event_family(event_type))",
              "agency target family lookup",
          )
          write(path, text)

          # 3) Asia classification: a secondary organization counts only when it
          # is visibly an event party in the title. This preserves Writer; Z.ai
          # while correctly recognizing Uber; Pony.ai.
          path = "automation/scripts/editorial_policy_runtime.py"
          text = read(path)
          old = '''    organization = str(candidate.get("organization") or "").strip()\n    primary = organization.split(";", 1)[0].strip().casefold()\n    if primary:\n        return any(name in primary for name in tracked)\n    title = str(candidate.get("title") or "").casefold()\n    return any(name in title for name in tracked)\n'''
          new = '''    organization = str(candidate.get("organization") or "").strip()\n    primary = organization.split(";", 1)[0].strip().casefold()\n    if primary and any(name in primary for name in tracked):\n        return True\n    # A secondary tracked organization is a regional subject only when the\n    # editorial title itself names it as a party to the event. This keeps\n    # metadata-only provenance such as Writer; Z.ai out of the China section,\n    # while joint events such as Uber; Pony.ai are classified correctly.\n    title = str(candidate.get("title") or "").casefold()\n    return any(name in title for name in tracked)\n'''
          text = replace_once(text, old, new, "asia joint-party classification")
          write(path, text)

          path = "automation/config/editorial.json"
          text = read(path)
          text = replace_once(
              text,
              '    "SenseTime",\n    "Huawei"',
              '    "SenseTime",\n    "Pony.ai",\n    "Huawei"',
              "track Pony.ai",
          )
          write(path, text)

          # 4) Do not throw away the child editorial error text on Coverage rerun.
          path = "automation/scripts/ensure_story_coverage_policy.py"
          text = read(path)
          old = '    subprocess.run(command, cwd=REPOSITORY_ROOT, env=os.environ.copy(), check=True)\n'
          new = '''    completed = subprocess.run(\n        command,\n        cwd=REPOSITORY_ROOT,\n        env=os.environ.copy(),\n        text=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.STDOUT,\n        check=False,\n    )\n    if completed.stdout:\n        print(\n            completed.stdout,\n            end="" if completed.stdout.endswith("\\n") else "\\n",\n        )\n    if completed.returncode != 0:\n        raise subprocess.CalledProcessError(\n            completed.returncode, command, output=completed.stdout\n        )\n'''
          text = replace_once(text, old, new, "coverage editorial diagnostics")
          write(path, text)

          # Regression tests.
          path = "automation/tests/test_primary_recall_source_routes.py"
          text = read(path)
          text = replace_once(
              text,
              'self.assertEqual(routes["major_agencies"], ("bloomberg.com", "ft.com"))',
              'self.assertEqual(routes["major_agencies"], primary.AGENCY_DOMAINS)',
              "primary source route test",
          )
          write(path, text)

          path = "automation/tests/test_fresh_source_routing_contract.py"
          text = read(path)
          text = replace_once(
              text,
              'self.assertIn("`bloomberg.com` + `ft.com`", text)',
              'self.assertIn("Reuters/AP/Bloomberg/FT", text)\n        self.assertIn("latest AI chips data centers investments deals policy security", text)',
              "fresh routing prompt test",
          )
          write(path, text)

          path = "automation/tests/test_agency_corroboration.py"
          text = read(path)
          insert_after = '''    def test_target_selection_prefers_high_score_funding_over_partnership(self):\n        pool = [\n            candidate("cand-001", "Anthropic", "research publication", 5, category="security"),\n            candidate("cand-003", "Databricks", "funding", 5),\n            candidate("cand-004", "IBM; OpenAI", "partnership", 5, category="enterprise"),\n            candidate("cand-005", "Thrive Holdings", "funding", 4),\n        ]\n        target = runtime._select_agency_corroboration_target(pool)\n        self.assertIsNotNone(target)\n        self.assertEqual(target["id"], "cand-003")\n\n'''
          addition = '''    def test_target_selection_treats_acquisition_closed_as_acquisition_family(self):\n        pool = [\n            candidate(\n                "cand-001",\n                "SpaceX; Cursor",\n                "acquisition_closed",\n                4,\n                category="investment",\n            ),\n            candidate(\n                "cand-002",\n                "Kog",\n                "model_release",\n                2,\n                category="infrastructure",\n            ),\n        ]\n        target = runtime._select_agency_corroboration_target(pool)\n        self.assertIsNotNone(target)\n        self.assertEqual(target["id"], "cand-001")\n\n    def test_rerun_editorial_preserves_child_output_on_failure(self):\n        import contextlib\n        import io\n        import subprocess\n        from types import SimpleNamespace\n        from unittest import mock\n\n        fake = SimpleNamespace(returncode=7, stdout="exact editorial failure\\n")\n        research_path = policy.REPOSITORY_ROOT / "automation/fixtures/research/.coverage-audit-test.json"\n        stream = io.StringIO()\n        with mock.patch.object(policy.subprocess, "run", return_value=fake):\n            with contextlib.redirect_stdout(stream):\n                with self.assertRaises(subprocess.CalledProcessError) as raised:\n                    policy.rerun_editorial(\n                        publication_date="2026-08-16",\n                        merged_research_path=research_path,\n                        minimum_total=7,\n                        maximum_candidates=20,\n                        maximum_selected_stories=12,\n                    )\n        self.assertEqual(raised.exception.output, "exact editorial failure\\n")\n        self.assertIn("exact editorial failure", stream.getvalue())\n\n'''
          if text.count(insert_after) != 1:
              raise SystemExit("agency regression insertion mismatch")
          text = text.replace(insert_after, insert_after + addition, 1)
          write(path, text)

          path = "automation/tests/test_aug15_editorial_retry_regression.py"
          text = read(path)
          text = replace_once(
              text,
              '"tracked_asia_organizations": ["Z.ai", "DeepSeek"],',
              '"tracked_asia_organizations": ["Z.ai", "DeepSeek", "Pony.ai"],',
              "aug15 policy tracks Pony.ai",
          )
          marker = '''    def test_primary_zai_story_remains_chinese(self) -> None:\n        candidate = {\n            "title": "Z.ai представила новую модель",\n            "organization": "Z.ai; Partner",\n        }\n        self.assertTrue(primary_subject_is_asia(candidate, self.policy))\n\n'''
          addition = '''    def test_secondary_asia_party_named_in_title_is_chinese(self) -> None:\n        candidate = {\n            "title": "Uber и Pony.ai расширяют роботакси-партнёрство в Европе",\n            "organization": "Uber; Pony.ai",\n        }\n        self.assertTrue(primary_subject_is_asia(candidate, self.policy))\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("asia regression insertion mismatch")
          text = text.replace(marker, marker + addition, 1)
          write(path, text)

          # Documentation contract.
          path = "README.md"
          text = read(path)
          text = replace_once(
              text,
              '`major_agencies` остаётся дополнительным high-signal\n   проходом только по `bloomberg.com` + `ft.com`.',
              '`major_agencies` остаётся дополнительным high-signal\n   проходом по Reuters, AP, Bloomberg и FT.',
              "root README agency route",
          )
          anchor = '   по себе не считается доказательством свежести.\n'
          note = ('   Для `major_agencies` production использует Terra-проверенный короткий query '\
                  '`latest AI chips data centers investments deals policy security`; publisher '\
                  'routing задаётся API domain filter и не увеличивает 12-search budget.\n')
          if text.count(anchor) != 1:
              raise SystemExit("root README query note anchor mismatch")
          text = text.replace(anchor, anchor + note, 1)
          write(path, text)

          path = "automation/README.md"
          text = read(path)
          text = replace_once(
              text,
              '`major_agencies` — дополнительный high-signal route по Bloomberg и FT;',
              '`major_agencies` — дополнительный high-signal route по Reuters, AP, Bloomberg и FT;',
              "automation README matrix",
          )
          text = text.replace(
              '`bloomberg.com` + `ft.com` high-signal filter',
              'Reuters/AP/Bloomberg/FT high-signal filter',
          )
          text = text.replace(
              '`bloomberg.com` + `ft.com`. Это ranking-шансы',
              'Reuters/AP/Bloomberg/FT. Для этого прохода закреплён короткий date-free query '\
              '`latest AI chips data centers investments deals policy security`. Это ranking-шансы',
          )
          if "по Bloomberg и FT" in text and "major_agencies" in text:
              # Keep historical incident descriptions intact, but current contract must no longer say only Bloomberg/FT.
              pass
          write(path, text)

          path = "AGENTS.md"
          text = read(path)
          stale = '''Primary, Hybrid and fallback Coverage search queries must prioritize calendar\ndates of that main continuity period; the overlap remains valid for an\nincidentally discovered major miss but must not dominate fresh ranking. Candidate\nfreshness validation still uses the full effective window.\n'''
          current = '''Primary, Hybrid and fallback Coverage search queries use short date-free\nrelative-freshness wording; neither the continuity period nor healing overlap is\nencoded as calendar dates in query text. Exact timestamps remain authoritative\nfor post-retrieval eligibility, and the full effective window remains valid for\nhealing a major missed event.\n'''
          text = replace_once(text, stale, current, "AGENTS temporal contract")
          text = replace_once(
              text,
              '`independent_missing_events` have no API domain filter. `major_agencies` remains\nan extra Bloomberg/FT high-signal route.',
              '`independent_missing_events` have no API domain filter. `major_agencies` remains\nan extra Reuters/AP/Bloomberg/FT high-signal route.',
              "AGENTS source route",
          )
          text = replace_once(
              text,
              '- `major_agencies` is an additional date-free `bloomberg.com` + `ft.com` sweep;',
              '- `major_agencies` is an additional Reuters/AP/Bloomberg/FT sweep using the exact '\
              'date-free query `latest AI chips data centers investments deals policy security`;',
              "AGENTS route bullets",
          )
          append_marker = '''The final `independent_missing_events` pass receives a compact list of already\nfound candidates and explicitly searches for significant events absent from the\npool. It is a last-mile recall check, not another editorial filter.\n'''
          aug16_note = '''\nThe 2026-08-16 source-health failure is a permanent regression case. A generic\n`latest major artificial intelligence news` agency query completed but ranked\nhubs instead of enough fresh direct agency stories, even though fresh Reuters\nevidence existed in the effective window. The `major_agencies` route therefore\nuses Reuters/AP/Bloomberg/FT API routing plus the exact high-signal date-free\nquery above without increasing the 12-search Primary budget. Agency rescue target\nranking must normalize event-type families such as `acquisition_closed` to the\n`acquisition` family. Regional classification must keep metadata-only secondary\norganizations such as `Writer; Z.ai` out of the China section while recognizing\na tracked secondary party explicitly named in the story title, such as\n`Uber; Pony.ai`. Coverage editorial reruns must echo child output before raising\nso the real validation error remains visible in Actions diagnostics.\n'''
          if text.count(append_marker) != 1:
              raise SystemExit("AGENTS Aug16 note anchor mismatch")
          text = text.replace(append_marker, append_marker + aug16_note, 1)
          write(path, text)
          PY
      - name: Remove one-shot workflow from final diff
        run: git rm .github/workflows/apply-aug16-fix.yml
      - name: Compile and run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts
          python -m unittest \
            automation.tests.test_primary_recall_source_routes \
            automation.tests.test_fresh_source_routing_contract \
            automation.tests.test_agency_corroboration \
            automation.tests.test_aug15_editorial_retry_regression
      - name: Run full offline suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -p 'test_*.py'
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add \
            README.md AGENTS.md automation/README.md \
            automation/config/editorial.json \
            automation/prompts/primary_recall_pass.md \
            automation/scripts/primary_recall_search.py \
            automation/scripts/ensure_story_coverage.py \
            automation/scripts/ensure_story_coverage_policy.py \
            automation/scripts/editorial_policy_runtime.py \
            automation/tests/test_primary_recall_source_routes.py \
            automation/tests/test_fresh_source_routing_contract.py \
            automation/tests/test_agency_corroboration.py \
            automation/tests/test_aug15_editorial_retry_regression.py \
            .github/workflows/apply-aug16-fix.yml
          git diff --cached --check
          git commit -m "Harden Aug 16 agency retrieval and editorial recovery"
          git push origin HEAD
