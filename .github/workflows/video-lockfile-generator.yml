name: Video lockfile generator

on:
  push:
    branches:
      - agent/video-lockfile-generator-2026-08-25
    paths:
      - ".github/workflows/video-lockfile-generator.yml"
      - "automation/notebooklm-video/package.json"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation/notebooklm-video
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency-free tests still pass
        run: npm test
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: video-package-lock
          path: automation/notebooklm-video/package-lock.json
          retention-days: 1
