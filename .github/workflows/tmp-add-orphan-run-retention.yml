name: Temporary add orphan run retention

on:
  push:
    branches:
      - fix/hygiene-lifecycle-2026-08-09

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hygiene-lifecycle-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Add safe orphan workflow run retention
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          policy = 'automation/scripts/repository_hygiene_policy.py'
          replace_once(
              policy,
              'CLOSED_UNMERGED_TTL_DAYS = 14\nKEEP_FULL_PRODUCTION_DATES = 2\n',
              'CLOSED_UNMERGED_TTL_DAYS = 14\nORPHAN_WORKFLOW_RUN_RETENTION_DAYS = 14\nKEEP_FULL_PRODUCTION_DATES = 2\n',
          )
          replace_once(
              policy,
              'def _text_corpus(root: Path):\n',
              '''def classify_orphan_workflow_run(run, workflow_classification, now=None):\n    if workflow_classification != "safe_disable":\n        return "review_only", "workflow_not_safe_to_disable"\n    if str(run.get("status") or "") != "completed":\n        return "review_only", "workflow_run_not_completed"\n    created = iso(run.get("created_at"))\n    if not created:\n        return "review_only", "workflow_run_missing_created_at"\n    now = now or dt.datetime.now(dt.timezone.utc)\n    cutoff = now - dt.timedelta(days=ORPHAN_WORKFLOW_RUN_RETENTION_DAYS)\n    if created > cutoff:\n        return "protected", "recent_orphan_workflow_run"\n    return "safe_delete", "expired_orphan_workflow_run"\n\n\ndef _text_corpus(root: Path):\n''',
          )

          runtime = 'automation/scripts/repository_hygiene.py'
          replace_once(
              runtime,
              '    CLOSED_UNMERGED_TTL_DAYS,\n    STALE_QUEUED_AFTER_DAYS,\n',
              '    CLOSED_UNMERGED_TTL_DAYS,\n    ORPHAN_WORKFLOW_RUN_RETENTION_DAYS,\n    STALE_QUEUED_AFTER_DAYS,\n',
          )
          replace_once(
              runtime,
              '    classify_production,\n    classify_workflow,\n',
              '    classify_production,\n    classify_workflow,\n    classify_orphan_workflow_run,\n',
          )
          replace_once(
              runtime,
              '''    stale_runs = []\n    workflow_classes = {item["id"]: item["classification"] for item in workflow_items}\n    for workflow in workflows:\n        workflow_id = int(workflow["id"])\n        for run in workflow_runs[workflow_id]:\n            status = str(run.get("status") or "")\n            if status != "queued" or live_run(run, now):\n                continue\n            stale_runs.append({\n                "id": int(run["id"]),\n                "workflow_id": workflow_id,\n                "workflow": str(workflow.get("name") or ""),\n                "head_branch": str(run.get("head_branch") or ""),\n                "created_at": run.get("created_at"),\n                "classification": "review_only",\n                "reason": "stale_orphan_run" if workflow_classes[workflow_id] == "safe_disable" else "stale_queued_run",\n            })\n''',
              '''    stale_runs = []\n    workflow_classes = {item["id"]: item["classification"] for item in workflow_items}\n    for workflow in workflows:\n        workflow_id = int(workflow["id"])\n        workflow_class = workflow_classes[workflow_id]\n        for run in workflow_runs[workflow_id]:\n            status = str(run.get("status") or "")\n            if status == "queued" and not live_run(run, now):\n                stale_runs.append({\n                    "id": int(run["id"]),\n                    "workflow_id": workflow_id,\n                    "workflow": str(workflow.get("name") or ""),\n                    "head_branch": str(run.get("head_branch") or ""),\n                    "created_at": run.get("created_at"),\n                    "classification": "review_only",\n                    "reason": "stale_orphan_run" if workflow_class == "safe_disable" else "stale_queued_run",\n                })\n                continue\n            if status != "completed" or workflow_class != "safe_disable":\n                continue\n            cls, reason = classify_orphan_workflow_run(run, workflow_class, now)\n            stale_runs.append({\n                "id": int(run["id"]),\n                "workflow_id": workflow_id,\n                "workflow": str(workflow.get("name") or ""),\n                "head_branch": str(run.get("head_branch") or ""),\n                "created_at": run.get("created_at"),\n                "classification": cls,\n                "reason": reason,\n            })\n''',
          )
          replace_once(
              runtime,
              '            "closed_unmerged_ttl_days": CLOSED_UNMERGED_TTL_DAYS,\n            "keep_full_production_dates": KEEP_FULL_PRODUCTION_DATES,\n',
              '            "closed_unmerged_ttl_days": CLOSED_UNMERGED_TTL_DAYS,\n            "orphan_workflow_run_retention_days": ORPHAN_WORKFLOW_RUN_RETENTION_DAYS,\n            "keep_full_production_dates": KEEP_FULL_PRODUCTION_DATES,\n',
          )
          replace_once(
              runtime,
              '''        api.disable_workflow(item["id"])\n        disabled.append(item["id"])\n\n    return {\n        "artifacts_deleted": deleted,\n        "artifact_skipped": skipped,\n        "workflows_disabled": disabled,\n        "workflow_skipped": workflow_skipped,\n    }\n''',
              '''        api.disable_workflow(item["id"])\n        disabled.append(item["id"])\n\n    run_deleted = []\n    run_skipped = []\n    fresh = build_plan(api, root)\n    safe_main(api, plan["main_sha"])\n    workflow_classes = {int(item["id"]): item["classification"] for item in fresh["workflows"]}\n    for item in fresh["workflow_runs"]:\n        if item["classification"] != "safe_delete":\n            continue\n        safe_main(api, plan["main_sha"])\n        if production_active(api, production_id):\n            return {\n                "skipped": "production_started_during_actions_cleanup",\n                "artifacts_deleted": deleted,\n                "artifact_skipped": skipped,\n                "workflows_disabled": disabled,\n                "workflow_skipped": workflow_skipped,\n                "workflow_runs_deleted": run_deleted,\n                "workflow_run_skipped": run_skipped,\n            }\n        workflow_id = int(item["workflow_id"])\n        if workflow_classes.get(workflow_id) != "safe_disable":\n            run_skipped.append({"id": item["id"], "reason": "workflow_no_longer_safe"})\n            continue\n        current_runs = api.workflow_runs(workflow_id)\n        current = next((run for run in current_runs if int(run.get("id") or 0) == int(item["id"])), None)\n        if current is None:\n            run_skipped.append({"id": item["id"], "reason": "already_missing"})\n            continue\n        cls, reason = classify_orphan_workflow_run(\n            current,\n            "safe_disable",\n            dt.datetime.now(dt.timezone.utc),\n        )\n        if cls != "safe_delete":\n            run_skipped.append({"id": item["id"], "reason": reason})\n            continue\n        api.delete_run(int(item["id"]))\n        run_deleted.append(int(item["id"]))\n\n    return {\n        "artifacts_deleted": deleted,\n        "artifact_skipped": skipped,\n        "workflows_disabled": disabled,\n        "workflow_skipped": workflow_skipped,\n        "workflow_runs_deleted": run_deleted,\n        "workflow_run_skipped": run_skipped,\n    }\n''',
          )

          client = 'automation/scripts/repository_hygiene_github.py'
          replace_once(
              client,
              '    def disable_workflow(self, workflow_id: int):\n        self.request("PUT", f"/repos/{self.repository}/actions/workflows/{workflow_id}/disable", (204,))\n',
              '    def disable_workflow(self, workflow_id: int):\n        self.request("PUT", f"/repos/{self.repository}/actions/workflows/{workflow_id}/disable", (204,))\n\n    def delete_run(self, run_id: int):\n        self.request("DELETE", f"/repos/{self.repository}/actions/runs/{run_id}", (204,))\n',
          )

          renderer = 'automation/scripts/render_repository_hygiene_summary.py'
          replace_once(
              renderer,
              '        workflow_skipped = list(actions_apply.get("workflow_skipped") or [])\n',
              '        workflow_skipped = list(actions_apply.get("workflow_skipped") or [])\n        run_deleted_ids = [int(value) for value in actions_apply.get("workflow_runs_deleted") or []]\n        run_skipped = list(actions_apply.get("workflow_run_skipped") or [])\n',
          )
          replace_once(
              renderer,
              '                f"- Отключено orphaned workflows: **{len(disabled_ids)}**",\n                f"- Пропущено artifacts после повторной проверки: **{len(artifact_skipped)}**",\n',
              '                f"- Отключено orphaned workflows: **{len(disabled_ids)}**",\n                f"- Удалено просроченных runs доказанных orphan-workflows: **{len(run_deleted_ids)}**",\n                f"- Пропущено artifacts после повторной проверки: **{len(artifact_skipped)}**",\n',
          )
          replace_once(
              renderer,
              '                f"- Пропущено workflows после повторной проверки: **{len(workflow_skipped)}**",\n',
              '                f"- Пропущено workflows после повторной проверки: **{len(workflow_skipped)}**",\n                f"- Пропущено workflow runs после повторной проверки: **{len(run_skipped)}**",\n',
          )
          replace_once(
              renderer,
              '''        lines.extend(\n            _details(\n                "Отключённые workflows",\n                [f"`{workflow_names.get(item_id, item_id)}` (id {item_id})" for item_id in disabled_ids],\n            )\n        )\n''',
              '''        lines.extend(\n            _details(\n                "Отключённые workflows",\n                [f"`{workflow_names.get(item_id, item_id)}` (id {item_id})" for item_id in disabled_ids],\n            )\n        )\n        lines.extend(\n            _details(\n                "Удалённые orphan workflow runs",\n                [f"run id {item_id}" for item_id in run_deleted_ids],\n            )\n        )\n''',
          )

          tests = 'automation/tests/test_repository_hygiene.py'
          marker = '    def test_production_artifact_windows(self):\n'
          new_test = '''    def test_completed_orphan_workflow_runs_expire_after_retention(self):\n        now = rh.dt.datetime(2026, 8, 20, tzinfo=rh.dt.timezone.utc)\n        old_run = {"id": 100, "status": "completed", "created_at": "2026-08-01T00:00:00Z"}\n        fresh_run = {"id": 101, "status": "completed", "created_at": "2026-08-10T00:00:00Z"}\n        self.assertEqual(\n            rh.classify_orphan_workflow_run(old_run, "safe_disable", now),\n            ("safe_delete", "expired_orphan_workflow_run"),\n        )\n        self.assertEqual(\n            rh.classify_orphan_workflow_run(fresh_run, "safe_disable", now),\n            ("protected", "recent_orphan_workflow_run"),\n        )\n        self.assertEqual(\n            rh.classify_orphan_workflow_run(old_run, "protected", now),\n            ("review_only", "workflow_not_safe_to_disable"),\n        )\n\n'''
          replace_once(tests, marker, new_test + marker)

          summary_test = 'automation/tests/test_repository_hygiene_summary.py'
          replace_once(
              summary_test,
              '            "workflow_skipped": [],\n',
              '            "workflow_skipped": [],\n            "workflow_runs_deleted": [30],\n            "workflow_run_skipped": [],\n',
          )
          replace_once(
              summary_test,
              '        self.assertIn("`Old patch` (id 20)", text)\n',
              '        self.assertIn("`Old patch` (id 20)", text)\n        self.assertIn("Удалено просроченных runs доказанных orphan-workflows: **1**", text)\n        self.assertIn("run id 30", text)\n',
          )

          replace_once(
              'README.md',
              '''- Старые workflow runs не удаляются автоматически. Зависшие runs orphaned\n  workflows и подозрительно неиспользуемые scripts/config/prompts/specs лишь\n  попадают в отчёт. Source scanner начинает watchlist после пяти merge и\n''',
              '''- Завершённые runs workflow, который уже доказанно классифицирован как\n  orphan (`safe_disable`), сохраняются ещё 14 суток, после чего ежедневная\n  hygiene удаляет их с повторной проверкой workflow и возраста. Runs canonical,\n  защищённых или неоднозначных workflows не затрагиваются. Зависшие queued runs\n  по-прежнему только попадают в отчёт. Source scanner начинает watchlist после пяти merge и\n''',
          )
          replace_once(
              'automation/README.md',
              '''`in_progress` всегда живой. `queued` старше 14 дней считается зависшим и не\nможет навечно защищать orphan-workflow. Такие stale runs попадают в отчёт, но\nпока не удаляются автоматически.\n''',
              '''`in_progress` всегда живой. `queued` старше 14 дней считается зависшим и не\nможет навечно защищать orphan-workflow; такие stale queued runs остаются\nreport-only. Завершённый run удаляется автоматически только после 14 суток и\nтолько если его workflow при повторном плане уже доказанно `safe_disable`.\nCanonical, protected и review-only workflows этим механизмом не затрагиваются.\n''',
          )
          replace_once(
              'AGENTS.md',
              'ephemeral GitHub objects: old merged branch refs, safe Actions artifacts, and\nthe enabled state of orphaned Actions workflows. It must not edit tracked\n',
              'ephemeral GitHub objects: old merged branch refs, safe Actions artifacts, the\nenabled state of orphaned Actions workflows, and completed runs older than 14\ndays only when their workflow is independently classified `safe_disable`. It must not edit tracked\n',
          )
          PY

      - name: Run hygiene regression suite
        run: |
          python -m unittest \
            automation.tests.test_repository_hygiene \
            automation.tests.test_repository_hygiene_summary \
            automation.tests.test_repository_hygiene_workflow -v
          python -m py_compile \
            automation/scripts/repository_hygiene.py \
            automation/scripts/repository_hygiene_policy.py \
            automation/scripts/repository_hygiene_github.py \
            automation/scripts/render_repository_hygiene_summary.py
          git diff --check

      - name: Commit orphan run retention patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            automation/scripts/repository_hygiene_policy.py \
            automation/scripts/repository_hygiene.py \
            automation/scripts/repository_hygiene_github.py \
            automation/scripts/render_repository_hygiene_summary.py \
            automation/tests/test_repository_hygiene.py \
            automation/tests/test_repository_hygiene_summary.py \
            README.md automation/README.md AGENTS.md
          git commit -m 'Expire completed orphan workflow runs safely'
          git push origin HEAD:fix/hygiene-lifecycle-2026-08-09
