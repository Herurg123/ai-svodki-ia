name: Temporary build NotebookLMBot update

on:
  push:
    branches:
      - rebase/automatic-dzen-worker-final

permissions:
  contents: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build NotebookLMBot update artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d278fd594c70b357b5bfdd4f493119829a6dc81
      - name: Build safe local update overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/NotebookLMBot-update
          cp -a automation/notebooklm-video/. /tmp/NotebookLMBot-update/
          rm -f /tmp/NotebookLMBot-update/.gitignore
          cat > /tmp/NotebookLMBot-update/UPDATE-README.txt <<'EOF'
          NotebookLMBot update from main commit 5d278fd594c70b357b5bfdd4f493119829a6dc81

          1. Stop the scheduled/local worker before updating.
          2. Extract this archive over C:\TRASH\NotebookLMBot with file replacement enabled.
          3. DO NOT delete or replace your existing config.json, state.json, ftp-access.json,
             downloads, logs, node_modules, or protected Yandex Browser profile. They are not
             included in this archive.
          4. From C:\TRASH\NotebookLMBot run:
               npm ci --no-audit --no-fund
               node --check scheduled-worker.js
               npm test
          5. Existing config.json without dzenUpload.automaticEnabled is treated as
             automaticEnabled=true. For emergency Dzen automation shutdown set:
               "dzenUpload": { ... , "automaticEnabled": false }
          6. Existing Windows Task Scheduler configuration does not need to change.
             run-worker.cmd now launches scheduled-worker.js, which runs NotebookLM first and
             then the automatic Dzen phase for the latest eligible DONE job.

          This archive intentionally contains no secrets, runtime state, downloaded media,
          logs, browser profile, or node_modules.
          EOF
          cd /tmp/NotebookLMBot-update
          zip -qr /tmp/NotebookLMBot-update-2026-08-28-5d278fd.zip .
          unzip -l /tmp/NotebookLMBot-update-2026-08-28-5d278fd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotebookLMBot-update-2026-08-28-5d278fd
          path: /tmp/NotebookLMBot-update-2026-08-28-5d278fd.zip
          if-no-files-found: error
          retention-days: 2
