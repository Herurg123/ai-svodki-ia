name: Video CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/notebooklm-video/**"
      - ".github/workflows/video-ci.yml"

permissions:
  contents: read

concurrency:
  group: video-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline video checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: automation/notebooklm-video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check worker.js
          for test_file in tests/*.js; do
            node --check "$test_file"
          done

      - name: Syntax-check safe updater builder
        run: node --check scripts/build-safe-update.mjs

      - name: Syntax-check Windows patch installer without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = Join-Path (Get-Location) 'scripts/install-safe-update.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Installer PowerShell syntax check failed'
          }

      - name: Run dependency-free video contract tests
        run: |
          set -euo pipefail
          npm test

      - name: Показать итог Video CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Video CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Video CI::Offline-проверки NotebookLM-video завершились ошибкой. Открой красный шаг выше для технических деталей."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Video CI отменён::Запуск Video CI был отменён до завершения всех проверок."
          fi

  package-safe-update:
    name: Safe Windows update ZIP (main only)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact merged commit with historical baselines
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build SHA-verified Windows patch from allowlisted code
        run: |
          set -euo pipefail
          node automation/notebooklm-video/scripts/build-safe-update.mjs "$RUNNER_TEMP/NotebookLMBot-safe-update.zip"
          unzip -t "$RUNNER_TEMP/NotebookLMBot-safe-update.zip"
          sha256sum "$RUNNER_TEMP/NotebookLMBot-safe-update.zip"

      - name: Upload verified update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NotebookLMBot-safe-update-${{ github.sha }}
          path: ${{ runner.temp }}/NotebookLMBot-safe-update.zip
          retention-days: 30
          if-no-files-found: error
