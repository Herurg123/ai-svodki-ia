name: Video CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/notebooklm-video/**"
      - ".github/workflows/video-ci.yml"

permissions:
  contents: read

concurrency:
  group: video-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline video checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: automation/notebooklm-video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check worker.js
          for test_file in tests/*.js; do
            node --check "$test_file"
          done

      - name: Run dependency-free video contract tests
        run: |
          set -euo pipefail
          npm test

      - name: Upload browser-paste test overlay
        uses: actions/upload-artifact@v4
        with:
          name: dzen-browser-paste-test-overlay
          path: |
            automation/notebooklm-video/dzen-article-video.js
            automation/notebooklm-video/full-worker.js
          if-no-files-found: error
          retention-days: 1

      - name: Показать итог Video CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Video CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Video CI::Offline-проверки NotebookLM-video завершились ошибкой. Открой красный шаг выше для технических деталей."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Video CI отменён::Запуск Video CI был отменён до завершения всех проверок."
          fi
