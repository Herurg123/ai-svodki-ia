name: Video CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/notebooklm-video/**"
      - ".github/workflows/video-ci.yml"

permissions:
  contents: read

concurrency:
  group: video-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline video checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: automation/notebooklm-video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check worker.js
          for test_file in tests/*.js; do
            node --check "$test_file"
          done

      - name: Run dependency-free video contract tests
        run: |
          set -euo pipefail
          npm test
