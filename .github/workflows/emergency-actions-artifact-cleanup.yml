name: Emergency Actions artifact cleanup
run-name: Emergency Actions artifact cleanup ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-actions-artifact-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete oldest obsolete Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: "2026-08-01T00:00:00Z"
          TARGET_BYTES: "536870912"
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          inventory="${RUNNER_TEMP}/artifacts.jsonl"
          : > "${inventory}"

          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${repo}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | @json' > "${inventory}"

          python - "${inventory}" "${CUTOFF}" "${TARGET_BYTES}" > "${RUNNER_TEMP}/delete-plan.tsv" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          inventory = Path(sys.argv[1])
          cutoff = datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
          target = int(sys.argv[3])
          rows = []
          for line in inventory.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              item = json.loads(line)
              created = datetime.fromisoformat(item["created_at"].replace("Z", "+00:00"))
              if item.get("expired"):
                  continue
              if created >= cutoff:
                  continue
              name = str(item.get("name", ""))
              # Actions artifacts only. Never touch repository/public news content.
              rows.append((created, int(item["id"]), int(item.get("size_in_bytes") or 0), name))
          rows.sort()
          total = 0
          for created, artifact_id, size, name in rows:
              if total >= target:
                  break
              safe_name = name.replace("\t", " ").replace("\n", " ")
              print(f"{artifact_id}\t{size}\t{created.isoformat()}\t{safe_name}")
              total += size
          PY

          deleted_bytes=0
          deleted_count=0
          {
            echo "## Emergency Actions artifact cleanup"
            echo
            echo "Cutoff: ${CUTOFF}"
            echo "Target: ${TARGET_BYTES} bytes"
            echo
            echo "| Artifact | Created | Size (bytes) | ID |"
            echo "|---|---:|---:|---:|"
          } >> "${GITHUB_STEP_SUMMARY}"

          while IFS=$'\t' read -r artifact_id size created name; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${repo}/actions/artifacts/${artifact_id}"
            deleted_bytes=$((deleted_bytes + size))
            deleted_count=$((deleted_count + 1))
            printf '| %s | %s | %s | %s |\n' "${name}" "${created}" "${size}" "${artifact_id}" >> "${GITHUB_STEP_SUMMARY}"
          done < "${RUNNER_TEMP}/delete-plan.tsv"

          {
            echo
            echo "Deleted artifacts: ${deleted_count}"
            echo "Deleted bytes: ${deleted_bytes}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Deleted ${deleted_count} artifacts, ${deleted_bytes} bytes."
