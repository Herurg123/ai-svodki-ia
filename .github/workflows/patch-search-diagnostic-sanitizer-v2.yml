name: Patch search diagnostic sanitizer v2
on:
  push:
    branches: [agent/sanitize-search-diagnostic-secrets]
    paths: [.github/workflows/patch-search-diagnostic-sanitizer-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/sanitize-search-diagnostic-secrets, fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('automation/scripts/ensure_story_coverage_policy.py'); s=p.read_text(encoding='utf-8')
          if 'from urllib.parse import parse_qsl' not in s:
              s=s.replace('from typing import Any\n','from typing import Any\nfrom urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\n',1)
          block='''SENSITIVE_URL_QUERY_KEYS = frozenset({"access_token", "api_key", "apikey", "key", "password", "secret", "sig", "signature", "token", "x-amz-credential", "x-amz-security-token", "x-amz-signature"})\n\ndef sanitize_diagnostic_url(value: str) -> str:\n    """Remove credentials from provider-returned URLs before persisting diagnostics."""\n    try:\n        parsed = urlsplit(value)\n    except ValueError:\n        return value\n    if parsed.scheme not in {"http", "https"} or not parsed.query:\n        return value\n    pairs = parse_qsl(parsed.query, keep_blank_values=True)\n    safe_pairs = [(key, item) for key, item in pairs if key.casefold() not in SENSITIVE_URL_QUERY_KEYS]\n    if len(safe_pairs) == len(pairs):\n        return value\n    return urlunsplit((parsed.scheme, parsed.netloc, parsed.path, urlencode(safe_pairs, doseq=True), parsed.fragment))\n\ndef sanitize_diagnostic_value(value: Any) -> Any:\n    if isinstance(value, dict):\n        return {key: sanitize_diagnostic_value(item) for key, item in value.items()}\n    if isinstance(value, (list, tuple)):\n        return [sanitize_diagnostic_value(item) for item in value]\n    if isinstance(value, str):\n        return sanitize_diagnostic_url(value)\n    return value\n\ndef response_to_plain(value: Any) -> Any:\n    if value is None:\n        plain: Any = None\n    elif hasattr(value, "model_dump"):\n        plain = value.model_dump()\n    elif hasattr(value, "to_dict"):\n        plain = value.to_dict()\n    elif isinstance(value, (dict, list, str, int, float, bool)):\n        plain = value\n    else:\n        plain = str(value)\n    return sanitize_diagnostic_value(plain)\n'''
          pattern=r'def response_to_plain\(value: Any\) -> Any:\n.*?\n\nclass CoverageAuditResponseError'
          s2,n=re.subn(pattern,block+'\nclass CoverageAuditResponseError',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'response_to_plain replacement count={n}')
          p.write_text(s2,encoding='utf-8')
          Path('automation/tests/test_search_diagnostic_sanitizer.py').write_text('''from __future__ import annotations\nimport sys, unittest\nfrom pathlib import Path\nSCRIPTS=Path(__file__).resolve().parents[1]/"scripts"; sys.path.insert(0,str(SCRIPTS))\nfrom ensure_story_coverage_policy import sanitize_diagnostic_url, sanitize_diagnostic_value\nclass Tests(unittest.TestCase):\n def test_aws(self):\n  u="https://x.s3.amazonaws.com/a.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ASIAEXAMPLE%2Fscope&X-Amz-Date=20260814T010000Z&X-Amz-Security-Token=IQoJEXAMPLETEMPORARYTOKEN&X-Amz-Signature=deadbeef0123456789"\n  r=sanitize_diagnostic_url(u); self.assertIn("X-Amz-Date=20260814T010000Z",r); self.assertNotIn("Credential",r); self.assertNotIn("Security-Token",r); self.assertNotIn("Signature",r); self.assertNotIn("ASIAEXAMPLE",r)\n def test_nested(self):\n  d={"sources":[{"url":"https://x.test/a?token=abcdefghijklmnop&x=1"}]}; self.assertEqual(sanitize_diagnostic_value(d)["sources"][0]["url"],"https://x.test/a?x=1")\n def test_normal(self):\n  u="https://www.reuters.com/world/a/?utm_source=search"; self.assertEqual(sanitize_diagnostic_url(u),u)\nif __name__=="__main__": unittest.main()\n''',encoding='utf-8')
          note='''\n\n## Hygiene search diagnostics\n\nПеред сохранением Primary, Hybrid и Coverage diagnostics URL, возвращённые search provider, очищаются от временных credential/token/signature query-параметров, включая AWS signed URL. Домен, путь и несекретные параметры сохраняются. Artifact secret-scanner остаётся fail-closed и не получает исключений для подписанных URL.\n'''
          for f in ('README.md','automation/README.md'):
              p=Path(f); t=p.read_text(encoding='utf-8');
              if '## Hygiene search diagnostics' not in t: p.write_text(t+note,encoding='utf-8')
          p=Path('AGENTS.md'); t=p.read_text(encoding='utf-8'); an='''\n\n## Search diagnostic secret hygiene\n\nProvider-returned URLs may contain temporary signed credentials. Before persisting Primary, Hybrid or Coverage diagnostics, strip credential/token/signature query parameters while preserving source identity. Never weaken the artifact secret scanner to permit signed credentials.\n'''
          if '## Search diagnostic secret hygiene' not in t: p.write_text(t+an,encoding='utf-8')
          PY
          rm -f .github/workflows/patch-search-diagnostic-sanitizer.yml .github/workflows/patch-search-diagnostic-sanitizer-v2.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'Sanitize signed credentials from search diagnostics' && git push origin HEAD:agent/sanitize-search-diagnostic-secrets
