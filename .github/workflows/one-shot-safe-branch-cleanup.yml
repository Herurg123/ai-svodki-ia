name: One-shot safe branch cleanup
run-name: One-shot safe branch cleanup ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: one-shot-safe-branch-cleanup
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  cleanup:
    name: Delete exact proven garbage branches
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/one-shot-safe-branch-cleanup-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Re-prove invariants and delete exact refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 227d06e4755ba996829c5f4636c24fe0cd0362b0
          CLEANUP_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          OWNER = REPO.split("/", 1)[0]
          TOKEN = os.environ["GITHUB_TOKEN"]
          EXPECTED_MAIN = os.environ["EXPECTED_MAIN_SHA"]
          PR_NUMBER = int(os.environ["CLEANUP_PR_NUMBER"])
          SELF_BRANCH = "ops/one-shot-safe-branch-cleanup-2026-09-19"

          TARGETS = {
              "build/notebooklm-video-update-2026-08-28": "ae898290520a7af250b71cbc57ecbf74588728a7",
              "diag/aug16-editorial-replay": "d770eef0e92268805e26893b13507872dfb95a2a",
              "fix/regional-recall-plus1-hybrid-current": "ae898290520a7af250b71cbc57ecbf74588728a7",
              "fix/2026-08-29-audit-defects-123": "403e49878e63db536887655cfaba5f746209a5c0",
              "tmp-noop": "ae898290520a7af250b71cbc57ecbf74588728a7",
              "tmp-noop-2": "ae898290520a7af250b71cbc57ecbf74588728a7",
              "agent/video-lockfile-generator-2026-08-25": "657526ca64673598e3c3d7d66708f1a8965bce66",
              "audit/sep9-independent-release-ab": "88dfab0a8e9807506f01f04445c13107af2d061e",
          }
          ACTIVE_STATUSES = ("queued", "in_progress", "waiting", "requested", "pending")

          def api(method, path, payload=None, allow_404=False):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              body = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ai-svodki-one-shot-branch-cleanup",
              }
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {exc.code}: {detail}") from exc

          def ref_path(branch, plural=False):
              encoded = urllib.parse.quote(branch, safe="/")
              prefix = "git/refs/heads" if plural else "git/ref/heads"
              return f"{prefix}/{encoded}"

          # Fail closed if this operational PR is not exactly the expected same-repo PR.
          pr = api("GET", f"pulls/{PR_NUMBER}")
          if pr["state"] != "open":
              raise RuntimeError(f"cleanup PR #{PR_NUMBER} is not open")
          if pr["base"]["ref"] != "main":
              raise RuntimeError(f"cleanup PR base is {pr['base']['ref']!r}, expected 'main'")
          if pr["head"]["ref"] != SELF_BRANCH:
              raise RuntimeError(f"cleanup PR head is {pr['head']['ref']!r}, expected {SELF_BRANCH!r}")
          if pr["head"]["repo"]["full_name"] != REPO:
              raise RuntimeError("cleanup PR is not a same-repository PR")

          # Pin the repository state to the exact main that was independently audited.
          main = api("GET", "git/ref/heads/main")
          current_main = main["object"]["sha"]
          if current_main != EXPECTED_MAIN:
              raise RuntimeError(
                  f"main changed: expected {EXPECTED_MAIN}, found {current_main}; deleting nothing"
              )

          # Re-prove every target before making the first destructive request.
          for branch, expected_sha in TARGETS.items():
              if branch in {"main", "archive/search-baseline-pre-hybrid-2026-08-09", SELF_BRANCH}:
                  raise RuntimeError(f"refusing protected/self branch {branch!r}")

              ref = api("GET", ref_path(branch))
              current_sha = ref["object"]["sha"]
              if current_sha != expected_sha:
                  raise RuntimeError(
                      f"{branch}: head changed; expected {expected_sha}, found {current_sha}"
                  )

              query = urllib.parse.urlencode({
                  "state": "open",
                  "head": f"{OWNER}:{branch}",
                  "per_page": "1",
              })
              open_prs = api("GET", f"pulls?{query}")
              if open_prs:
                  numbers = [item["number"] for item in open_prs]
                  raise RuntimeError(f"{branch}: open PR(s) now exist: {numbers}")

              for status in ACTIVE_STATUSES:
                  query = urllib.parse.urlencode({
                      "branch": branch,
                      "status": status,
                      "per_page": "1",
                  })
                  runs = api("GET", f"actions/runs?{query}")
                  if runs.get("total_count", 0):
                      raise RuntimeError(
                          f"{branch}: active Actions run exists with status {status!r}"
                      )

          deleted = []
          for branch in TARGETS:
              api("DELETE", ref_path(branch, plural=True))
              deleted.append(branch)

          # Verify all eight refs are actually gone before closing the disposable PR.
          for branch in TARGETS:
              if api("GET", ref_path(branch), allow_404=True) is not None:
                  raise RuntimeError(f"{branch}: ref still exists after DELETE")

          # Close only this disposable operational PR. Its unchanged branch is then
          # intentionally left for normal repository hygiene TTL cleanup.
          api("PATCH", f"pulls/{PR_NUMBER}", {"state": "closed"})

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## One-shot branch cleanup complete\n\n")
                  fh.write(f"- pinned main: \`{EXPECTED_MAIN}\`\n")
                  fh.write(f"- deleted refs: **{len(deleted)}**\n")
                  for branch in deleted:
                      fh.write(f"  - \`{branch}\`\n")
                  fh.write(
                      f"- closed disposable PR #{PR_NUMBER}; its branch is left "
                      "unchanged for normal Repository hygiene TTL cleanup.\n"
                  )
          PY
