name: One-shot superseded Sep1 audit branch cleanup
run-name: One-shot superseded Sep1 audit branch cleanup ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/one-shot-safe-branch-cleanup-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Re-prove supersession, delete branch, verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 6797e0b81063b92e36f0b3d80c0239c5d3a64bb5
          CLEANUP_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          OWNER = REPO.split("/", 1)[0]
          TOKEN = os.environ["GITHUB_TOKEN"]
          EXPECTED_MAIN = os.environ["EXPECTED_MAIN_SHA"]
          PR_NUMBER = int(os.environ["CLEANUP_PR_NUMBER"])
          SELF_BRANCH = "ops/one-shot-safe-branch-cleanup-2026-09-19"

          TARGET_BRANCH = "audit/2026-09-01-independent-retrieval"
          TARGET_HEAD = "6df0b0ffb7d1c556435e1f5fce58c8e26d6bd83e"
          COMMON_PARENT = "3ff9244f0cf7d534030a3a89d7e36fb72655557e"
          TARGET_PATH = "automation/audits/2026-09-01-independent-release-audit.md"

          ACCEPTED_PR = 137
          ACCEPTED_AUDIT = "e426e753ec34b053dc486a20c8d2cc29bed61823"
          ACCEPTED_HEAD = "971a703fb8d398827e15165fed51bd538a7c27d0"
          ACCEPTED_MERGE = "55590d72fbc6b4f1c3566bede65f018cbac9eb4f"

          ACTIVE = {"queued", "in_progress", "waiting", "requested", "pending"}

          def api(method, path, payload=None, allow_404=False):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              body = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ai-svodki-superseded-audit-cleanup",
              }
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {exc.code}: {detail}") from exc

          def enc(value):
              return urllib.parse.quote(value, safe="/")

          pr = api("GET", f"pulls/{PR_NUMBER}")
          if pr["state"] != "open" or pr["base"]["ref"] != "main":
              raise RuntimeError("cleanup PR state/base changed")
          if pr["head"]["ref"] != SELF_BRANCH or pr["head"]["repo"]["full_name"] != REPO:
              raise RuntimeError("cleanup PR identity changed")

          current_main = api("GET", "git/ref/heads/main")["object"]["sha"]
          if current_main != EXPECTED_MAIN:
              raise RuntimeError(f"main changed: expected {EXPECTED_MAIN}, found {current_main}")

          target_ref = api("GET", f"git/ref/heads/{enc(TARGET_BRANCH)}")
          if target_ref["object"]["sha"] != TARGET_HEAD:
              raise RuntimeError("target branch head changed")

          target_commit = api("GET", f"commits/{TARGET_HEAD}")
          parents = [item["sha"] for item in target_commit.get("parents", [])]
          if parents != [COMMON_PARENT]:
              raise RuntimeError(f"target parent changed: {parents}")
          target_files = target_commit.get("files", [])
          if len(target_files) != 1:
              raise RuntimeError("target commit no longer has exactly one changed file")
          only = target_files[0]
          if only.get("filename") != TARGET_PATH or only.get("status") != "added":
              raise RuntimeError("target commit file scope changed")

          # Exact target branch must have no PR and no workflow runs.
          q = urllib.parse.urlencode({"state":"all","head":f"{OWNER}:{TARGET_BRANCH}","per_page":"100"})
          if api("GET", f"pulls?{q}"):
              raise RuntimeError("target branch has PR history; re-audit required")
          q = urllib.parse.urlencode({"branch":TARGET_BRANCH,"per_page":"100"})
          target_runs = api("GET", f"actions/runs?{q}")
          if target_runs.get("total_count", 0) != 0:
              raise RuntimeError("target branch has Actions history; re-audit required")

          accepted_pr = api("GET", f"pulls/{ACCEPTED_PR}")
          if (
              not accepted_pr.get("merged")
              or accepted_pr.get("head", {}).get("sha") != ACCEPTED_HEAD
              or accepted_pr.get("merge_commit_sha") != ACCEPTED_MERGE
          ):
              raise RuntimeError("accepted PR #137 identity changed")

          accepted_commit = api("GET", f"commits/{ACCEPTED_AUDIT}")
          accepted_parents = [item["sha"] for item in accepted_commit.get("parents", [])]
          if accepted_parents != [COMMON_PARENT]:
              raise RuntimeError("accepted audit no longer shares target parent")
          accepted_files = accepted_commit.get("files", [])
          if len(accepted_files) != 1 or accepted_files[0].get("filename") != TARGET_PATH:
              raise RuntimeError("accepted audit file scope changed")

          compare = api("GET", f"compare/{ACCEPTED_MERGE}...{EXPECTED_MAIN}")
          if compare.get("behind_by") != 0 or compare.get("merge_base_commit", {}).get("sha") != ACCEPTED_MERGE:
              raise RuntimeError("accepted PR #137 merge is not an ancestor of current main")

          for status in sorted(ACTIVE):
              q = urllib.parse.urlencode({"branch":TARGET_BRANCH,"status":status,"per_page":"1"})
              if api("GET", f"actions/runs?{q}").get("total_count", 0):
                  raise RuntimeError(f"target branch has active run status={status}")

          api("DELETE", f"git/refs/heads/{enc(TARGET_BRANCH)}")

          if api("GET", f"git/ref/heads/{enc(TARGET_BRANCH)}", allow_404=True) is not None:
              raise RuntimeError("target branch still exists after DELETE")
          if api("GET", "git/ref/heads/main")["object"]["sha"] != EXPECTED_MAIN:
              raise RuntimeError("main changed during cleanup")

          api("PATCH", f"pulls/{PR_NUMBER}", {"state":"closed"})

          print("CLEANUP_RESULT", json.dumps({
              "deleted_branch": TARGET_BRANCH,
              "main": EXPECTED_MAIN,
              "accepted_pr": ACCEPTED_PR,
              "accepted_merge": ACCEPTED_MERGE,
              "pr_closed": PR_NUMBER,
          }, sort_keys=True))
          PY
