name: One-shot orphan cleanup verifier
run-name: One-shot orphan cleanup verifier ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/one-shot-safe-branch-cleanup-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify orphan cleanup and close disposable PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 227d06e4755ba996829c5f4636c24fe0cd0362b0
          CLEANUP_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO=os.environ["GITHUB_REPOSITORY"]
          TOKEN=os.environ["GITHUB_TOKEN"]
          EXPECTED=os.environ["EXPECTED_MAIN_SHA"]
          PR_NUMBER=int(os.environ["CLEANUP_PR_NUMBER"])
          SELF_BRANCH="ops/one-shot-safe-branch-cleanup-2026-09-19"

          CLEANED={
              335355114: ".github/workflows/diag-aug16-editorial-replay.yml",
              342216302: ".github/workflows/video-lockfile-generator.yml",
              344297155: ".github/workflows/package-notebooklm-video-update.yml",
          }
          RETAINED={
              344367759: (".github/workflows/build-notebooklm-update.yml","rebase/automatic-dzen-worker-final"),
              344361682: (".github/workflows/apply-dzen-rebase-docs.yml","rebase/automatic-dzen-worker-final"),
          }

          def api(method,path,payload=None,allow404=False):
              url=f"https://api.github.com/repos/{REPO}/{path}"
              body=None
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"ai-svodki-orphan-cleanup-verifier",
              }
              if payload is not None:
                  body=json.dumps(payload).encode()
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      return None if not raw else json.loads(raw.decode())
              except urllib.error.HTTPError as e:
                  if allow404 and e.code==404:
                      return None
                  detail=e.read().decode("utf-8",errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {e.code}: {detail}") from e

          pr=api("GET",f"pulls/{PR_NUMBER}")
          if pr["state"]!="open" or pr["base"]["ref"]!="main":
              raise RuntimeError("cleanup PR state/base changed")
          if pr["head"]["ref"]!=SELF_BRANCH or pr["head"]["repo"]["full_name"]!=REPO:
              raise RuntimeError("cleanup PR identity changed")

          main=api("GET","git/ref/heads/main")["object"]["sha"]
          if main!=EXPECTED:
              raise RuntimeError(f"main changed: {main}")

          cleaned_state={}
          for wid,path in CLEANED.items():
              workflow=api("GET",f"actions/workflows/{wid}",allow404=True)
              if workflow is None:
                  cleaned_state[wid]="absent"
                  continue
              if workflow.get("path")!=path:
                  raise RuntimeError(f"cleaned workflow {wid} identity changed")
              if workflow.get("state")!="disabled_manually":
                  raise RuntimeError(f"cleaned workflow {wid} still active")
              runs=api("GET",f"actions/workflows/{wid}/runs?per_page=100")
              if runs.get("total_count",0)!=0:
                  raise RuntimeError(f"cleaned workflow {wid} still has runs")
              cleaned_state[wid]="disabled_no_runs"

          retained_state={}
          for wid,(path,branch) in RETAINED.items():
              workflow=api("GET",f"actions/workflows/{wid}")
              if workflow.get("path")!=path:
                  raise RuntimeError(f"retained workflow {wid} identity changed")
              enc=urllib.parse.quote(branch,safe="/")
              if api("GET",f"git/ref/heads/{enc}",allow404=True) is None:
                  raise RuntimeError(f"retained branch {branch!r} disappeared")
              retained_state[wid]=workflow.get("state")

          api("PATCH",f"pulls/{PR_NUMBER}",{"state":"closed"})

          print("VERIFY_RESULT",json.dumps({
              "cleaned":cleaned_state,
              "retained":retained_state,
              "main":main,
              "pr_closed":PR_NUMBER,
          },sort_keys=True))
          PY
