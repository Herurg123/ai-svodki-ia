name: One-shot workflow orphan audit
run-name: One-shot workflow orphan audit ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/one-shot-safe-branch-cleanup-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print exact legacy workflow map
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 227d06e4755ba996829c5f4636c24fe0cd0362b0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          REPO=os.environ["GITHUB_REPOSITORY"]
          TOKEN=os.environ["GITHUB_TOKEN"]
          EXPECTED=os.environ["EXPECTED_MAIN_SHA"]
          TARGETS=[335355114,342216302,344367759,344297155,344361682]
          def api(path, allow404=False):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/{path}",
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"ai-svodki-workflow-orphan-audit",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw=r.read()
                      return None if not raw else json.loads(raw.decode())
              except urllib.error.HTTPError as e:
                  if allow404 and e.code==404:
                      return None
                  raise
          main=api("git/ref/heads/main")["object"]["sha"]
          if main!=EXPECTED:
              raise RuntimeError(f"main changed: {main}")
          out=[]
          for wid in TARGETS:
              w=api(f"actions/workflows/{wid}")
              runs=api(f"actions/workflows/{wid}/runs?per_page=100")
              rows=[]
              for r in runs.get("workflow_runs",[]):
                  rows.append({
                      "id":r["id"],
                      "branch":r.get("head_branch"),
                      "sha":r.get("head_sha"),
                      "event":r.get("event"),
                      "status":r.get("status"),
                      "conclusion":r.get("conclusion"),
                      "created_at":r.get("created_at"),
                      "display_title":r.get("display_title"),
                  })
              out.append({
                  "workflow_id":wid,
                  "name":w.get("name"),
                  "path":w.get("path"),
                  "state":w.get("state"),
                  "total_count":runs.get("total_count"),
                  "runs":rows,
              })
          print("WORKFLOW_MAP_BEGIN")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print("WORKFLOW_MAP_END")
          PY
