name: One-shot abandoned Dzen branch cleanup
run-name: One-shot abandoned Dzen branch cleanup ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/one-shot-safe-branch-cleanup-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Re-prove supersession, delete branch, verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 227d06e4755ba996829c5f4636c24fe0cd0362b0
          CLEANUP_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          OWNER = REPO.split("/", 1)[0]
          TOKEN = os.environ["GITHUB_TOKEN"]
          EXPECTED_MAIN = os.environ["EXPECTED_MAIN_SHA"]
          PR_NUMBER = int(os.environ["CLEANUP_PR_NUMBER"])
          SELF_BRANCH = "ops/one-shot-safe-branch-cleanup-2026-09-19"

          TARGET_BRANCH = "fix/dzen-shared-browser-session"
          TARGET_HEAD = "da6ee14ed9aa54cffaa3ac4cfbd1e854a36b9f5b"
          TARGET_TREE = "7b44c7a6970241bd227163e785c85418b34be5cf"
          SUCCESSOR_PR = 103
          SUCCESSOR_MERGE = "e69cbdf593f9de22cb43012e7b544ed7a84d970e"
          REQUIRED_SUCCESSOR_COMMITS = {
              "d38dc2ec6983ec1182ca046d9b9b17b12caac35e",
              "94aae166be11549a056592d15e59dfa6ee3f4607",
              "8739de0eea00d1688b8bf04c9c5ec29dd8a4800c",
              "5e452281312aa994cd12bb33a024da65e16aae84",
              "13520aae993ccdfeb4f023aa76a69a43e3e9e373",
          }
          ACTIVE = {"queued", "in_progress", "waiting", "requested", "pending"}

          def api(method, path, payload=None, allow_404=False):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              body = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ai-svodki-abandoned-dzen-cleanup",
              }
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {exc.code}: {detail}") from exc

          def enc(value):
              return urllib.parse.quote(value, safe="/")

          def main_text(path):
              encoded = urllib.parse.quote(path, safe="/")
              obj = api("GET", f"contents/{encoded}?ref=main")
              return base64.b64decode(obj["content"]).decode("utf-8")

          pr = api("GET", f"pulls/{PR_NUMBER}")
          if pr["state"] != "open" or pr["base"]["ref"] != "main":
              raise RuntimeError("cleanup PR state/base changed")
          if pr["head"]["ref"] != SELF_BRANCH or pr["head"]["repo"]["full_name"] != REPO:
              raise RuntimeError("cleanup PR identity changed")

          current_main = api("GET", "git/ref/heads/main")["object"]["sha"]
          if current_main != EXPECTED_MAIN:
              raise RuntimeError(f"main changed: expected {EXPECTED_MAIN}, found {current_main}")

          target_ref = api("GET", f"git/ref/heads/{enc(TARGET_BRANCH)}")
          if target_ref["object"]["sha"] != TARGET_HEAD:
              raise RuntimeError("target branch head changed")
          target_commit = api("GET", f"commits/{TARGET_HEAD}")
          if target_commit["commit"]["tree"]["sha"] != TARGET_TREE:
              raise RuntimeError("target branch tree changed")

          q = urllib.parse.urlencode({"state":"open","head":f"{OWNER}:{TARGET_BRANCH}","per_page":"100"})
          if api("GET", f"pulls?{q}"):
              raise RuntimeError("target branch acquired an open PR")

          for status in sorted(ACTIVE):
              q = urllib.parse.urlencode({"branch":TARGET_BRANCH,"status":status,"per_page":"1"})
              if api("GET", f"actions/runs?{q}").get("total_count", 0):
                  raise RuntimeError(f"target branch has active run status={status}")

          successor = api("GET", f"pulls/{SUCCESSOR_PR}")
          if not successor.get("merged") or successor.get("merge_commit_sha") != SUCCESSOR_MERGE:
              raise RuntimeError("successor PR #103 merge identity changed")

          compare = api("GET", f"compare/{SUCCESSOR_MERGE}...{EXPECTED_MAIN}")
          if compare.get("behind_by") != 0 or compare.get("merge_base_commit", {}).get("sha") != SUCCESSOR_MERGE:
              raise RuntimeError("successor merge is not an ancestor of current main")

          commits = api("GET", f"pulls/{SUCCESSOR_PR}/commits?per_page=100")
          present = {item["sha"] for item in commits}
          missing = REQUIRED_SUCCESSOR_COMMITS - present
          if missing:
              raise RuntimeError(f"required successor history missing: {sorted(missing)}")

          worker = main_text("automation/notebooklm-video/worker.js")
          if "browser-session" in worker or "createBrowserSession" in worker:
              raise RuntimeError("current worker architecture changed; re-audit required")

          dzen = main_text("automation/notebooklm-video/dzen-publish.js")
          if "readVideoDraftFromUrl" in dzen or "DZEN_DRAFT_DISCOVERY_TIMEOUT_MS" in dzen:
              raise RuntimeError("old draft-recovery semantics reappeared; re-audit required")
          if "Не считаю это доказательством провала загрузки" not in dzen:
              raise RuntimeError("current accepted upload-timeout contract changed")

          api("DELETE", f"git/refs/heads/{enc(TARGET_BRANCH)}")

          if api("GET", f"git/ref/heads/{enc(TARGET_BRANCH)}", allow_404=True) is not None:
              raise RuntimeError("target branch still exists after DELETE")
          if api("GET", "git/ref/heads/main")["object"]["sha"] != EXPECTED_MAIN:
              raise RuntimeError("main changed during cleanup")

          api("PATCH", f"pulls/{PR_NUMBER}", {"state":"closed"})

          print("CLEANUP_RESULT", json.dumps({
              "deleted_branch": TARGET_BRANCH,
              "main": EXPECTED_MAIN,
              "successor_pr": SUCCESSOR_PR,
              "pr_closed": PR_NUMBER,
          }, sort_keys=True))
          PY
