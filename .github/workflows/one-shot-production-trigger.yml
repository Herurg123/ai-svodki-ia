name: One-shot Reuters sentinel v3 production trigger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-production-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired daily production
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/daily-production.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"publication_date":"2026-08-08","publish":"true","recovery_run_id":"31240060433"}}'
          echo "Daily production for 2026-08-08 dispatched from v2 artifact 31240060433; v3 should reuse six mandatory passes, replace only the stale sentinel and run one concise Reuters security search."
