          PY
      - name: Normalize and validate digest artifact
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        shell: bash
        env:
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
        run: |
          set -euo pipefail
          artifact_dir="automation/preview/${PUBLICATION_DATE}"
          python automation/scripts/normalize_digest_artifact.py \
            --artifact-dir "${artifact_dir}" \
            --report "${artifact_dir}/artifact-normalization.json"
          python automation/scripts/validate_digest_artifact.py \
            --artifact-dir "${artifact_dir}" \
            --report "${artifact_dir}/artifact-validation.json"
      - name: Validate publishable story count and short digest marker
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        shell: bash
        env:
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
        run: |
          set -euo pipefail
          python automation/scripts/validate_story_coverage.py \
            --artifact-dir "automation/preview/${PUBLICATION_DATE}" \
            --usual-total 7 \
            --minimum-publishable 1 \
            --report automation/preview/production-daily/story-coverage-validation.json
      - name: Build runtime Image API request
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true' && steps.recovery.outputs.image_recovered != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/create_production_image_request.py \
            --source-dir "automation/preview/${{ steps.runtime.outputs.publication_date }}" \
            --publication-date "${{ steps.runtime.outputs.publication_date }}" \
            --request-id "${{ steps.runtime.outputs.image_request_id }}" \
            --output automation/preview/production-daily/image-request.json
      - name: Generate one production cover
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true' && steps.recovery.outputs.image_recovered != 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
        run: |
          set -euo pipefail
          image_dir="automation/preview/production-daily/image/${{ steps.runtime.outputs.publication_date }}"
          rm -rf "${image_dir}"
          python automation/scripts/generate_image_preview.py \
            --source-dir "automation/preview/${{ steps.runtime.outputs.publication_date }}" \
            --output-dir "${image_dir}" \
            --request automation/preview/production-daily/image-request.json \
            --model "${OPENAI_IMAGE_MODEL}"
          python automation/scripts/validate_cover_contract.py \
            --artifact-dir "${image_dir}" \
            --report "${image_dir}/cover-validation.json"
      - name: Revalidate recovered production cover
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true' && steps.recovery.outputs.image_recovered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_dir="automation/preview/production-daily/image/${{ steps.runtime.outputs.publication_date }}"
          python automation/scripts/validate_cover_contract.py \
            --artifact-dir "${image_dir}" \
            --report "${image_dir}/cover-validation.json"
      - name: Build and validate candidate site
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.runtime.outputs.publication_date }}"
          source_dir="automation/preview/production-daily/image/${date}"
          candidate_root="automation/preview/production-daily/candidate"
          python automation/scripts/run_build_site.py \
            --source-dir "${source_dir}" \
            --output-dir "${candidate_root}/posts" \
            --build-info "${candidate_root}/build-info.json"
          python automation/scripts/normalize_production_rss.py \
            --rss "${candidate_root}/posts/rss.xml" \
            --feed-url "https://rybalka.one/posts/rss.xml" \
            --site-link "https://rybalka.one/posts" \
            --report "${candidate_root}/rss-normalization.json"
          python automation/scripts/inject_blogposting_schema.py \
            --config automation/config/structured-data.json \
            --source-dir "${source_dir}" \
            --posts-root "${candidate_root}/posts" \
            --report "${candidate_root}/structured-data-injection.json"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${source_dir}" \
            --posts-root "${candidate_root}/posts" \
            --report "${candidate_root}/structured-data-validation.json"
          python automation/scripts/build_posts_sitemap.py \
            --rss "${candidate_root}/posts/rss.xml" \
            --posts-root "${candidate_root}/posts" \
            --output "${candidate_root}/posts/sitemap.xml" \
            --report "${candidate_root}/posts-sitemap-build.json"
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap "${candidate_root}/posts/sitemap.xml" \
            --rss "${candidate_root}/posts/rss.xml" \
            --report "${candidate_root}/posts-sitemap-validation.json"
          python automation/scripts/run_validate_site.py \
            --source-dir "${source_dir}" \
            --site-dir "${candidate_root}/posts" \
            --report "${candidate_root}/site-validation.json"
          python automation/scripts/validate_dzen_feed.py \
            --rss "${candidate_root}/posts/rss.xml" \
            --report "${candidate_root}/dzen-feed-validation.json"
      - name: Dry-run or promote candidate
        if: steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        shell: bash
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${PUBLISH}" != "true" ]]; then
            args+=(--dry-run)
          fi
          python automation/scripts/promote_production_site.py \
            --config automation/config/production-daily.json \
            --candidate-posts automation/preview/production-daily/candidate/posts \
            --live-posts posts \
            --source-dir "automation/preview/production-daily/image/${{ steps.runtime.outputs.publication_date }}" \
            --content-root automation/content \
            --publication-date "${{ steps.runtime.outputs.publication_date }}" \
            --report automation/preview/production-daily/promotion.json \
            "${args[@]}"
      - name: Refresh archive after promotion
        if: steps.mode.outputs.publish == 'true' && steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        run: |
          set -euo pipefail
          python automation/scripts/bootstrap_archive.py
          python automation/scripts/validate_archive.py
      - name: Restore repository site config
        if: always()
        run: |
          set -euo pipefail
          if [[ -f automation/preview/production-daily/preflight/site.json.original ]]; then
            cp automation/preview/production-daily/preflight/site.json.original automation/config/site.json
          fi
      - name: Commit production release
        id: commit
        if: steps.mode.outputs.publish == 'true' && steps.terminal_reuse.outputs.stop != 'true' && steps.coverage.outputs.editorial_stop != 'true'
        shell: bash
        env:
          MAIN_PUSH_DEPLOY_KEY: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          date="${{ steps.runtime.outputs.publication_date }}"
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "main changed while generation was running; refusing to push" >&2
            exit 1
          }
          python automation/scripts/validate_publish_changes.py \
            --publication-date "${date}" \
            --report automation/preview/production-daily/publish-changes.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish AI digest for ${date}"
          commit_sha="$(git rev-parse HEAD)"
          bash automation/scripts/push_protected_main.sh HEAD:main
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
      - name: Publish Russian pipeline status
        if: always() && steps.terminal_reuse.outputs.stop != 'true'
        continue-on-error: true
        shell: bash
        env:
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date || needs.gate.outputs.publication_date }}
          PUBLISH: ${{ steps.mode.outputs.publish || 'false' }}
          RECOVERY_RUN_ID: ${{ steps.recovery_source.outputs.run_id || '' }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha || '' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python automation/scripts/summarize_production_status.py \
            --job-status "${PIPELINE_JOB_STATUS}" \
            --publication-date "${PUBLICATION_DATE}" \
            --publish "${PUBLISH}" \
            --recovery-run-id "${RECOVERY_RUN_ID}" \
            --run-url "${RUN_URL}" \
            --commit-sha "${COMMIT_SHA}" \
            --output automation/preview/production-daily/pipeline-status.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-production-${{ steps.runtime.outputs.publication_date || github.run_id }}
          path: |
            automation/preview/production-daily/
            automation/preview/${{ steps.runtime.outputs.publication_date }}/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    name: Deploy published posts
    needs: production
    if: needs.production.result == 'success' && needs.production.outputs.publish == 'true' && needs.production.outputs.commit_sha != ''
    uses: ./.github/workflows/deploy-posts.yml
    with:
      ref: ${{ needs.production.outputs.commit_sha }}
    secrets: inherit
  final_status:
    name: Итог публикации
    needs:
      - gate
      - redeploy_existing
      - production
      - deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Показать общий итог
        shell: bash
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          REDEPLOY_RESULT: ${{ needs.redeploy_existing.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo "## Итог Daily production digest"
            echo
            echo "| Этап | Результат |"
            echo "|---|---|"
            echo "| Gate | ${GATE_RESULT} |"
            echo "| Production | ${PRODUCTION_RESULT} |"
            echo "| Deploy | ${DEPLOY_RESULT} |"
            echo "| FTP-only redeploy | ${REDEPLOY_RESULT} |"
            echo
            echo "Подробная русскоязычная причина production-ошибки находится выше в Summary job production."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${GATE_RESULT}" == "failure" ]]; then
            echo "::error title=Ошибка gate::Не пройдена предварительная проверка RSS или сайта. Платные API не вызывались."
          elif [[ "${PRODUCTION_RESULT}" == "failure" ]]; then
            echo "::error title=Ошибка production::Выпуск не опубликован. Подробная причина выведена в русскоязычном Summary job production."
          elif [[ "${DEPLOY_RESULT}" == "failure" || "${REDEPLOY_RESULT}" == "failure" ]]; then
            echo "::error title=Ошибка FTP::Контент создан, но FTP-развёртывание завершилось ошибкой. Повторный research не нужен."
          fi
