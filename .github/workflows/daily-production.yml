name: Daily production digest
run-name: Daily production digest ${{ github.run_id }}
on:
  schedule:
    # Single native GitHub schedule: 02:17 Europe/Moscow (23:17 UTC).
    # Availability backup is external (cron-job.org) and uses workflow_dispatch.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      publication_date:
        description: "Optional YYYY-MM-DD override"
        required: false
        type: string
      publish:
        description: "Commit and push to main"
        required: true
        default: false
        type: boolean
      recovery_run_id:
        description: "Optional failed run ID whose saved paid research/editorial artifact should be reused"
        required: false
        type: string
      force_fresh_research:
        description: "Ignore automatic same-day recovery and run fresh research on current main"
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: write

concurrency:
  group: daily-production-main
  cancel-in-progress: false
jobs:
  gate:
    name: Check whether today's digest is needed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publication_date: ${{ steps.gate.outputs.publication_date }}
      should_run: ${{ steps.gate.outputs.should_run }}
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      target_url: ${{ steps.gate.outputs.target_url }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Check RSS before paid APIs
        id: gate
        shell: bash
        env:
          DATE_OVERRIDE: ${{ inputs.publication_date || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          override = os.environ.get("DATE_OVERRIDE", "").strip()
          publication_date = override or datetime.now(ZoneInfo("Europe/Moscow")).date().isoformat()
          target_url = f"https://rybalka.one/posts/{publication_date}/"
          root = ET.parse(Path("posts/rss.xml")).getroot()
          links = {
              (item.findtext("link") or "").strip()
              for item in root.findall("./channel/item")
          }
          repository_has_release = target_url in links
          should_run = not repository_has_release
          should_deploy = False
          live_status = "not_checked"
          if repository_has_release:
              article = Path("posts") / publication_date / "index.html"
              image = Path("posts/images") / f"ai-svodka-{publication_date}.png"
              if not article.is_file() or not image.is_file():
                  raise SystemExit(
                      "RSS contains the release but canonical article/image files are missing"
                  )
              request = urllib.request.Request(
                  target_url, headers={"User-Agent": "ai-svodki-production-gate/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      live_status = str(response.status)
                      should_deploy = response.status != 200
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  live_status = f"unavailable:{type(exc).__name__}"
                  should_deploy = True
          main_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"publication_date={publication_date}\n")
              stream.write(f"target_url={target_url}\n")
              stream.write(f"main_sha={main_sha}\n")
              stream.write(f"should_run={'true' if should_run else 'false'}\n")
              stream.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
          action = "produce" if should_run else ("redeploy" if should_deploy else "no-op")
          print(
              f"Production gate: {action} for {publication_date}; live={live_status}"
          )
          PY
      - name: No-op summary
        if: steps.gate.outputs.should_run == 'false' && steps.gate.outputs.should_deploy == 'false'
        shell: bash
        run: |
          {
            echo "## Daily production digest"
            echo
            echo "- Status: successful no-op"
            echo "- Already published: ${{ steps.gate.outputs.target_url }}"
            echo "- Paid API calls: 0"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Показать причину ошибки gate
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ ИИ-Сводка не запущена"
            echo
            echo "- **Этап:** предварительная проверка RSS и сайта"
            echo "- **Причина:** откройте первый красный шаг в job gate"
            echo "- **Платные API:** не вызывались"
            echo "- **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=ИИ-Сводка не запущена::Ошибка предварительной проверки RSS или сайта. Платные API не вызывались."
  redeploy_existing:
    name: Redeploy already committed release
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-posts.yml
    with:
      ref: ${{ needs.gate.outputs.main_sha }}
    secrets: inherit
  production:
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      editorial_stop: ${{ steps.coverage.outputs.editorial_stop }}
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIPELINE_MODE: full

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Determine publish mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=${MANUAL_PUBLISH}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Validate production contract before API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/preview/production-daily/preflight
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/production-daily/preflight/contract.json
      - name: Prepare runtime and verify archive freshness
        id: runtime
        shell: bash
        env:
          DATE_OVERRIDE: ${{ needs.gate.outputs.publication_date }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${DATE_OVERRIDE}" ]]; then
            args+=(--publication-date "${DATE_OVERRIDE}")
          fi
          python automation/scripts/prepare_production_daily.py \
            --config automation/config/production-daily.json \
            --rss posts/rss.xml \
            --output automation/preview/production-daily/preflight/runtime.json \
            --github-output "${GITHUB_OUTPUT}" \
            "${args[@]}"
      - name: Verify previous repository continuity and diagnose live site
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/verify_previous_release.py \
            --config automation/config/production-daily.json \
            --rss posts/rss.xml \
            --posts-root posts \
            --publication-date "${{ steps.runtime.outputs.publication_date }}" \
            --output automation/preview/production-daily/previous-release.json
      - name: Resolve reusable artifact
        id: recovery_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
          FORCE_FRESH_RESEARCH: ${{ inputs.force_fresh_research || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE_FRESH_RESEARCH}" == "true" && -n "${MANUAL_RECOVERY_RUN_ID}" ]]; then
            echo "force_fresh_research=true conflicts with recovery_run_id; choose fresh research or explicit artifact recovery, not both." >&2
            exit 1
          fi
          run_id="${MANUAL_RECOVERY_RUN_ID}"
          source="manual"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE_FRESH_RESEARCH}" == "true" ]]; then
            run_id=""
            source="none"
            echo "Manual fresh research requested; automatic recovery is disabled for this run."
          elif [[ -z "${run_id}" ]]; then
            source="automatic"
            candidates="$(
              gh api --paginate \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=daily-production-${PUBLICATION_DATE}&per_page=100" \
                --jq '.artifacts[] | select(.expired == false and .workflow_run.id != null) | [.created_at, (.workflow_run.id | tostring)] | @tsv' \
              | awk -v current="${GITHUB_RUN_ID}" '$2 != current { print }' \
              | sort -r
            )"
            best_rank=0
            best_run_id=""
            while IFS=$'\t' read -r _created_at candidate_run_id; do
              [[ -n "${candidate_run_id}" ]] || continue
              rank="$(
                gh api \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?per_page=100" \
                  --jq '
                    [.jobs[] | select(.name == "production") | .steps[]?] as $steps
                    | if any($steps[]; ((.name == "Generate one production cover" or .name == "Revalidate recovered production cover") and .conclusion == "success")) then 3
                      elif any($steps[]; (.name == "Validate publishable story count and short digest marker" and .conclusion == "success")) then 2
                      elif any($steps[]; (((.name | startswith("Run full research")) or (.name | startswith("Restore saved paid artifact"))) and .conclusion == "success")) then 1
                      else 0
                      end
                  '
              )"
              if [[ "${rank}" -gt "${best_rank}" ]]; then
                best_rank="${rank}"
                best_run_id="${candidate_run_id}"
              fi
            done <<< "${candidates}"
            if [[ "${best_rank}" -gt 0 ]]; then
              run_id="${best_run_id}"
              echo "Automatic recovery selected run ${run_id} with completeness rank ${best_rank}."
            fi
          fi
          if [[ -n "${run_id}" ]]; then
            echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
            echo "source=${source}" >> "${GITHUB_OUTPUT}"
            echo "Reusable artifact selected from run ${run_id} (${source})."
          else
            echo "run_id=" >> "${GITHUB_OUTPUT}"
            echo "source=none" >> "${GITHUB_OUTPUT}"
            echo "No reusable artifact selected for ${PUBLICATION_DATE}."
          fi
      - name: Download saved editorial artifact for recovery
        if: steps.recovery_source.outputs.run_id != ''
        continue-on-error: ${{ steps.recovery_source.outputs.source == 'automatic' }}
        uses: actions/download-artifact@v8
        with:
          name: daily-production-${{ steps.runtime.outputs.publication_date }}
          path: automation/recovery/${{ steps.recovery_source.outputs.run_id }}
          run-id: ${{ steps.recovery_source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Reuse completed editorial stop without paid APIs
        id: terminal_reuse
        if: steps.recovery_source.outputs.run_id != ''
        shell: bash
        env:
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
          RECOVERY_RUN_ID: ${{ steps.recovery_source.outputs.run_id }}
          RECOVERY_SOURCE: ${{ steps.recovery_source.outputs.source }}
        run: |
          set -euo pipefail
          stop="false"
          reason=""
          recovery_root="automation/recovery/${RECOVERY_RUN_ID}"
          report="${recovery_root}/production-daily/coverage-audit.json"
          if [[ "${RECOVERY_SOURCE}" == "automatic" && -f "${report}" ]]; then
            verdict="$(
              python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          api = data.get("api") or {}
          pool_after = data.get("candidate_pool_after") or {}
          pool_total = pool_after.get("total") if isinstance(pool_after, dict) else None
          temporal_anchor_current = (
              data.get("temporal_anchor_version") == 1
              and (data.get("recall_sentinel") or {}).get("version") == 8
          )
          terminal = (
              temporal_anchor_current
              and data.get("status") in {"error", "editorial_stop"}
              and data.get("audit_state") == "completed_usable"
              and not data.get("audit_error")
              and not data.get("validation_error")
              and data.get("web_search_performed") is True
              and api.get("status") == "completed"
              and data.get("audit_status") in {"complete", "complete_with_gaps"}
              and isinstance(pool_total, int)
              and pool_total == 0
          )
          if terminal:
              reason = str(
                  data.get("error")
                  or "Research and coverage audit found no publishable stories."
              )
              print("terminal:" + " ".join(reason.split()))
          else:
              print("continue")
          PY
            )"
            if [[ "${verdict}" == terminal:* ]]; then
              stop="true"
              reason="${verdict#terminal:}"
            fi
          fi
          echo "stop=${stop}" >> "${GITHUB_OUTPUT}"
          [[ "${stop}" == "true" ]] || exit 0
          mkdir -p \
            automation/preview/production-daily \
            "automation/preview/${PUBLICATION_DATE}"
          cp -a \
            "${recovery_root}/production-daily/." \
            automation/preview/production-daily/
          if [[ -d "${recovery_root}/${PUBLICATION_DATE}" ]]; then
            cp -a \
              "${recovery_root}/${PUBLICATION_DATE}/." \
              "automation/preview/${PUBLICATION_DATE}/"
          fi
          {
            echo "## ⏸️ Редакционная остановка переиспользована"
            echo
            echo "- **Дата выпуска:** ${PUBLICATION_DATE}"
            echo "- **Артефакт:** run ${RECOVERY_RUN_ID}"
            echo "- **Причина:** ${reason}"
            echo "- **Платные API в этом запуске:** 0"
            echo "- **Следующее действие:** дождаться следующего календарного окна; полный повтор сегодня не нужен"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::warning title=Редакционная остановка переиспользована::Новый платный research и targeted audit не запускались; использован artifact run ${RECOVERY_RUN_ID}."
      - name: Restore saved paid artifact
        id: recovery
        if: steps.recovery_source.outputs.run_id != '' && steps.terminal_reuse.outputs.stop != 'true'
        shell: bash
        env:
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
          RECOVERY_RUN_ID: ${{ steps.recovery_source.outputs.run_id }}
          RECOVERY_SOURCE: ${{ steps.recovery_source.outputs.source }}
        run: |
          set +e
          python automation/scripts/recover_digest_artifact.py \
            --recovery-root "automation/recovery/${RECOVERY_RUN_ID}" \
            --target-dir "automation/preview/${PUBLICATION_DATE}" \
            --publication-date "${PUBLICATION_DATE}" \
            --timezone Europe/Moscow \
            --image-target-dir "automation/preview/production-daily/image/${PUBLICATION_DATE}" \
            --report automation/preview/production-daily/recovery.json
          recovery_status=$?
          set -e
          if [[ "${recovery_status}" -ne 0 ]]; then
            echo "reused=false" >> "${GITHUB_OUTPUT}"
            echo "image_recovered=false" >> "${GITHUB_OUTPUT}"
            if [[ "${RECOVERY_SOURCE}" == "manual" ]]; then
              echo "Manual recovery artifact is unusable; refusing to start paid research." >&2
              exit "${recovery_status}"
            fi
            rm -rf \
              "automation/preview/${PUBLICATION_DATE}" \
              "automation/preview/production-daily/image/${PUBLICATION_DATE}"
            echo "::warning title=Непригодный автоматический artifact::Artifact run ${RECOVERY_RUN_ID} не содержит завершённого платного research/editorial. Будет выполнен свежий research."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              Path("automation/preview/production-daily/recovery.json").read_text(
                  encoding="utf-8"
              )
          )
          recovery_mode = str(report.get("recovery_mode") or "")
          image_recovered = bool(report.get("image_recovered"))
          text_api_needed = True
          if recovery_mode == "full":
              stories_path = Path(f"automation/preview/{os.environ['PUBLICATION_DATE']}/stories.json")
              full_story_target = False
              if stories_path.is_file():
                  try:
                      stories = json.loads(stories_path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      stories = None
                  full_story_target = isinstance(stories, list) and len(stories) >= 7
              prior_complete = False
              prior_path = Path("automation/preview/production-daily/coverage-audit.json")
              if prior_path.is_file():
                  try:
                      prior = json.loads(prior_path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      prior = None
                  if isinstance(prior, dict):
                      import sys
                      sys.path.insert(0, "automation/scripts")
                      from ensure_story_coverage_runtime_base import completed_prior_audit
                      prior_complete = completed_prior_audit(prior)
              text_api_needed = not (full_story_target or prior_complete)
          image_api_needed = not image_recovered
          openai_needed = text_api_needed or image_api_needed
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write("reused=true\n")
              stream.write(f"recovery_mode={recovery_mode}\n")
              stream.write(
                  "image_recovered="
                  + ("true" if image_recovered else "false")
                  + "\n"
              )
              stream.write(
                  "text_api_needed="
                  + ("true" if text_api_needed else "false")
                  + "\n"
              )
              stream.write(
                  "image_api_needed="
                  + ("true" if image_api_needed else "false")
                  + "\n"
              )
              stream.write(
                  "openai_needed="
                  + ("true" if openai_needed else "false")
                  + "\n"
              )
          PY
          echo "Recovered reusable paid artifact from run ${RECOVERY_RUN_ID}."
      - name: Install pinned OpenAI SDK
        if: steps.terminal_reuse.outputs.stop != 'true' && (steps.recovery.outputs.reused != 'true' || (steps.recovery.outputs.openai_needed == 'true' && steps.recovery.outputs.text_api_needed == 'true'))
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: Validate API configuration
        if: steps.terminal_reuse.outputs.stop != 'true' && (steps.recovery.outputs.reused != 'true' || steps.recovery.outputs.openai_needed == 'true')
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          RECOVERY_RUN_ID: ${{ steps.recovery_source.outputs.run_id || '' }}
          RECOVERY_REUSED: ${{ steps.recovery.outputs.reused || 'false' }}
          TEXT_API_NEEDED: ${{ steps.recovery.outputs.text_api_needed || 'false' }}
          IMAGE_API_NEEDED: ${{ steps.recovery.outputs.image_api_needed || 'false' }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY}" ]] || { echo "OPENAI_API_KEY missing" >&2; exit 1; }
          if [[ "${RECOVERY_REUSED}" != "true" || "${TEXT_API_NEEDED}" == "true" ]]; then
            [[ "${OPENAI_TEXT_MODEL}" == "gpt-5.6-terra" ]] || { echo "Unexpected text model" >&2; exit 1; }
          fi
          if [[ "${RECOVERY_REUSED}" != "true" || "${IMAGE_API_NEEDED}" == "true" ]]; then
            [[ "${OPENAI_IMAGE_MODEL}" == "gpt-image-2" ]] || { echo "Unexpected image model" >&2; exit 1; }
          fi
      - name: Patch runtime publication hour to 06:00 Moscow
        if: steps.terminal_reuse.outputs.stop != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp automation/config/site.json automation/preview/production-daily/preflight/site.json.original
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("automation/config/site.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["publication_hour"] = 6
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate editorial code and bootstrap archive
        if: steps.terminal_reuse.outputs.stop != 'true'
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py
          python automation/scripts/bootstrap_archive.py
          python automation/scripts/validate_archive.py
      - name: Verify search window starts at last successful research cutoff
        if: steps.terminal_reuse.outputs.stop != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/validate_search_window_continuity.py \
            --runtime automation/preview/production-daily/preflight/runtime.json \
            --archive automation/archive/index.json \
            --timezone Europe/Moscow \
            --publication-hour 6 \
            --output automation/preview/production-daily/search-window-continuity.json
      - name: Run full research and editorial
        if: steps.recovery.outputs.reused != 'true' && steps.terminal_reuse.outputs.stop != 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
          DIGEST_REQUEST_ID: ${{ steps.runtime.outputs.digest_request_id }}
          MINIMUM_CANDIDATES: "12"
          MAXIMUM_CANDIDATES: "20"
          MINIMUM_SELECTED_STORIES: "7"
          MAXIMUM_SELECTED_STORIES: "12"
        run: |
          set -euo pipefail
          python automation/scripts/run_digest_preview.py \
            --allow-provisional-editorial \
            --publication-date "${PUBLICATION_DATE}" \
            --minimum-candidates "${MINIMUM_CANDIDATES}" \
            --maximum-candidates "${MAXIMUM_CANDIDATES}" \
            --minimum-selected-stories "${MINIMUM_SELECTED_STORIES}" \
            --maximum-selected-stories "${MAXIMUM_SELECTED_STORIES}" \
            --maximum-research-web-search-calls 12
      - name: Complete mandatory coverage audit for a short digest
        id: coverage
        if: steps.terminal_reuse.outputs.stop != 'true'
        # Runs for both fresh and recovered artifacts. Partial recovery reuses
        # completed directions and searches only missing beats. A short digest
        # proceeds only after all six required directions have completed; any
        # technical partial/error exits before Image API, commit and deploy.
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
          PUBLICATION_DATE: ${{ steps.runtime.outputs.publication_date }}
          DIGEST_REQUEST_ID: ${{ steps.runtime.outputs.digest_request_id }}
        run: |
          set -euo pipefail
          python automation/scripts/ensure_story_coverage.py \
            --artifact-dir "automation/preview/${PUBLICATION_DATE}" \
            --archive automation/archive/index.json \
            --publication-date "${PUBLICATION_DATE}" \
            --model "${OPENAI_TEXT_MODEL}" \
            --usual-total 7 \
            --minimum-publishable 1 \
            --maximum-audit-web-search-calls 7 \
            --maximum-candidates 20 \
            --maximum-selected-stories 12 \
            --report automation/preview/production-daily/coverage-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("automation/preview/production-daily/coverage-audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("audit_needed"):
              report["audit_notes"] = (
                  "Шесть обязательных тематических проходов; седьмой слот "
                  "используется для повтора незавершённого направления, а при "
                  "полных шести проходах и нулевом пригодном пуле — для "
                  "актуального high-signal recall sentinel."
              )
              path.write_text(
                  json.dumps(report, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("automation/preview/production-daily/coverage-audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          editorial_stop = bool(
              report.get("status") == "editorial_stop"
              and report.get("editorial_stop") is True
              and report.get("audit_state") == "completed_usable"
              and report.get("audit_status") in {"complete", "complete_with_gaps"}
              and isinstance(report.get("candidate_pool_after"), dict)
              and report["candidate_pool_after"].get("total") == 0
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
