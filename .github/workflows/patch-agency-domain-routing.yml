name: Patch agency domain routing

on:
  push:
    branches:
      - agent/fix-agency-domain-routing
    paths:
      - .github/workflows/patch-agency-domain-routing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-agency-domain-routing
          fetch-depth: 0
      - name: Apply exact source-routing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "automation/scripts/primary_recall_search.py",
              '''AGENCY_DOMAINS: tuple[str, ...] = (\n    "reuters.com",\n    "apnews.com",\n    "bloomberg.com",\n    "ft.com",\n)''',
              '''REUTERS_DOMAINS: tuple[str, ...] = ("reuters.com",)\nBLOOMBERG_FT_DOMAINS: tuple[str, ...] = ("bloomberg.com", "ft.com")\nAP_DOMAINS: tuple[str, ...] = ("apnews.com", "ap.org")\nAGENCY_DOMAINS: tuple[str, ...] = (\n    *REUTERS_DOMAINS,\n    *BLOOMBERG_FT_DOMAINS,\n    *AP_DOMAINS,\n)''',
          )
          replace(
              "automation/scripts/primary_recall_search.py",
              '''            "одной компании или одном типе событий."\n        ),\n    },\n    {\n        "id": "major_agencies",''',
              '''            "одной компании или одном типе событий."\n        ),\n        "allowed_domains": REUTERS_DOMAINS,\n    },\n    {\n        "id": "major_agencies",''',
          )
          replace(
              "automation/scripts/primary_recall_search.py",
              '''        "allowed_domains": AGENCY_DOMAINS,\n    },\n    {\n        "id": "models_products_agents",''',
              '''        "allowed_domains": BLOOMBERG_FT_DOMAINS,\n    },\n    {\n        "id": "models_products_agents",''',
          )
          replace(
              "automation/scripts/primary_recall_search.py",
              '''            "Россию, продуктовые интеграции, security и business. Не повторяй список."\n        ),\n    },\n)''',
              '''            "Россию, продуктовые интеграции, security и business. Не повторяй список."\n        ),\n        "allowed_domains": AP_DOMAINS,\n    },\n)''',
          )

          prompt = Path("automation/prompts/primary_recall_pass.md")
          text = prompt.read_text(encoding="utf-8")
          start = text.index("### High-signal source routing")
          end = text.index("\nДля `models_products_agents`", start)
          new_section = '''### High-signal source routing\n\nProduction-инциденты 2026-08-13 и 2026-08-14 показали, что текстовое упоминание\nиздателя в query не гарантирует свежий поток: Reuters-focused запрос способен\nвернуть старые Reuters-зеркала, а общий четырехдоменный pass — старые hub/video\nстраницы. Поэтому три high-signal прохода теперь разделены **API domain filters**\nбез изменения общего бюджета в 12 searches:\n\n- если `direction_id=global_breaking`, API filter ограничен `reuters.com`.\n  Сформируй короткий source-neutral query про **AI funding / acquisition / M&A /\n  major business** и даты основного continuity-периода, например\n  `AI funding acquisition business August 13 2026 August 14 2026`. Не добавляй\n  `Reuters` в query: источник уже задан API filter;\n- если `direction_id=major_agencies`, API filter ограничен `bloomberg.com` и\n  `ft.com`. Используй короткий source-neutral query про **major AI news / models /\n  products / chips / infrastructure / business** и даты основного\n  continuity-периода. Это независимый Bloomberg/FT high-signal канал;\n- если `direction_id=independent_missing_events`, API filter ограничен\n  `apnews.com` и `ap.org`. Сделай независимый source-neutral sweep по **AI\n  consumer products / major technology / policy** и датам основного\n  continuity-периода, учитывая уже найденный pool.\n\nЭто routing поискового ranking, а не whitelist всего проекта. Остальные девять\nPrimary directions остаются широкими без API domain filter и могут использовать\nофициальные первоисточники и любые авторитетные технологические, деловые,\nотраслевые, регуляторные или исследовательские источники. После retrieval\nкандидат по-прежнему может использовать более сильный первоисточник, если он\nпроверен обычными правилами.\n'''
          prompt.write_text(text[:start] + new_section + text[end:], encoding="utf-8")

          test = Path("automation/tests/test_primary_recall_source_routes.py")
          test.write_text('''from __future__ import annotations\n\nimport sys\nimport unittest\nfrom pathlib import Path\n\nSCRIPTS = Path(__file__).resolve().parents[1] / "scripts"\nsys.path.insert(0, str(SCRIPTS))\n\nimport primary_recall_search as primary  # noqa: E402\n\n\nclass PrimaryRecallSourceRouteTests(unittest.TestCase):\n    def test_three_high_signal_routes_use_disjoint_api_domain_filters(self) -> None:\n        routes = {\n            str(item["id"]): tuple(item.get("allowed_domains", ()))\n            for item in primary.PRIMARY_DIRECTIONS\n        }\n        self.assertEqual(routes["global_breaking"], ("reuters.com",))\n        self.assertEqual(routes["major_agencies"], ("bloomberg.com", "ft.com"))\n        self.assertEqual(routes["independent_missing_events"], ("apnews.com", "ap.org"))\n        for direction_id, domains in routes.items():\n            if direction_id not in {"global_breaking", "major_agencies", "independent_missing_events"}:\n                self.assertEqual(domains, (), direction_id)\n\n    def test_agency_health_domain_set_covers_all_three_routes(self) -> None:\n        self.assertEqual(\n            set(primary.AGENCY_DOMAINS),\n            {"reuters.com", "bloomberg.com", "ft.com", "apnews.com", "ap.org"},\n        )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          p = Path("automation/tests/test_primary_recall_query_discipline.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('''        self.assertIn("Reuters AI funding acquisition business", text)\n        self.assertIn("direction_id=major_agencies", text)\n        self.assertIn("не якори query на Reuters", text)\n        self.assertIn("source-neutral query", text)\n        self.assertIn("Reuters, Associated Press", text)\n        self.assertIn("Bloomberg и Financial Times", text)\n        self.assertIn("direction_id=independent_missing_events", text)\n        self.assertIn("Associated Press-focused", text)\n        self.assertIn("AI consumer products / major technology", text)''', '''        self.assertIn("API filter ограничен `reuters.com`", text)\n        self.assertIn("AI funding acquisition business", text)\n        self.assertIn("direction_id=major_agencies", text)\n        self.assertIn("API filter ограничен `bloomberg.com`", text)\n        self.assertIn("`ft.com`", text)\n        self.assertIn("direction_id=independent_missing_events", text)\n        self.assertIn("`apnews.com` и `ap.org`", text)\n        self.assertIn("AI consumer products / major technology", text)''')
          p.write_text(text, encoding="utf-8")

          p = Path("automation/tests/test_fresh_source_routing_contract.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('''        self.assertIn("Reuters-focused query", text)\n        self.assertIn("direction_id=major_agencies", text)\n        self.assertIn("не якори query на Reuters", text)\n        self.assertIn("Reuters, Associated Press", text)\n        self.assertIn("Bloomberg и Financial Times", text)\n        self.assertIn("Associated Press-focused sweep", text)''', '''        self.assertIn("API domain filters", text)\n        self.assertIn("direction_id=major_agencies", text)\n        self.assertIn("`bloomberg.com` и", text)\n        self.assertIn("`ft.com`", text)\n        self.assertIn("`reuters.com`", text)\n        self.assertIn("`apnews.com` и `ap.org`", text)''')
          p.write_text(text, encoding="utf-8")

          for filename in ("README.md", "automation/README.md", "AGENTS.md"):
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              text = text.replace(
                  "`major_agencies` является единственным намеренно domain-filtered primary pass:\nAPI разрешает `reuters.com`, `apnews.com`, `bloomberg.com`, `ft.com`. Для\nостальных primary-направлений общего whitelist нет.",
                  "Три high-signal Primary pass намеренно используют раздельные API domain filters:\n`global_breaking` — `reuters.com`, `major_agencies` — `bloomberg.com` + `ft.com`,\n`independent_missing_events` — `apnews.com` + `ap.org`. Остальные девять\nprimary-направлений не имеют общего whitelist и остаются широкими."
              )
              text = text.replace(
                  "`major_agencies` is the one intentional primary domain-filtered pass and is\nlimited to Reuters, AP, Bloomberg and Financial Times. Do not turn that into a\ngeneral project-wide whitelist. Other primary directions remain broad and\nvalidate source quality after retrieval.",
                  "Three high-signal Primary passes intentionally use disjoint API domain filters:\n`global_breaking` is limited to `reuters.com`, `major_agencies` to\n`bloomberg.com` + `ft.com`, and `independent_missing_events` to `apnews.com` +\n`ap.org`. The other nine Primary directions remain broad. Do not turn these\nsource routes into a project-wide whitelist; source quality is still validated\nafter retrieval."
              )
              text = text.replace(
                  "`global_breaking` uses a Reuters-focused funding/acquisition/M&A/major-business\n  query;\n- `major_agencies` uses a **source-neutral** compact major-AI/date query inside\n  the existing Reuters/AP/Bloomberg/FT API domain filter; do not re-anchor it on\n  Reuters or any other single publisher;\n- `independent_missing_events` uses an Associated Press-focused consumer-AI /\n  major-technology / policy sweep after seeing the current candidate pool.",
                  "`global_breaking` uses a source-neutral funding/acquisition/M&A/major-business\n  query inside a `reuters.com` API filter;\n- `major_agencies` uses a source-neutral compact major-AI/date query inside a\n  `bloomberg.com` + `ft.com` API filter;\n- `independent_missing_events` uses a source-neutral consumer-AI /\n  major-technology / policy sweep inside an `apnews.com` + `ap.org` API filter\n  after seeing the current candidate pool."
              )
              text = text.replace(
                  "`global_breaking` даёт Reuters-focused шанс крупным funding/M&A/business\n   событиям; `major_agencies` использует source-neutral AI/date query внутри\n   своего Reuters/AP/Bloomberg/FT domain filter; `independent_missing_events`\n   делает независимый AP-focused consumer/major-tech/policy sweep.",
                  "`global_breaking` использует source-neutral funding/M&A/business query внутри\n   `reuters.com` filter; `major_agencies` использует source-neutral AI/date query\n   внутри `bloomberg.com` + `ft.com` filter; `independent_missing_events` делает\n   source-neutral consumer/major-tech/policy sweep внутри `apnews.com` + `ap.org`\n   filter."
              )
              text = text.replace(
                  "`global_breaking` использует Reuters-focused funding/acquisition/M&A/major\nbusiness query; `major_agencies` остаётся source-neutral внутри\nReuters/AP/Bloomberg/FT filter; `independent_missing_events` выполняет отдельный\nAssociated Press-focused consumer/major-technology/policy sweep.",
                  "`global_breaking` использует source-neutral funding/acquisition/M&A/major\nbusiness query внутри `reuters.com` filter; `major_agencies` использует\nsource-neutral major-AI query внутри `bloomberg.com` + `ft.com` filter;\n`independent_missing_events` выполняет source-neutral consumer/major-technology/\npolicy sweep внутри `apnews.com` + `ap.org` filter."
              )
              text = text.replace(
                  "`global_breaking` использует Reuters funding/acquisition/M&A/major-business,\n`major_agencies` использует source-neutral major-AI query при сохранённом\nReuters/AP/Bloomberg/FT API filter, `independent_missing_events` делает\nAssociated Press consumer-AI / major technology / policy sweep",
                  "`global_breaking` использует source-neutral funding/acquisition/M&A/major-business\nquery внутри `reuters.com` API filter, `major_agencies` использует source-neutral\nmajor-AI query внутри `bloomberg.com` + `ft.com` filter,\n`independent_missing_events` делает source-neutral consumer-AI / major technology\n/ policy sweep внутри `apnews.com` + `ap.org` filter"
              )
              marker = "The 2026-08-14 production run is a separate recall-quality regression class."
              if filename == "AGENTS.md" and marker in text and "attempt 2" not in text[text.index(marker):text.index(marker)+2200]:
                  insert_at = text.index("\nFresh Primary Recall is also subject", text.index(marker))
                  note = "\n\nA fresh 2026-08-14 recovery attempt after continuity-first routing exposed a further\nsource-ranking failure: the Reuters text-anchored pass returned old Reuters mirrors,\nwhile the four-domain agency pass returned stale Bloomberg hub/video pages and failed\nfresh agency source-health. The regression rule is therefore stronger: high-signal\nsource diversity must be enforced by disjoint API domain filters, not merely publisher\nnames in query text. Do not remove these filters without a new live recall experiment.\n"
                  text = text[:insert_at] + note + text[insert_at:]
              p.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/patch-agency-domain-routing.yml
          git status --short
      - name: Commit patched branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/scripts/primary_recall_search.py automation/prompts/primary_recall_pass.md automation/tests README.md automation/README.md AGENTS.md .github/workflows/patch-agency-domain-routing.yml
          git commit -m "Route agency recall through disjoint domain filters"
          git push origin HEAD:agent/fix-agency-domain-routing
