name: Repository content cleanup
run-name: Repository content cleanup ${{ github.run_id }}

on:
  schedule:
    # 01:43 Europe/Moscow. GitHub cron is always UTC.
    - cron: "43 22 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply cleanup; leave disabled for a dry-run"
        required: true
        default: false
        type: boolean
      retention_days:
        description: "Keep this many full calendar days (minimum 32)"
        required: true
        default: "32"
        type: string

permissions:
  contents: write

concurrency:
  # Serialize both workflows that may write protected main. A delayed cleanup
  # must finish before daily production starts spending paid API budget.
  group: daily-production-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune expired repository and public content
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      retention_days: ${{ steps.mode.outputs.retention_days }}
      reference_date: ${{ steps.public_cleanup.outputs.reference_date }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      public_changed: ${{ steps.public_cleanup.outputs.changed }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select cleanup mode
        id: mode
        shell: bash
        env:
          REQUESTED_RETENTION_DAYS: ${{ inputs.retention_days || '32' }}
          MANUAL_APPLY: ${{ inputs.apply || 'false' }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_RETENTION_DAYS}" =~ ^[0-9]+$ ]]; then
            echo "retention_days must be an integer." >&2
            exit 1
          fi
          if (( REQUESTED_RETENTION_DAYS < 32 )); then
            echo "retention_days must be at least 32." >&2
            exit 1
          fi
          mode="dry-run"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${MANUAL_APPLY}" == "true" ]]; then
            mode="apply"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "retention_days=${REQUESTED_RETENTION_DAYS}" >> "${GITHUB_OUTPUT}"

      - name: Plan or apply repository compaction
        id: repository_cleanup
        shell: bash
        env:
          CLEANUP_MODE: ${{ steps.mode.outputs.mode }}
          RETENTION_DAYS: ${{ steps.mode.outputs.retention_days }}
          REPORT_PATH: ${{ runner.temp }}/repository-cleanup.json
        run: |
          set -euo pipefail
          args=(
            --retention-days "${RETENTION_DAYS}"
            --timezone Europe/Moscow
            --report "${REPORT_PATH}"
          )
          if [[ "${CLEANUP_MODE}" == "apply" ]]; then
            args+=(--apply)
          fi
          python automation/scripts/cleanup_repository_content.py "${args[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"changed={'true' if report['changes_applied'] else 'false'}\n"
              )
              output.write(
                  f"planned={'true' if report['changes_planned'] else 'false'}\n"
              )
          PY

      - name: Plan or apply public posts and RSS cleanup
        id: public_cleanup
        shell: bash
        env:
          CLEANUP_MODE: ${{ steps.mode.outputs.mode }}
          RETENTION_DAYS: ${{ steps.mode.outputs.retention_days }}
          REPORT_PATH: ${{ runner.temp }}/public-posts-cleanup.json
        run: |
          set -euo pipefail
          args=(
            --retention-days "${RETENTION_DAYS}"
            --timezone Europe/Moscow
            --report "${REPORT_PATH}"
          )
          if [[ "${CLEANUP_MODE}" == "apply" ]]; then
            args+=(--apply)
          fi
          python automation/scripts/cleanup_public_posts.py "${args[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"changed={'true' if report['changes_applied'] else 'false'}\n"
              )
              output.write(
                  f"planned={'true' if report['changes_planned'] else 'false'}\n"
              )
              output.write(f"rss_items_after={report['rss_items_after']}\n")
              output.write(f"reference_date={report['reference_date']}\n")
          PY

      - name: Validate applied cleanup
        id: validation
        if: steps.repository_cleanup.outputs.changed == 'true' || steps.public_cleanup.outputs.changed == 'true'
        shell: bash
        env:
          REPOSITORY_REPORT: ${{ runner.temp }}/repository-cleanup.json
          PUBLIC_REPORT: ${{ runner.temp }}/public-posts-cleanup.json
        run: |
          set -euo pipefail
          python -m unittest \
            automation.tests.test_repository_cleanup \
            automation.tests.test_public_posts_cleanup \
            -v
          python automation/scripts/validate_archive.py
          mkdir -p automation/preview/cleanup-validation
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/cleanup-validation/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/cleanup-validation/sitemap.json
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/cleanup-validation/production-contract.json
          latest_content_dir="$(
            find automation/content -mindepth 1 -maxdepth 1 \
              -type d -name '????-??-??' | sort | tail -n 1
          )"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/cleanup-validation/structured-data.json
          git diff --check
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import date
          from pathlib import Path

          repository_report = json.loads(
              Path(os.environ["REPOSITORY_REPORT"]).read_text(encoding="utf-8")
          )
          public_report = json.loads(
              Path(os.environ["PUBLIC_REPORT"]).read_text(encoding="utf-8")
          )
          cutoff = date.fromisoformat(repository_report["cutoff_date"])
          if public_report["cutoff_date"] != repository_report["cutoff_date"]:
              raise SystemExit("Repository and public cleanup cutoffs differ.")

          raw = subprocess.check_output(["git", "diff", "--name-status", "-z"])
          fields = raw.decode("utf-8").split("\0")
          if fields and fields[-1] == "":
              fields.pop()
          if not fields or len(fields) % 2:
              raise SystemExit("Cleanup produced an invalid or empty Git diff.")
          actual = dict(zip(fields[1::2], fields[0::2]))

          content_pattern = re.compile(
              r"automation/content/(\d{4}-\d{2}-\d{2})/(.+)"
          )
          actual_public = {}
          for path, status in actual.items():
              content_match = content_pattern.fullmatch(path)
              if content_match is not None:
                  if status != "D":
                      raise SystemExit(
                          f"Repository compaction may only delete files: {status} {path}"
                      )
                  publication_date = date.fromisoformat(content_match.group(1))
                  if publication_date >= cutoff:
                      raise SystemExit(
                          f"Repository compaction changed a retained date: {path}"
                      )
                  if Path(path).name in {"meta.json", "stories.json"}:
                      raise SystemExit(
                          f"Repository compaction deleted retained metadata: {path}"
                      )
                  continue
              if path.startswith("posts/"):
                  actual_public[path] = status
                  continue
              raise SystemExit(f"Cleanup changed a protected path: {status} {path}")

          expected_public = {
              f"posts/{row['path']}": row["status"]
              for row in public_report["expected_git_changes"]
          }
          if actual_public != expected_public:
              raise SystemExit(
                  "Public Git diff differs from the validated cleanup candidate: "
                  f"expected={expected_public}, actual={actual_public}"
              )
          PY

      - name: Commit applied cleanup
        id: commit
        if: steps.repository_cleanup.outputs.changed == 'true' || steps.public_cleanup.outputs.changed == 'true'
        shell: bash
        env:
          RETENTION_DAYS: ${{ steps.mode.outputs.retention_days }}
          MAIN_PUSH_DEPLOY_KEY: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main changed while cleanup was running; refusing to push." >&2
            exit 1
          fi
          git add -u -- automation/content posts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prune content older than ${RETENTION_DAYS} days"
          bash automation/scripts/push_protected_main.sh HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish cleanup summary
        if: always()
        shell: bash
        env:
          REPOSITORY_REPORT: ${{ runner.temp }}/repository-cleanup.json
          PUBLIC_REPORT: ${{ runner.temp }}/public-posts-cleanup.json
          REPOSITORY_OUTCOME: ${{ steps.repository_cleanup.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_cleanup.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          if [[ ! -f automation/scripts/cleanup_repository_content.py || ! -f automation/scripts/cleanup_public_posts.py ]]; then
            {
              echo "# Ночная очистка контента"
              echo
              echo "❌ Workflow не смог получить скрипты очистки."
              echo
              echo "Изменения в \`main\` и на FTP этим запуском не опубликованы."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "automation/scripts")
          from cleanup_public_posts import (
              render_github_summary as render_public_summary,
          )
          from cleanup_repository_content import (
              render_github_summary as render_repository_summary,
          )

          def load_report(name):
              path = Path(os.environ[name])
              if not path.is_file():
                  return None
              return json.loads(path.read_text(encoding="utf-8"))

          repository_summary = render_repository_summary(
              load_report("REPOSITORY_REPORT"),
              cleanup_outcome=os.environ["REPOSITORY_OUTCOME"],
              validation_outcome=os.environ["VALIDATION_OUTCOME"],
              commit_outcome=os.environ["COMMIT_OUTCOME"],
          )
          public_summary = render_public_summary(
              load_report("PUBLIC_REPORT"),
              cleanup_outcome=os.environ["PUBLIC_OUTCOME"],
              validation_outcome=os.environ["VALIDATION_OUTCOME"],
              commit_outcome=os.environ["COMMIT_OUTCOME"],
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(repository_summary)
              output.write("\n\n")
              output.write(public_summary)
          PY

  deploy:
    name: Synchronize pruned posts to FTP
    needs: cleanup
    if: needs.cleanup.result == 'success' && needs.cleanup.outputs.public_changed == 'true' && needs.cleanup.outputs.commit_sha != ''
    uses: ./.github/workflows/deploy-posts.yml
    with:
      ref: ${{ needs.cleanup.outputs.commit_sha }}
    secrets: inherit

  video_ftp_cleanup:
    name: Prune expired video assets from FTP
    needs:
      - cleanup
      - deploy
    if: >-
      always() &&
      needs.cleanup.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out maintenance revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.cleanup.outputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Plan or apply FTP video cleanup
        id: video_cleanup
        shell: bash
        env:
          CLEANUP_MODE: ${{ needs.cleanup.outputs.mode }}
          RETENTION_DAYS: ${{ needs.cleanup.outputs.retention_days }}
          REFERENCE_DATE: ${{ needs.cleanup.outputs.reference_date }}
          REPORT_PATH: ${{ runner.temp }}/video-ftp-cleanup.json
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${REFERENCE_DATE}"
          args=(
            --retention-days "${RETENTION_DAYS}"
            --timezone Europe/Moscow
            --reference-date "${REFERENCE_DATE}"
            --report "${REPORT_PATH}"
          )
          if [[ "${CLEANUP_MODE}" == "apply" ]]; then
            args+=(--apply)
          fi
          python automation/scripts/cleanup_video_ftp.py "${args[@]}"

      - name: Publish FTP video cleanup summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/video-ftp-cleanup.json
          CLEANUP_OUTCOME: ${{ steps.video_cleanup.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "automation/scripts")
          from cleanup_video_ftp import render_github_summary

          report_path = Path(os.environ["REPORT_PATH"])
          report = None
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = render_github_summary(
              report,
              outcome=os.environ["CLEANUP_OUTCOME"],
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)
          PY

      - name: Upload FTP video cleanup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-ftp-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/video-ftp-cleanup.json
          if-no-files-found: warn
          retention-days: 14

  final_status:
    name: Итог ночной очистки
    needs:
      - cleanup
      - deploy
      - video_ftp_cleanup
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Показать общий итог
        shell: bash
        env:
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          CLEANUP_MODE: ${{ needs.cleanup.outputs.mode }}
          PUBLIC_CHANGED: ${{ needs.cleanup.outputs.public_changed }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VIDEO_FTP_RESULT: ${{ needs.video_ftp_cleanup.result }}
          COMMIT_SHA: ${{ needs.cleanup.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ftp_result="не требовалась"
          if [[ "${PUBLIC_CHANGED}" == "true" ]]; then
            ftp_result="${DEPLOY_RESULT}"
          fi
          {
            echo "# Итог ночной очистки"
            echo
            echo "| Этап | Результат |"
            echo "|---|---|"
            echo "| Проверка и GitHub | ${CLEANUP_RESULT} |"
            echo "| Режим | ${CLEANUP_MODE:-не определён} |"
            echo "| FTP-синхронизация posts | ${ftp_result} |"
            echo "| FTP-очистка video | ${VIDEO_FTP_RESULT} |"
            echo "| Commit | ${COMMIT_SHA:-не создавался} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${CLEANUP_RESULT}" == "failure" ]]; then
            echo "::error title=Ошибка ночной очистки::GitHub и FTP не приведены к новому состоянию. Открой подробную русскую Summary job cleanup."
          elif [[ "${PUBLIC_CHANGED}" == "true" && "${DEPLOY_RESULT}" != "success" ]]; then
            echo "::error title=Ошибка FTP-синхронизации::GitHub уже очищен, но FTP posts не подтверждён. Повторно запусти deploy-posts.yml для commit ${COMMIT_SHA}."
            exit 1
          elif [[ "${VIDEO_FTP_RESULT}" != "success" ]]; then
            echo "::error title=Ошибка FTP-очистки video::Основная очистка завершилась, но удаление старых MP4/PNG из video не подтверждено. Повторный запуск безопасен и удалит оставшиеся просроченные файлы."
            exit 1
          fi
