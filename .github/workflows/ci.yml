name: Main CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Validate recovery output newlines
    if: github.head_ref == 'chatgpt/fix-recovery-output-newlines'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/fix-recovery-output-newlines
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and validate fix
        run: |
          set -euo pipefail
          python automation/patches/fix_recovery_output_newlines.py
          python -m compileall -q automation/scripts automation/tests
          python -m unittest discover -s automation/tests -v
          python automation/scripts/validate_editorial_contract.py
          python automation/scripts/validate_archive.py
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json
      - name: Create validated Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_blob() {
            gh api --method POST \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -F content=@"$1" \
              -f encoding=utf-8 \
              --jq .sha
          }
          echo "BRANCH_HEAD=$(git rev-parse HEAD)"
          echo "BRANCH_TREE=$(git rev-parse HEAD^{tree})"
          echo "DAILY_BLOB=$(create_blob .github/workflows/daily-production.yml)"
          echo "CI_BLOB=$(git rev-parse origin/main:.github/workflows/ci.yml)"
          echo "VALIDATOR_BLOB=$(create_blob automation/scripts/validate_production_daily_contract.py)"
          echo "RELIABILITY_BLOB=$(create_blob automation/tests/test_production_reliability_patch.py)"
          echo "SYNC_BLOB=$(create_blob automation/tests/test_production_contract_sync.py)"
