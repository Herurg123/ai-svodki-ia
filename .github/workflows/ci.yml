name: Main CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "!automation/notebooklm-video/**"
      - "posts/**"
      - ".github/workflows/**"
      - "!.github/workflows/video-ci.yml"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  # Never cancel a paid Sol run via a second manual dispatch.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/experiment/sol-shadow-2026-10-23' }}

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI изменил защищённые пути." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Показать итог Main CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Main CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Main CI::Одна или несколько offline-проверок основного production-контура завершились ошибкой. Открой красный шаг выше; итог и принадлежность проверки указаны по-русски."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Main CI отменён::Запуск Main CI был отменён до завершения всех проверок."
          fi

  sol-shadow-23-offline-proof:
    name: "Бесплатная проверка заморозки Terra/Sol 23 октября"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'experiment/sol-shadow-2026-10-23' &&
      github.event.pull_request.head.repo.full_name == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Получить PR код без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Установить SDK для чистой офлайн-проверки"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Проверить исторический архив без OpenAI"
        run: python automation/audits/experiments/2026-10-23-sol-shadow/run_primary.py --offline
      - name: "Получить первоначальный Terra Primary"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-23-attempt-1
          run-id: 39884328846
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-23-proof
      - name: "Проверить exact Terra SHA-256 и 12 направлений"
        env:
          TERRA_RESEARCH_DIR: ${{ runner.temp }}/terra-23-proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["TERRA_RESEARCH_DIR"])/"production-daily/primary-recall-2026-10-23.json"
          raw=p.read_bytes()
          expected="39f689d1858d11df90ab77f8979e88435695148941cc78440e2d27eeb60a80c9"
          assert hashlib.sha256(raw).hexdigest()==expected, "Terra SHA mismatch"
          data=json.loads(raw)
          assert len(data["directions"])==12 and data["status"]=="complete"
          print("Terra Primary оригинален, все 12 направлений.")
          PY
      - name: "Скачать восемь реально оплаченных Sol ответов"
        uses: actions/download-artifact@v7
        with:
          name: sol-shadow-primary-2026-10-23-39891725068
          run-id: 39891725068
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sol-23-saved
      - name: "Воспроизвести 8 saved + 4 mocked через реальный Primary validator"
        env:
          SOL_SAVED_ROOT: ${{ runner.temp }}/sol-23-saved
        shell: bash
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-23-sol-shadow/verify_saved_primary.py \
            --root "${SOL_SAVED_ROOT}"
      - name: "Сохранить бесплатное доказательство 8/12"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-shadow-23-saved-eight-proof-${{ github.sha }}
          path: automation/preview/sol-shadow-2026-10-23/offline-8plus4.json
          if-no-files-found: warn
          retention-days: 14


  sol-shadow-23-resume-four:
    name: "Sol 23 октября: 8 сохранённых + 4 новых API (без денежного stop-guard)"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/experiment/sol-shadow-2026-10-23' &&
      github.repository == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sol-shadow-23-final-four-only
      cancel-in-progress: false
    steps:
      - name: "Разрешить только один НОВЫЙ ручной dispatch"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo "::error::Re-run запрещён"; exit 1; }
          python - <<'PY'
          import os,json,urllib.request
          url=("https://api.github.com/repos/Herurg123/ai-svodki-ia/actions/"
               "workflows/ci.yml/runs?event=workflow_dispatch&"
               "branch=experiment%2Fsol-shadow-2026-10-23&per_page=100")
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.load(response).get("workflow_runs",[])
          allowed={39891725068,int(os.environ["GITHUB_RUN_ID"])}
          unexpected=[x["id"] for x in runs if x["id"] not in allowed]
          if unexpected:
              raise SystemExit("Повторное выполнение запрещено. Уже есть dispatch: "+str(unexpected))
          original=[x for x in runs if x["id"]==39891725068]
          if len(original)!=1:
              raise SystemExit("Не найден строго исходный 8/12 paid run")
          print("Разовый запуск четырёх недостающих направлений разрешён.")
          PY
      - name: "Прочитать экспериментальную ветку без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "OpenAI SDK фиксированной версии"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Скачать оригинальные восемь Sol из failed run"
        uses: actions/download-artifact@v7
        with:
          name: sol-shadow-primary-2026-10-23-39891725068
          run-id: 39891725068
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-sol-eight
      - name: "Сквозной офлайн replay оригинальных 8 + 4 mocked"
        env:
          SOL_SAVED_ROOT: ${{ runner.temp }}/original-sol-eight
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-23-sol-shadow/verify_saved_primary.py \
            --root "${SOL_SAVED_ROOT}"
      - name: "Продолжить четыре оставшихся Sol поиска и учитывать каждый ответ"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOL_SHADOW_RESUME_APPROVED: "FOUR_ONLY"
          SOL_SAVED_ROOT: ${{ runner.temp }}/original-sol-eight
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY}" || { echo "::error::Отсутствует OPENAI_API_KEY"; exit 1; }
          python automation/audits/experiments/2026-10-23-sol-shadow/resume_four.py
      - name: "Скачать Terra checkpoint ТОЛЬКО для итогового сравнения"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-23-attempt-1
          run-id: 39884328846
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-23-for-comparison
      - name: "Сопоставить Sol и Terra по Primary без API"
        env:
          TERRA_DIR: ${{ runner.temp }}/terra-23-for-comparison
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-23-sol-shadow/compare_primary.py \
            --terra "${TERRA_DIR}/production-daily/primary-recall-2026-10-23.json" \
            --sol automation/preview/production-daily/primary-recall-2026-10-23.json \
            --output-prefix automation/preview/sol-shadow-2026-10-23/resume-four/ab-review
      - name: "Сохранить usage, оригиналы, partial даже при ошибке"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-shadow-2026-10-23-completed-${{ github.run_id }}
          path: |
            automation/preview/sol-shadow-2026-10-23/
            automation/preview/production-daily/primary-recall-2026-10-23.json
            automation/preview/production-daily/research-error.json
          if-no-files-found: warn
          retention-days: 14
      - name: "Результат ручного завершения Sol"
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Sol Primary 2026-10-23: 8 frozen + 4 new"
            echo "- Статус: ${JOB_RESULT}"
            echo "- Новый максимум: 4 Responses; повтор первых 8 запрещён"
            echo "- Денежный stop-guard снят по разрешению владельца 23 октября"
            echo "- Реальные usage, API IDs и тарифы в Actions artifact"
            echo "- Это расчёт стоимости, а не OpenAI invoice"
            echo "- Без Editorial, Coverage, Image, FTP, публикации, write-токена"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${JOB_RESULT}" != "success" ]]; then
            echo "::warning title=Продолжение неполно::Не нажимайте Re-run. Сохраните artifact."
          fi
