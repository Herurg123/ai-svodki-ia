name: Main CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "!automation/notebooklm-video/**"
      - "posts/**"
      - ".github/workflows/**"
      - "!.github/workflows/video-ci.yml"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI изменил защищённые пути." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Показать итог Main CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Main CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Main CI::Одна или несколько offline-проверок основного production-контура завершились ошибкой. Открой красный шаг выше; итог и принадлежность проверки указаны по-русски."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Main CI отменён::Запуск Main CI был отменён до завершения всех проверок."
          fi

  sol-shadow-proof:
    name: "Офлайн-проверка оригинального Sol ZIP (0 USD)"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'experiment/sol-api-shadow-2026-10-22' &&
      github.event.pull_request.head.repo.full_name == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Получить PR-ветку без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python для офлайн-проверки"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Получить исходный артефакт (без API)"
        uses: actions/download-artifact@v7
        with:
          name: sol-api-shadow-2026-10-22-attempt-1
          run-id: 39726774610
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sol-saved
      - name: "Проверить реальные 7+5 через production Primary"
        env:
          SOL_SAVED_ROOT: ${{ runner.temp }}/sol-saved
          SOL_SHADOW_REPLAY_ARTIFACT: ${{ runner.temp }}/sol-original-frozen.zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          src = Path(os.environ["SOL_SAVED_ROOT"])
          dst = Path(os.environ["SOL_SHADOW_REPLAY_ARTIFACT"])
          required = {"production-daily/primary-recall-2026-10-22.json",
                      "sol-shadow-2026-10-22/execution.json"}
          actual = {p.relative_to(src).as_posix() for p in src.rglob("*") if p.is_file()}
          assert required <= actual, f"Missing original evidence: {required - actual}"
          with zipfile.ZipFile(dst, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob("*"):
                  if p.is_file():
                      z.write(p, p.relative_to(src).as_posix())
          PY
          python automation/audits/experiments/2026-10-22-sol-api-shadow/run_shadow.py --offline-verify
      - name: "Сохранить отчёт реальной офлайн-проверки"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-shadow-original-replay-proof-${{ github.sha }}
          path: automation/preview/sol-shadow-2026-10-22/offline-verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: "Русский итог бесплатного доказательства"
        if: always()
        shell: bash
        run: |
          {
            echo "## Проверка Sol replay"
            echo
            echo "- Оригинальный ZIP из Actions run 39726774610"
            echo "- Семь сохранённых и пять имитированных Primary passes"
            echo "- Никакие вызовы платного OpenAI API не выполнялись"
            echo "- Результат проверки — в job и JSON artifact"
          } >> "$GITHUB_STEP_SUMMARY"

