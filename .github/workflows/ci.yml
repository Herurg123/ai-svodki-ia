name: Main CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "!automation/notebooklm-video/**"
      - "posts/**"
      - ".github/workflows/**"
      - "!.github/workflows/video-ci.yml"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/experiment/sol-shadow-2026-10-24' }}

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI изменил защищённые пути." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Показать итог Main CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Main CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Main CI::Одна или несколько offline-проверок основного production-контура завершились ошибкой. Открой красный шаг выше; итог и принадлежность проверки указаны по-русски."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Main CI отменён::Запуск Main CI был отменён до завершения всех проверок."
          fi

  sol-24-paid-once:
    name: "Однократный Sol Primary 24.10: 12 поисков, без денежного stop-guard"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/experiment/sol-shadow-2026-10-24' &&
      github.repository == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sol-oct24-one-shot
      cancel-in-progress: false
    steps:
      - name: "Не допустить второй платный запуск"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1 || { echo "::error::Re-run запрещён"; exit 1; }
          python - <<'PY'
          import json,os,urllib.request
          url=("https://api.github.com/repos/Herurg123/ai-svodki-ia/actions/"
               "workflows/ci.yml/runs?event=workflow_dispatch&"
               "branch=experiment%2Fsol-shadow-2026-10-24&per_page=100")
          req=urllib.request.Request(url,headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.load(response)["workflow_runs"]
          previous=[x["id"] for x in runs if str(x["id"])!=os.environ["GITHUB_RUN_ID"]]
          if previous: raise SystemExit("Уже есть ручной run: "+str(previous))
          print("Подтверждён первый и единственный Sol 24 dispatch.")
          PY
      - name: "Получить код без write-доступа"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Установить OpenAI SDK"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Проверить pre-publication архив и окно БЕСПЛАТНО"
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-24-sol-shadow/run_primary.py --offline
      - name: "Sol 24: 12 поисков с полным журналом цены"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOL_SHADOW_OWNER_APPROVAL: "UNCAPPED_12_ONLY"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY}" || { echo "::error::Нет OPENAI_API_KEY"; exit 1; }
          python automation/audits/experiments/2026-10-24-sol-shadow/run_primary.py --paid
      - name: "Скачать Terra baseline ТОЛЬКО после Sol"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-24-attempt-1
          run-id: 40050398793
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-24-after-sol
      - name: "Сверить Terra original SHA и сравнить с Sol бесплатно"
        env:
          TERRA_DIR: ${{ runner.temp }}/terra-24-after-sol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          p=Path(os.environ["TERRA_DIR"])/"production-daily/primary-recall-2026-10-24.json"
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="5240a7a12c9759ce0bd48e260e80faddb17d5e9dff9fb90ec3608729788f56fe"
          j=json.loads(raw)
          assert j["status"]=="complete" and len(j["directions"])==12
          assert j["search_window"]["start_at"]=="2026-10-22T04:31:19+03:00"
          assert j["search_window"]["end_at"]=="2026-10-24T04:35:28+03:00"
          print("Оригинальный Terra Primary за 24-е совпадает.")
          PY
          python automation/audits/experiments/2026-10-24-sol-shadow/compare_primary.py \
            --terra "${TERRA_DIR}/production-daily/primary-recall-2026-10-24.json" \
            --sol automation/preview/production-daily/primary-recall-2026-10-24.json \
            --output-prefix automation/preview/sol-shadow-2026-10-24/ab-review
      - name: "Сохранить исходные API/usage/candidates даже при ошибке"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-shadow-2026-10-24-${{ github.run_id }}
          path: |
            automation/preview/sol-shadow-2026-10-24/
            automation/preview/production-daily/primary-recall-2026-10-24.json
            automation/preview/production-daily/research-error.json
          retention-days: 14
          if-no-files-found: warn
      - name: "Итог контрольного Sol Research"
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Финальный Sol 24.10.2026"
            echo "- Статус: ${RESULT}"
            echo "- Только 12 новых Responses, без SDK retries"
            echo "- Денежный stop-guard снят по разрешению владельца"
            echo "- Обязательный журнал usage, service tier и стоимости всех API"
            echo "- Смета не равна фактическому OpenAI invoice"
            echo "- Никакого Editorial, Coverage, Image, FTP, публикации или write-доступа"
            echo "- Артефакт: sol-shadow-2026-10-24-${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${RESULT}" != "success" ]]; then
            echo "::warning title=Sol 24 не завершён::Не нажимать Re-run, использовать сохранённый ZIP"
          fi

  sol-24-offline-proof:
    name: "Бесплатная проверка первоисточника Terra 24 и архива Sol"
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'experiment/sol-shadow-2026-10-24' &&
      github.event.pull_request.head.repo.full_name == 'Herurg123/ai-svodki-ia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Получить код PR без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Установить SDK без вызова API"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Проверить архив и окно БЕСПЛАТНО"
        run: python automation/audits/experiments/2026-10-24-sol-shadow/run_primary.py --offline
      - name: "Скачать оригинальный Terra Research checkpoint"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-24-attempt-1
          run-id: 40050398793
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra24-proof
      - name: "Сверить Terra SHA-256, дату и 12 проходов"
        env:
          TERRA_DIR: ${{ runner.temp }}/terra24-proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          p=Path(os.environ["TERRA_DIR"])/"production-daily/primary-recall-2026-10-24.json"
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="5240a7a12c9759ce0bd48e260e80faddb17d5e9dff9fb90ec3608729788f56fe", "Terra checksum"
          j=json.loads(raw)
          assert j["status"]=="complete" and len(j["directions"])==12
          assert j["search_budget"]["completed_calls"]==12
          assert j["search_window"]["start_at"]=="2026-10-22T04:31:19+03:00"
          assert j["search_window"]["end_at"]=="2026-10-24T04:35:28+03:00"
          print("Proof: Terra 24 original Primary 12/12, 0 paid API.")
          PY
