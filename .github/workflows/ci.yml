name: Main CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  apply-agency-rescue-query-tuning:
    name: Apply agency rescue query tuning
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/agency-rescue-after-source-monopoly'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply tuning and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python .github/_tmp_tune_agency_rescue_query.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m compileall -q automation/scripts automation/tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tune bounded fresh-agency rescue query'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}