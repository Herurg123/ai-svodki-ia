name: Main CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Report branch tree
    if: github.head_ref == 'chatgpt/fix-rate-limit-and-recovery-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/fix-rate-limit-and-recovery-fallback
          fetch-depth: 0
          persist-credentials: false
      - name: Print branch tree
        run: |
          echo "BRANCH_HEAD=$(git rev-parse HEAD)"
          echo "BRANCH_TREE=$(git rev-parse HEAD^{tree})"
