name: Main CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build validated recovery fix
    if: github.head_ref == 'chatgpt/fix-rate-limit-and-recovery-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/fix-rate-limit-and-recovery-fallback
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply fix and restore normal CI
        run: |
          set -euo pipefail
          python automation/patches/fix_rate_limit_patcher.py
          python automation/patches/apply_rate_limit_and_recovery_fix.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm \
            automation/patches/apply_rate_limit_and_recovery_fix.py \
            automation/patches/fix_rate_limit_patcher.py

      - name: Compile and run repository tests
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests
          python -m unittest discover -s automation/tests -v
          python automation/scripts/validate_editorial_contract.py
          python automation/scripts/validate_archive.py
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Export validated source files
        uses: actions/upload-artifact@v7
        with:
          name: validated-rate-limit-recovery-fix
          path: |
            .github/workflows/ci.yml
            .github/workflows/daily-production.yml
            automation/scripts/generate_digest_preview.py
            automation/scripts/ensure_story_coverage.py
            automation/scripts/validate_production_daily_contract.py
            automation/tests/test_production_contract_sync.py
            automation/tests/test_production_reliability_patch.py
            automation/tests/test_rate_limit_retry_configuration.py
          if-no-files-found: error
          retention-days: 2
