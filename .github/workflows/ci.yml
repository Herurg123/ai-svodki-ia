name: Main CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  live-agency-rescue-smoke-v2:
    name: Live Aug 14 agency rescue v2 recovery smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/agency-rescue-after-source-monopoly'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenAI SDK
        run: python -m pip install --disable-pip-version-check --no-input 'openai==2.21.0'
      - name: Download failed production artifact
        uses: actions/download-artifact@v8
        with:
          name: daily-production-2026-08-14
          path: automation/preview/recovery-smoke-source
          run-id: 31771774225
          github-token: ${{ github.token }}
      - name: Stage exact production recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf automation/preview/2026-08-14 automation/preview/production-daily
          cp -a automation/preview/recovery-smoke-source/2026-08-14 automation/preview/2026-08-14
          mkdir -p automation/preview/production-daily
          cp -a automation/preview/recovery-smoke-source/production-daily/coverage-audit.json automation/preview/production-daily/coverage-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('automation/preview/production-daily/coverage-audit.json').read_text(encoding='utf-8'))
          budget=report.get('search_budget') or {}
          assert budget.get('completed_calls') == 6, budget
          assert budget.get('remaining_calls') == 1, budget
          assert len(report.get('attempts') or []) == 6, len(report.get('attempts') or [])
          print('Recovered exact failed production audit: six completed calls + one free slot.')
          PY
      - name: Run one bounded recovery Coverage pass
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          python automation/scripts/ensure_story_coverage.py \
            --artifact-dir automation/preview/2026-08-14 \
            --archive automation/archive/index.json \
            --publication-date 2026-08-14 \
            --model "${OPENAI_TEXT_MODEL}" \
            --usual-total 7 \
            --minimum-publishable 1 \
            --maximum-audit-web-search-calls 7 \
            --maximum-candidates 20 \
            --maximum-selected-stories 12 \
            --report automation/preview/production-daily/coverage-audit.json
      - name: Assert one useful seventh rescue search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('automation/preview/production-daily/coverage-audit.json').read_text(encoding='utf-8'))
          attempts=report.get('attempts') or []
          rescue=[a for a in attempts if isinstance(a,dict) and a.get('search_strategy') == 'fresh_agency_rescue']
          ordinary=[a for a in attempts if isinstance(a,dict) and a.get('search_strategy') != 'fresh_agency_rescue']
          assert len(rescue) == 1, rescue
          assert len(ordinary) == 6, len(ordinary)
          r=rescue[0]
          api=r.get('api') or {}
          assert api.get('web_search_calls_completed') == 1, api
          assert r.get('allowed_domains') == ['reuters.com','apnews.com'], r.get('allowed_domains')
          assert r.get('agency_rescue_version') == 2, r.get('agency_rescue_version')
          assert r.get('candidate_count', 0) >= 1, r
          assert r.get('actual_queries') == ['latest artificial intelligence funding acquisition models chips data centers cybersecurity'], r.get('actual_queries')
          budget=report.get('search_budget') or {}
          assert budget.get('completed_calls') == 7, budget
          assert budget.get('remaining_calls') == 0, budget
          assert report.get('source_health_contract_version') == 2, report.get('source_health_contract_version')
          print(json.dumps({
            'rescue_status': (report.get('agency_rescue') or {}).get('status'),
            'rescue_actual_queries': r.get('actual_queries'),
            'rescue_candidate_count': r.get('candidate_count'),
            'rescue_candidates': [c.get('title') for c in r.get('candidates') or []],
            'audit_added_candidates': report.get('audit_added_candidates'),
            'candidate_pool_after': report.get('candidate_pool_after'),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Normalize and validate recovered digest
        shell: bash
        run: |
          set -euo pipefail
          python automation/scripts/normalize_digest_artifact.py \
            --artifact-dir automation/preview/2026-08-14 \
            --report automation/preview/2026-08-14/artifact-normalization.json
          python automation/scripts/validate_digest_artifact.py \
            --artifact-dir automation/preview/2026-08-14 \
            --report automation/preview/2026-08-14/artifact-validation.json
          python automation/scripts/validate_story_coverage.py \
            --artifact-dir automation/preview/2026-08-14 \
            --usual-total 7 \
            --minimum-publishable 1 \
            --report automation/preview/production-daily/story-coverage-validation.json
      - name: Assert final source diversity and summarize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('automation/preview/2026-08-14')
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')).get('candidates') or []
          candidate_by_id={str(c.get('candidate_id') or c.get('id')): c for c in candidates}
          stories=json.loads((root/'stories.json').read_text(encoding='utf-8')).get('stories') or []
          domains=[]
          for item in candidates:
            url=(item.get('primary_source') or {}).get('url') or ''
            domains.append((urlparse(url).hostname or '').lower())
          agency_domains={'reuters.com','www.reuters.com','apnews.com','www.apnews.com','bloomberg.com','www.bloomberg.com','ft.com','www.ft.com'}
          assert any(d in agency_domains or any(d.endswith('.'+a) for a in agency_domains) for d in domains), domains
          selected_domains=[]
          for story in stories:
            cid=str(story.get('candidate_id'))
            candidate=candidate_by_id.get(cid) or {}
            url=(candidate.get('primary_source') or {}).get('url') or ''
            selected_domains.append((urlparse(url).hostname or '').lower())
          print(json.dumps({
            'candidate_count': len(candidates),
            'primary_domains': sorted(set(domains)),
            'story_count': len(stories),
            'selected_primary_domains': selected_domains,
            'story_titles': [s.get('title') or s.get('headline') for s in stories],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload recovery smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agency-rescue-v2-recovery-smoke-2026-08-14
          path: |
            automation/preview/2026-08-14/
            automation/preview/production-daily/coverage-audit.json
            automation/preview/production-daily/story-coverage-validation.json
          if-no-files-found: warn
          retention-days: 7