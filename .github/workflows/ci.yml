name: Main CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI modified protected paths." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: One-time sync Source Freshness docs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/source-freshness-proof-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sections = {
              Path("README.md"): r'''

## Source Freshness Proof v1

С 2026-08-17 модельные `published_at` и `published_date` больше не являются достаточным доказательством свежести trusted production candidate. Перед каждым editorial-проходом внутреннего Primary/Hybrid/Coverage runtime `automation/scripts/source_freshness.py` бесплатно, без OpenAI и Web Search, открывает только уже процитированные source URL и извлекает машинно-читаемое время публикации (`article:published_time`, JSON-LD `datePublished` и эквиваленты). `dateModified` не используется как дата публикации.

Сравнение с сохранённым effective `search_window` и перевод timezone делает Python. Точный timestamp обязан попадать в окно; date-only evidence на календарном дне cutoff недостаточно и fail-closed. Если primary source не отдаёт пригодную дату, но уже цитируемый supporting source подтверждает свежесть, supporting может стать primary. Нового поиска для этого нет.

Источник с подтверждённой датой вне окна исключает candidate как `old_reprint`. Если ни один уже цитируемый источник не позволяет независимо доказать дату публикации, candidate становится `unconfirmed` и не может быть опубликован. Caller-supplied fixtures остаются offline.

Контрольная регрессия: AP/Anthropic в выпуске 2026-08-17 был ошибочно размечен как 2026-08-16 при фактическом `datePublished=2026-07-31`; новый gate его отсекает. Свежий timestamp вроде TechCrunch `2026-08-16T13:57:00-07:00` корректно остаётся внутри окна благодаря Python timezone arithmetic.

Механика поиска не меняется: новые Search/OpenAI вызовы не добавлены, 7-й Coverage slot не менялся, потолок остаётся **12 Primary + до 4 Hybrid + до 7 Coverage = 23 search operations**.
''',
              Path("automation/README.md"): r'''

## Source Freshness Proof v1

Trusted production runtime перед каждым editorial-проходом через `run_digest_preview.py` запускает `scripts/source_freshness.py`. Verifier не вызывает OpenAI или Web Search: он открывает только source URL, уже сохранённые в candidate, и ищет машинно-читаемое publication evidence (`article:published_time`, JSON-LD `datePublished`, `<time>` и эквивалентные publisher metadata). `dateModified` не считается датой публикации.

Timezone arithmetic выполняется Python против сохранённого effective `search_window`. Точный timestamp проверяется по обеим границам; date-only evidence на календарном дне cutoff fail-closed. Если primary URL не отдаёт пригодную дату, уже цитируемый supporting source может подтвердить свежесть и быть повышен до primary. Новый retrieval для этого не запускается.

Подтверждённая дата вне окна переводит candidate в `exclude / old_reprint`; отсутствие независимо проверяемой даты у всех уже цитируемых источников переводит его в `unconfirmed` и блокирует публикацию. Gate применяется к внутренним Primary, Hybrid и Coverage runtime-handoff; caller fixtures остаются offline.

Диагностика пишется в `preview/production-daily/source-freshness-YYYY-MM-DD.json` и содержит этап, eligible before/after, найденные даты и `paid_api_calls=0`. Regression-тест 2026-08-17 закрепляет старую AP/Anthropic статью с фактическим `datePublished=2026-07-31` как stale и свежий offset timestamp TechCrunch как допустимый.

Поисковые лимиты и adaptive Coverage не меняются. В частности, никакого нового short-pool использования 7-го слота нет; максимум остаётся **12 Primary + до 4 Hybrid + до 7 Coverage = 23 search operations**.

Ручная офлайн/HTTP-проверка уже сохранённого trusted research:

```bash
python automation/scripts/source_freshness.py \
  --research automation/fixtures/research/.runtime/<research>.json \
  --publication-date YYYY-MM-DD \
  --report automation/preview/production-daily/source-freshness-YYYY-MM-DD.json
```

Команда не вызывает платные API, но требует обычного сетевого доступа к уже цитируемым страницам источников.
''',
          }
          marker = "## Source Freshness Proof v1"
          changed = False
          for path, section in sections.items():
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + section + "\n", encoding="utf-8")
                  changed = True
          print(f"docs_changed={changed}")
          PY
          if git diff --quiet -- README.md automation/README.md; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md automation/README.md
          git commit -m "Document source freshness proof"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
