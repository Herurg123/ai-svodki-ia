name: Main CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "posts/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  actions: read
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q automation/scripts automation/tests
      - name: Run unit tests
        run: python -m unittest discover -s automation/tests -v
      - name: Validate editorial contract
        run: python automation/scripts/validate_editorial_contract.py
      - name: Validate committed archive
        run: python automation/scripts/validate_archive.py
      - name: Validate production workflow contract
        run: |
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json
      - name: Validate RSS, sitemap and structured data
        run: |
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py --rss posts/rss.xml --site-base-url https://rybalka.one/posts --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py --sitemap posts/sitemap.xml --rss posts/rss.xml --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py --source-dir "${latest_content_dir}" --posts-root posts --report automation/preview/ci/structured-data.json
      - name: Verify offline checks did not modify protected paths
        run: test -z "$(git status --porcelain -- posts/)"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

  validate-saved-aug14-terra-artifact:
    name: Validate saved Aug 14 Terra digest with final code
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/relative-freshness-retrieval'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out final PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download generated Terra artifact from successful retrieval smoke
        uses: actions/download-artifact@v8
        with:
          name: terra-today-preview-headroom-2026-08-14
          path: automation/preview/revalidated-aug14
          run-id: 31770400359
          github-token: ${{ github.token }}
      - name: Normalize with final source-health contract
        run: |
          set -euo pipefail
          python automation/scripts/normalize_digest_artifact.py \
            --artifact-dir automation/preview/revalidated-aug14/2026-08-14 \
            --report automation/preview/revalidated-aug14/2026-08-14/artifact-normalization.json
      - name: Validate complete text artifact
        run: |
          set -euo pipefail
          python automation/scripts/validate_digest_artifact.py \
            --artifact-dir automation/preview/revalidated-aug14/2026-08-14 \
            --report automation/preview/revalidated-aug14/2026-08-14/artifact-validation.json
          python automation/scripts/validate_story_coverage.py \
            --artifact-dir automation/preview/revalidated-aug14/2026-08-14 \
            --usual-total 7 \
            --minimum-publishable 1 \
            --report automation/preview/revalidated-aug14/story-coverage-validation.json
      - name: Summarize generated digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('automation/preview/revalidated-aug14/2026-08-14')
          digest=json.loads((root/'digest.json').read_text(encoding='utf-8'))
          stories=json.loads((root/'stories.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8'))
          story_list=stories.get('stories', stories) if isinstance(stories,dict) else stories
          cand_list=candidates.get('candidates', candidates) if isinstance(candidates,dict) else candidates
          summary={
            'title': digest.get('title'),
            'short_digest': digest.get('short_digest'),
            'candidate_count': len(cand_list),
            'story_count': len(story_list),
            'story_titles': [s.get('title') or s.get('headline') for s in story_list if isinstance(s,dict)],
          }
          out=Path('automation/preview/revalidated-aug14/final-validation-summary.json')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload final validated text preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validated-terra-digest-2026-08-14
          path: automation/preview/revalidated-aug14/
          if-no-files-found: error
          retention-days: 7
