name: Main CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  publish-validated-aug14:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/publish-validated-aug14'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download already validated Terra digest
        uses: actions/download-artifact@v8
        with:
          name: validated-terra-digest-2026-08-14
          path: staged
          run-id: 31771032492
          github-token: ${{ github.token }}
      - name: Recheck saved validation reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('staged')
          validation=json.loads((root/'2026-08-14/artifact-validation.json').read_text(encoding='utf-8'))
          coverage=json.loads((root/'story-coverage-validation.json').read_text(encoding='utf-8'))
          summary=json.loads((root/'final-validation-summary.json').read_text(encoding='utf-8'))
          assert validation.get('status')=='ok', validation
          assert not validation.get('errors'), validation.get('errors')
          assert not validation.get('warnings'), validation.get('warnings')
          assert coverage.get('valid') is True and coverage.get('publication_allowed') is True, coverage
          assert summary.get('story_count')==5 and summary.get('candidate_count')==8, summary
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload under standard production recovery name
        uses: actions/upload-artifact@v7
        with:
          name: daily-production-2026-08-14
          path: staged/
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch current main production from this recovery artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"publication_date\":\"2026-08-14\",\"publish\":\"true\",\"recovery_run_id\":\"%s\"}}' "${GITHUB_RUN_ID}")"
          printf '%s' "${payload}" | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-production.yml/dispatches" --input -
          echo "Dispatched production with recovery_run_id=${GITHUB_RUN_ID}."