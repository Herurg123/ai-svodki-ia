name: Main CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "!automation/notebooklm-video/**"
      - "posts/**"
      - ".github/workflows/**"
      - "!.github/workflows/video-ci.yml"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  # Never cancel a paid Sol run via a second manual dispatch.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/experiment/sol-shadow-2026-10-23' }}

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI изменил защищённые пути." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Показать итог Main CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Main CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Main CI::Одна или несколько offline-проверок основного production-контура завершились ошибкой. Открой красный шаг выше; итог и принадлежность проверки указаны по-русски."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Main CI отменён::Запуск Main CI был отменён до завершения всех проверок."
          fi

  sol-shadow-23-once:
    name: "Однократная Sol Primary 23 октября (только вручную, $1)"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/experiment/sol-shadow-2026-10-23' &&
      github.repository == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: sol-shadow-2026-10-23-one-shot
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Проверить отсутствие предыдущего запуска до API"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo "::error::Повтор платного Sol запрещён"; exit 1; }
          python - <<'PY'
          import os, json, urllib.request
          url = ("https://api.github.com/repos/Herurg123/ai-svodki-ia/actions/"
                 "workflows/ci.yml/runs?event=workflow_dispatch&"
                 "branch=experiment%2Fsol-shadow-2026-10-23&per_page=100")
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              runs = json.load(resp).get("workflow_runs", [])
          others = [x for x in runs if str(x["id"]) != os.environ["GITHUB_RUN_ID"]]
          if others:
              raise SystemExit("Sol shadow уже запускался: run " + str(others[0]["id"]))
          print("Подтверждён единственный ручной запуск.")
          PY
      - name: "Загрузить код ветки (read-only)"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Подготовить Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Установить OpenAI SDK для проверки и последующего Search"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Скачать первоначальный Terra Research checkpoint"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-23-attempt-1
          run-id: 39884328846
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-23
      - name: "Проверить заморозку и Terra Primary без API"
        env:
          TERRA_RESEARCH_DIR: ${{ runner.temp }}/terra-23
        shell: bash
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-23-sol-shadow/run_primary.py --offline
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ["TERRA_RESEARCH_DIR"])/"production-daily/primary-recall-2026-10-23.json"
          j=json.loads(p.read_text(encoding="utf-8"))
          w=j.get("search_window",{})
          assert j.get("status")=="complete", "Terra Primary incomplete"
          assert len(j.get("directions",[]))==12, "Terra must have 12 Primary passes"
          assert w.get("start_at")=="2026-10-21T04:32:02+03:00", w
          assert w.get("end_at")=="2026-10-23T04:31:19+03:00", w
          frozen_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert frozen_sha=="39f689d1858d11df90ab77f8979e88435695148941cc78440e2d27eeb60a80c9", "Terra snapshot differs"
          print("Terra frozen 12/12 sha256:",frozen_sha)
          PY
      - name: "Выполнить Sol Primary без публикации (макс. 12 API)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOL_SHADOW_OWNER_APPROVAL_USD: "1.00"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY}" || { echo "::error::Секрет OPENAI_API_KEY отсутствует"; exit 1; }
          python automation/audits/experiments/2026-10-23-sol-shadow/run_primary.py --paid
      - name: "Сравнить Primary Terra и Sol (без API)"
        env:
          TERRA_RESEARCH_DIR: ${{ runner.temp }}/terra-23
        shell: bash
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-23-sol-shadow/compare_primary.py \
            --terra "${TERRA_RESEARCH_DIR}/production-daily/primary-recall-2026-10-23.json" \
            --sol automation/preview/production-daily/primary-recall-2026-10-23.json \
            --output-prefix automation/preview/sol-shadow-2026-10-23/ab-review
      - name: "Сохранить оригинальные ответы и результаты даже при ошибке"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-shadow-primary-2026-10-23-${{ github.run_id }}
          path: |
            automation/preview/sol-shadow-2026-10-23/
            automation/preview/production-daily/primary-recall-2026-10-23.json
            automation/preview/production-daily/research-error.json
          retention-days: 14
          if-no-files-found: warn
      - name: "Итог контрольного Sol Research на русском"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "# Контрольный Sol Primary за 23 октября"
            echo "- **Статус:** ${JOB_STATUS}"
            echo "- Только ручной запуск на экспериментальной ветке"
            echo "- **Без:** Editorial, Coverage, Image, FTP, публикации, коммитов"
            echo "- **Бюджет:** клиентская оценка до $1, не жёсткий предел провайдера"
            echo "- **Артефакт:** sol-shadow-primary-2026-10-23-${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" != "success" ]]; then
            echo "::warning title=Контрольный Sol незавершён::Не запускайте повторно. Исходные ответы сохранены в artifact."
          fi


  sol-shadow-23-offline-proof:
    name: "Бесплатная проверка заморозки Terra/Sol 23 октября"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'experiment/sol-shadow-2026-10-23' &&
      github.event.pull_request.head.repo.full_name == 'Herurg123/ai-svodki-ia'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Получить PR код без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Установить SDK для чистой офлайн-проверки"
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Проверить исторический архив без OpenAI"
        run: python automation/audits/experiments/2026-10-23-sol-shadow/run_primary.py --offline
      - name: "Получить первоначальный Terra Primary"
        uses: actions/download-artifact@v7
        with:
          name: daily-production-checkpoint-research-2026-10-23-attempt-1
          run-id: 39884328846
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-23-proof
      - name: "Проверить exact Terra SHA-256 и 12 направлений"
        env:
          TERRA_RESEARCH_DIR: ${{ runner.temp }}/terra-23-proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["TERRA_RESEARCH_DIR"])/"production-daily/primary-recall-2026-10-23.json"
          raw=p.read_bytes()
          expected="39f689d1858d11df90ab77f8979e88435695148941cc78440e2d27eeb60a80c9"
          assert hashlib.sha256(raw).hexdigest()==expected, "Terra SHA mismatch"
          data=json.loads(raw)
          assert len(data["directions"])==12 and data["status"]=="complete"
          print("Terra Primary оригинален, все 12 направлений.")
          PY
