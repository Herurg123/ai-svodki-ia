name: Main CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_sol_shadow_oct22:
        description: "Только Sol Primary 22.10 (семь replay + пять новых), без публикации"
        required: false
        type: boolean
        default: false
      sol_shadow_confirmation:
        description: "Для платного теста вручную ввести SOL22-PRIMARY-USD1; без этого API не вызывается"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "!automation/notebooklm-video/**"
      - "posts/**"
      - ".github/workflows/**"
      - "!.github/workflows/video-ci.yml"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/tests -v

      - name: Validate editorial contract
        run: |
          set -euo pipefail
          python automation/scripts/validate_editorial_contract.py

      - name: Validate committed archive
        run: |
          set -euo pipefail
          python automation/scripts/validate_archive.py

      - name: Validate production workflow contract
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_production_daily_contract.py \
            --config automation/config/production-daily.json \
            --site-config automation/config/site.json \
            --workflow .github/workflows/daily-production.yml \
            --rss posts/rss.xml \
            --report automation/preview/ci/production-contract.json

      - name: Validate RSS, sitemap and structured data
        run: |
          set -euo pipefail
          mkdir -p automation/preview/ci
          python automation/scripts/validate_dzen_feed.py \
            --rss posts/rss.xml \
            --site-base-url https://rybalka.one/posts \
            --report automation/preview/ci/dzen-feed.json
          python automation/scripts/validate_posts_sitemap.py \
            --sitemap posts/sitemap.xml \
            --rss posts/rss.xml \
            --report automation/preview/ci/posts-sitemap.json
          latest_content_dir="$(find automation/content -mindepth 1 -maxdepth 1 -type d -name '????-??-??' | sort | tail -n 1)"
          test -n "${latest_content_dir}"
          python automation/scripts/validate_structured_data.py \
            --source-dir "${latest_content_dir}" \
            --posts-root posts \
            --report automation/preview/ci/structured-data.json

      - name: Verify offline checks did not modify protected paths
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- posts/)" ]]; then
            echo "Offline CI изменил защищённые пути." >&2
            git status --short -- posts/
            exit 1
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-${{ github.sha }}
          path: automation/preview/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Показать итог Main CI
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) result="успешно" ;;
            failure) result="ошибка" ;;
            cancelled) result="отменено" ;;
            *) result="${JOB_STATUS}" ;;
          esac
          {
            echo "# Main CI"
            echo
            echo "- **Результат:** ${result}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${JOB_STATUS}" == "failure" ]]; then
            echo "::error title=Ошибка Main CI::Одна или несколько offline-проверок основного production-контура завершились ошибкой. Открой красный шаг выше; итог и принадлежность проверки указаны по-русски."
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            echo "::warning title=Main CI отменён::Запуск Main CI был отменён до завершения всех проверок."
          fi

  sol-shadow-oct22:
    name: "Ручной Sol shadow 22.10: только Primary, до 1 USD"
    # Никаких оплачиваемых запросов в PR, CI, push или по расписанию.
    # Один явно подтверждённый workflow_dispatch на указанной PR-ветке.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_sol_shadow_oct22 == true &&
      inputs.sol_shadow_confirmation == 'SOL22-PRIMARY-USD1' &&
      github.ref_name == 'experiment/sol-api-shadow-2026-10-22' &&
      github.run_attempt == 1
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Получить точную ветку без write-токена"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Установить Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Получить исходный артефакт Sol без повторных платных вызовов"
        uses: actions/download-artifact@v7
        with:
          name: sol-api-shadow-2026-10-22-attempt-1
          run-id: 39726774610
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sol-saved
      - name: "Собрать исходный ZIP и проверить наличие всех файлов"
        shell: bash
        env:
          SOL_SAVED_ROOT: ${{ runner.temp }}/sol-saved
          SOL_ZIP_PATH: ${{ runner.temp }}/sol-original-frozen.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          src = Path(os.environ["SOL_SAVED_ROOT"])
          target = Path(os.environ["SOL_ZIP_PATH"])
          required = {
              "production-daily/primary-recall-2026-10-22.json",
              "sol-shadow-2026-10-22/execution.json",
          }
          found = {p.relative_to(src).as_posix() for p in src.rglob("*") if p.is_file()}
          missing = required - found
          if missing:
              raise SystemExit("Отсутствуют оригиналы frozen artifact: " + str(sorted(missing)))
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as out:
              for file in src.rglob("*"):
                  if file.is_file():
                      out.write(file, file.relative_to(src).as_posix())
          print("ZIP frozen evidence собран из скачанного original GitHub Artifact")
          PY
      - name: "Установить pinned OpenAI SDK, без вызовов API"
        shell: bash
        run: python -m pip install --disable-pip-version-check "openai==2.45.0"
      - name: "Сквозная офлайн-проверка реальных семи проходов и mock пяти"
        shell: bash
        env:
          SOL_SHADOW_REPLAY_ARTIFACT: ${{ runner.temp }}/sol-original-frozen.zip
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-22-sol-api-shadow/run_shadow.py --offline-verify
      - name: "Разрешённый платный прогон Sol: только недостающие пять Primary"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOL_SHADOW_OWNER_APPROVAL_USD: "1.00"
          SOL_SHADOW_REPLAY_ARTIFACT: ${{ runner.temp }}/sol-original-frozen.zip
          OPENAI_TEXT_MODEL: "gpt-6.1-sol"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python automation/audits/experiments/2026-10-22-sol-api-shadow/run_shadow.py --paid
      - name: "Сохранить отчёт без публикации"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sol-primary-shadow-2026-10-22-attempt-1
          path: |
            automation/preview/sol-shadow-2026-10-22/
            automation/preview/production-daily/
          if-no-files-found: warn
          retention-days: 14
      - name: "Русский итог платного эксперимента"
        if: always()
        shell: bash
        run: |
          {
            echo "## Независимый Sol Primary"
            echo
            echo "- Дата поиска Terra: 22.10.2026, исходное окно зафиксировано"
            echo "- Sol: gpt-6.1-sol / medium"
            echo "- Ранее оплаченные семь: обязательный offline replay; новые: максимум пять"
            echo "- Бюджет новой попытки: client-side лимит 1 USD, не provider hard cap"
            echo "- Production / Image / Editorial / Hybrid / Coverage / FTP / commit: не запускаются"
            echo "- Проверяйте фактические usage и расход по Actions artifact и кабинету OpenAI"
            echo "- При неизвестном ответе повтор API запрещён"
          } >> "$GITHUB_STEP_SUMMARY"
