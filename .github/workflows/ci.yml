name: Main CI

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  apply-source-health-scope:
    name: Apply matrix-wide Primary source-health fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/relative-freshness-retrieval'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply source-health correction and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python .github/_tmp_fix_source_health_scope.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Make Primary agency source-health matrix-wide'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
