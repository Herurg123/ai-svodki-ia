name: Main CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live-targeted-corroboration-v5:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/agency-rescue-after-source-monopoly'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input 'openai==2.21.0'
      - uses: actions/download-artifact@v8
        with:
          name: daily-production-2026-08-14
          path: automation/preview/recovery-source
          run-id: 31771774225
          github-token: ${{ github.token }}
      - name: Stage exact failed production recovery inputs
        run: |
          set -euo pipefail
          rm -rf automation/preview/2026-08-14 automation/preview/production-daily
          cp -a automation/preview/recovery-source/2026-08-14 automation/preview/2026-08-14
          mkdir -p automation/preview/production-daily
          cp automation/preview/recovery-source/production-daily/coverage-audit.json automation/preview/production-daily/coverage-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/preview/production-daily/coverage-audit.json').read_text(encoding='utf-8'))
          b=d.get('search_budget') or {}
          assert b.get('completed_calls')==6, b
          assert b.get('remaining_calls')==1, b
          assert len(d.get('attempts') or [])==6
          print('Exact failed production state recovered: six Coverage searches + one free slot.')
          PY
      - name: Run one targeted corroboration plus editorial rerun
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          python automation/scripts/ensure_story_coverage.py \
            --artifact-dir automation/preview/2026-08-14 \
            --archive automation/archive/index.json \
            --publication-date 2026-08-14 \
            --model "${OPENAI_TEXT_MODEL}" \
            --usual-total 7 --minimum-publishable 1 \
            --maximum-audit-web-search-calls 7 \
            --maximum-candidates 20 --maximum-selected-stories 12 \
            --report automation/preview/production-daily/coverage-audit.json
      - name: Assert targeted source repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          report=json.loads(Path('automation/preview/production-daily/coverage-audit.json').read_text(encoding='utf-8'))
          attempts=report.get('attempts') or []
          rescue=[x for x in attempts if isinstance(x,dict) and x.get('search_strategy')=='fresh_agency_rescue']
          ordinary=[x for x in attempts if isinstance(x,dict) and x.get('search_strategy')!='fresh_agency_rescue']
          assert len(ordinary)==6, len(ordinary)
          assert len(rescue)==1, rescue
          r=rescue[0]
          assert r.get('agency_rescue_version')==5, r.get('agency_rescue_version')
          assert r.get('corroboration_target_id')=='cand-003', r.get('corroboration_target_id')
          assert r.get('required_query')=='Reuters Databricks funding valuation latest', r.get('required_query')
          assert r.get('actual_queries')==['Reuters Databricks funding valuation latest'], r.get('actual_queries')
          assert (r.get('api') or {}).get('web_search_calls_completed')==1, r.get('api')
          assert r.get('candidate_count')==1, r
          assert report.get('source_health_contract_version')==5, report.get('source_health_contract_version')
          assert report.get('source_corroboration_count')==1, report.get('source_corroboration_count')
          assert report.get('audit_added_candidates')==0, report.get('audit_added_candidates')
          assert report.get('editorial_rerun_performed') is True, report.get('editorial_rerun_performed')
          b=report.get('search_budget') or {}
          assert b.get('completed_calls')==7 and b.get('remaining_calls')==0, b
          payload=json.loads(Path('automation/preview/2026-08-14/candidates.json').read_text(encoding='utf-8'))
          cs=payload.get('candidates') or []
          target=next(c for c in cs if c.get('id')=='cand-003')
          primary=(target.get('primary_source') or {})
          host=(urlparse(primary.get('url') or '').hostname or '').lower()
          assert host in {'reuters.com','www.reuters.com','apnews.com','www.apnews.com','bloomberg.com','www.bloomberg.com','ft.com','www.ft.com'}, host
          supporting=target.get('supporting_sources') or []
          assert any('techcrunch.com' in (urlparse((s.get('url') or '')).hostname or '') for s in supporting), supporting
          assert len(cs)==7, len(cs)
          print(json.dumps({
            'query':r.get('required_query'),
            'agency_primary':primary,
            'supporting_sources':supporting,
            'source_corroborations':report.get('source_corroborations'),
          },ensure_ascii=False,indent=2))
          PY
      - name: Validate production-format text artifact
        run: |
          set -euo pipefail
          python automation/scripts/normalize_digest_artifact.py --artifact-dir automation/preview/2026-08-14 --report automation/preview/2026-08-14/artifact-normalization.json
          python automation/scripts/validate_digest_artifact.py --artifact-dir automation/preview/2026-08-14 --report automation/preview/2026-08-14/artifact-validation.json
          python automation/scripts/validate_story_coverage.py --artifact-dir automation/preview/2026-08-14 --usual-total 7 --minimum-publishable 1 --report automation/preview/production-daily/story-coverage-validation.json
      - name: Summarize final digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('automation/preview/2026-08-14')
          cs=json.loads((root/'candidates.json').read_text(encoding='utf-8')).get('candidates') or []
          by={str(c.get('id')):c for c in cs}
          ss=json.loads((root/'stories.json').read_text(encoding='utf-8')).get('stories') or []
          selected=[]
          for s in ss:
            cid=str(s.get('candidate_id'))
            c=by.get(cid) or {}
            url=(c.get('primary_source') or {}).get('url') or ''
            selected.append({'candidate_id':cid,'title':s.get('title') or s.get('headline'),'domain':urlparse(url).hostname})
          print(json.dumps({'story_count':len(ss),'selected':selected},ensure_ascii=False,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-corroboration-v5-smoke-2026-08-14
          path: |
            automation/preview/2026-08-14/
            automation/preview/production-daily/coverage-audit.json
            automation/preview/production-daily/story-coverage-validation.json
          retention-days: 7