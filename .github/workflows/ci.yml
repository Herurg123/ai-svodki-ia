name: Main CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live-corroboration-v7:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/agency-rescue-after-source-monopoly'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input 'openai==2.21.0'
      - uses: actions/download-artifact@v8
        with:
          name: daily-production-2026-08-14
          path: automation/preview/recovery-source
          run-id: 31771774225
          github-token: ${{ github.token }}
      - run: |
          set -euo pipefail
          rm -rf automation/preview/2026-08-14 automation/preview/production-daily
          cp -a automation/preview/recovery-source/2026-08-14 automation/preview/2026-08-14
          mkdir -p automation/preview/production-daily
          cp automation/preview/recovery-source/production-daily/coverage-audit.json automation/preview/production-daily/coverage-audit.json
      - name: Run targeted v7 recovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          python automation/scripts/ensure_story_coverage.py --artifact-dir automation/preview/2026-08-14 --archive automation/archive/index.json --publication-date 2026-08-14 --model "${OPENAI_TEXT_MODEL}" --usual-total 7 --minimum-publishable 1 --maximum-audit-web-search-calls 7 --maximum-candidates 20 --maximum-selected-stories 12 --report automation/preview/production-daily/coverage-audit.json
      - name: Assert and validate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          r=json.loads(Path('automation/preview/production-daily/coverage-audit.json').read_text())
          a=[x for x in r.get('attempts',[]) if x.get('search_strategy')=='fresh_agency_rescue']
          assert len(a)==1,a
          a=a[0]
          assert a.get('agency_rescue_version')==7,a.get('agency_rescue_version')
          assert a.get('corroboration_target_id')=='cand-003',a.get('corroboration_target_id')
          assert a.get('required_query')=='Databricks $5 billion $190 billion',a.get('required_query')
          assert a.get('actual_queries')==['Databricks $5 billion $190 billion'],a.get('actual_queries')
          assert a.get('candidate_count')==1,a
          assert r.get('source_corroboration_count')==1,r.get('source_corroboration_count')
          assert r.get('audit_added_candidates')==0,r.get('audit_added_candidates')
          assert r.get('source_health_contract_version')==7,r.get('source_health_contract_version')
          assert r.get('editorial_rerun_performed') is True,r.get('editorial_rerun_performed')
          b=r.get('search_budget') or {}; assert b.get('completed_calls')==7 and b.get('remaining_calls')==0,b
          cs=json.loads(Path('automation/preview/2026-08-14/candidates.json').read_text()).get('candidates') or []
          assert len(cs)==7,len(cs)
          c=next(x for x in cs if x.get('id')=='cand-003')
          host=(urlparse((c.get('primary_source') or {}).get('url') or '').hostname or '').lower()
          assert any(host==d or host.endswith('.'+d) for d in ('reuters.com','apnews.com','bloomberg.com','ft.com')),host
          assert any('techcrunch.com' in ((urlparse((s.get('url') or '')).hostname or '').lower()) for s in c.get('supporting_sources') or []),c.get('supporting_sources')
          print(json.dumps({'query':a.get('required_query'),'primary':c.get('primary_source'),'supporting':c.get('supporting_sources')},ensure_ascii=False,indent=2))
          PY
          python automation/scripts/normalize_digest_artifact.py --artifact-dir automation/preview/2026-08-14 --report automation/preview/2026-08-14/artifact-normalization.json
          python automation/scripts/validate_digest_artifact.py --artifact-dir automation/preview/2026-08-14 --report automation/preview/2026-08-14/artifact-validation.json
          python automation/scripts/validate_story_coverage.py --artifact-dir automation/preview/2026-08-14 --usual-total 7 --minimum-publishable 1 --report automation/preview/production-daily/story-coverage-validation.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-corroboration-v7-smoke-2026-08-14
          path: |
            automation/preview/2026-08-14/
            automation/preview/production-daily/coverage-audit.json
            automation/preview/production-daily/story-coverage-validation.json
          retention-days: 7