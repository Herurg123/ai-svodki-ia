name: Apply Aug 16 terminal source-health fix

on:
  push:
    branches:
      - fix/aug16-terminal-source-health

permissions:
  contents: write
  actions: read

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aug16-terminal-source-health
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python .github/patches/apply_aug16_terminal_fix.py

      - name: Compile and run full offline tests
        run: |
          set -euo pipefail
          python -m compileall -q automation/scripts automation/tests
          python -m unittest discover -s automation/tests

      - name: Replay post-66 Aug 16 production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/aug16-post66 /tmp/aug16-post66.zip
          mkdir -p /tmp/aug16-post66
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9257868606/zip > /tmp/aug16-post66.zip
          unzip -q /tmp/aug16-post66.zip -d /tmp/aug16-post66
          artifact=/tmp/aug16-post66/2026-08-16
          python automation/scripts/normalize_digest_artifact.py \
            --artifact-dir "$artifact" \
            --report "$artifact/artifact-normalization-replay.json"
          python automation/scripts/validate_digest_artifact.py \
            --artifact-dir "$artifact" \
            --report "$artifact/artifact-validation-replay.json"
          python automation/scripts/validate_story_coverage.py \
            --artifact-dir "$artifact" \
            --usual-total 7 \
            --minimum-publishable 1 \
            --report /tmp/aug16-post66/story-coverage-validation-replay.json
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          artifact = Path('/tmp/aug16-post66/2026-08-16')
          report = json.loads((artifact / 'artifact-normalization-replay.json').read_text(encoding='utf-8'))
          assert report['status'] == 'ok', report
          warnings = report.get('warnings') or []
          assert any('source-health warning' in item for item in warnings), warnings
          validation = json.loads((artifact / 'artifact-validation-replay.json').read_text(encoding='utf-8'))
          assert validation['status'] == 'ok', validation

          script = Path('automation/scripts/summarize_production_status.py')
          spec = importlib.util.spec_from_file_location('status_replay', script)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.REPORT_ROOT = Path('/tmp/aug16-post66/production-daily')
          module.find_publication_dir = lambda _: artifact
          stage, reason = module.locate_reason('2026-08-16')
          assert stage == 'Нормализация editorial artifact', (stage, reason)
          assert 'source-health' in reason, (stage, reason)
          print('REAL_AUG16_REPLAY_OK')
          print('source_health_warning=', warnings[0])
          print('historical_terminal_stage=', stage)
          print('historical_terminal_reason=', reason)
          PY

      - name: Remove temporary harness files
        run: |
          rm -f .github/workflows/apply-aug16-terminal-source-health.yml
          rm -f .github/patches/apply_aug16_terminal_fix.py

      - name: Commit patched branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Relax terminal agency zero-result gate and preserve diagnostics"
          git push origin HEAD:fix/aug16-terminal-source-health
