name: Run hygiene retention patch

on:
  push:
    branches:
      - fix/hygiene-lifecycle-2026-08-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hygiene-lifecycle-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python automation/scripts/tmp_apply_hygiene_run_retention_patch.py
      - name: Verify patch
        run: |
          python -m unittest automation.tests.test_repository_hygiene automation.tests.test_repository_hygiene_summary automation.tests.test_repository_hygiene_workflow -v
          python -m py_compile automation/scripts/repository_hygiene.py automation/scripts/repository_hygiene_policy.py automation/scripts/repository_hygiene_github.py automation/scripts/render_repository_hygiene_summary.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/scripts/repository_hygiene_policy.py automation/scripts/repository_hygiene.py automation/scripts/repository_hygiene_github.py automation/scripts/render_repository_hygiene_summary.py automation/tests/test_repository_hygiene.py automation/tests/test_repository_hygiene_summary.py README.md automation/README.md AGENTS.md
          git commit -m 'Expire completed orphan workflow runs safely'
          git push origin HEAD:fix/hygiene-lifecycle-2026-08-09
