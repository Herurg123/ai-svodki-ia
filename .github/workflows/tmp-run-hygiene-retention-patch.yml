name: Run hygiene retention patch

on:
  push:
    branches:
      - fix/hygiene-lifecycle-2026-08-09

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable helper workflows and remove completed helper runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_WORKFLOW_ID: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPO']
          current_run = int(os.environ['CURRENT_RUN_ID'])
          target_ids = [330409845, 330411105, 330413084, 330414343, 330415753]
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-svodki-final-helper-cleanup',
          }

          def req(method, path, expected=(200,)):
              request = urllib.request.Request('https://api.github.com' + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw, status = response.read(), response.status
              except urllib.error.HTTPError as exc:
                  raw, status = exc.read(), exc.code
              if status not in expected:
                  raise RuntimeError(f'{method} {path}: HTTP {status}: {raw[:400]!r}')
              return json.loads(raw.decode()) if raw else None

          inventory = req('GET', f'/repos/{repo}/actions/workflows?per_page=100').get('workflows', [])
          by_id = {int(item['id']): item for item in inventory}
          report = {'disabled': [], 'deleted_runs': [], 'skipped_live': []}

          for workflow_id in target_ids:
              workflow = by_id.get(workflow_id)
              if not workflow:
                  continue
              runs = req('GET', f'/repos/{repo}/actions/workflows/{workflow_id}/runs?per_page=100').get('workflow_runs', [])
              live_other = [run for run in runs if int(run['id']) != current_run and run.get('status') in {'queued', 'in_progress'}]
              if live_other:
                  report['skipped_live'].append({'workflow_id': workflow_id, 'runs': [run['id'] for run in live_other]})
                  continue
              if workflow.get('state') == 'active':
                  req('PUT', f'/repos/{repo}/actions/workflows/{workflow_id}/disable', expected=(204,))
                  report['disabled'].append(workflow_id)
              for run in runs:
                  run_id = int(run['id'])
                  if run_id == current_run or run.get('status') != 'completed':
                      continue
                  req('DELETE', f'/repos/{repo}/actions/runs/{run_id}', expected=(204,))
                  report['deleted_runs'].append(run_id)

          if report['skipped_live']:
              raise RuntimeError('helper workflow still has an unexpected live run: ' + json.dumps(report['skipped_live']))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
