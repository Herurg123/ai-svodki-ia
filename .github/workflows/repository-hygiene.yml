name: Repository hygiene
run-name: Repository hygiene ${{ github.run_id }}

on:
  schedule:
    # 15:43 Europe/Moscow. Deliberately far from 01:43 content cleanup and 02:17 production.
    - cron: "43 12 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Применить безопасную очистку GitHub-объектов; оставьте выключенным только для аудита"
        required: true
        default: false
        type: boolean

concurrency:
  group: repository-hygiene-main
  cancel-in-progress: false

jobs:
  audit:
    name: Build repository hygiene plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out current main with history for report-only source scan
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build hygiene plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p automation/preview/repository-hygiene
          python automation/scripts/repository_hygiene.py \
            --mode plan \
            --report automation/preview/repository-hygiene/plan.json
          python automation/scripts/render_repository_hygiene_summary.py \
            automation/preview/repository-hygiene/plan.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Показать ошибку аудита repository hygiene
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Repository hygiene: аудит не завершён"
            echo
            echo "План безопасной уборки GitHub-объектов не сформирован. Открой первый красный шаг выше; destructive-изменения этим job не выполнялись."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Ошибка repository hygiene::Аудит безопасной уборки GitHub-объектов завершился ошибкой; изменения не применялись."

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-hygiene-audit-${{ github.run_id }}
          path: automation/preview/repository-hygiene/plan.json
          if-no-files-found: ignore
          retention-days: 2

  prune-branches:
    name: Delete proven stale merged branches
    needs: audit
    if: github.event_name == 'schedule' || inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Check out current main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Replan and prune branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p automation/preview/repository-hygiene
          python automation/scripts/repository_hygiene.py \
            --mode apply \
            --scope branches \
            --report automation/preview/repository-hygiene/branches.json
          python automation/scripts/render_repository_hygiene_summary.py \
            automation/preview/repository-hygiene/branches.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Показать ошибку очистки веток
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Repository hygiene: очистка веток не завершена"
            echo
            echo "Безопасное удаление доказанно устаревших merged-веток не подтверждено. Открой первый красный шаг выше."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Ошибка очистки веток::Repository hygiene не подтвердил завершение безопасной очистки веток."

      - name: Upload branch-cleanup JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-hygiene-branches-${{ github.run_id }}
          path: automation/preview/repository-hygiene/branches.json
          if-no-files-found: ignore
          retention-days: 2

  prune-actions:
    name: Prune safe Actions objects
    needs:
      - audit
      - prune-branches
    if: github.event_name == 'schedule' || inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Check out current main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Replan and prune Actions objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p automation/preview/repository-hygiene
          python automation/scripts/repository_hygiene.py \
            --mode apply \
            --scope actions \
            --report automation/preview/repository-hygiene/actions.json
          python automation/scripts/render_repository_hygiene_summary.py \
            automation/preview/repository-hygiene/actions.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Показать ошибку очистки Actions
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Repository hygiene: очистка Actions не завершена"
            echo
            echo "Удаление безопасно классифицированных Actions-объектов не подтверждено. Открой первый красный шаг выше."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Ошибка очистки Actions::Repository hygiene не подтвердил завершение безопасной очистки Actions-объектов."

      - name: Upload Actions-cleanup JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-hygiene-actions-${{ github.run_id }}
          path: automation/preview/repository-hygiene/actions.json
          if-no-files-found: ignore
          retention-days: 2
