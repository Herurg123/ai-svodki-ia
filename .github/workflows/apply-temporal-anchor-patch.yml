name: Temporary temporal anchor patch

on:
  push:
    branches:
      - fix/research-temporal-anchor-2026-08-09
    paths:
      - .github/workflows/apply-temporal-anchor-patch.yml

permissions:
  contents: write

jobs:
  prepare-workflow-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/research-temporal-anchor-2026-08-09
          fetch-depth: 1
      - name: Build patched production workflow copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/daily-production.yml').read_text(encoding='utf-8')
          old = '''          terminal = (\n              data.get("status") == "error"\n'''
          new = '''          temporal_anchor_current = (\n              data.get("temporal_anchor_version") == 1\n              and (data.get("recall_sentinel") or {}).get("version") == 7\n          )\n          terminal = (\n              temporal_anchor_current\n              and data.get("status") == "error"\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one terminal-reuse anchor, got {source.count(old)}')
          patched = source.replace(old, new, 1)
          Path('.github/daily-production-patched.yml').write_text(patched, encoding='utf-8')
          PY
          grep -F 'data.get("temporal_anchor_version") == 1' .github/daily-production-patched.yml
          grep -F '(data.get("recall_sentinel") or {}).get("version") == 7' .github/daily-production-patched.yml
      - name: Push ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add .github/daily-production-patched.yml
          git diff --cached --check
          git commit -m "Подготовить production workflow temporal fix"
          git push origin HEAD:fix/research-temporal-anchor-2026-08-09
