name: Temporary temporal anchor patch

on:
  push:
    branches:
      - fix/research-temporal-anchor-2026-08-09
    paths:
      - .github/workflows/apply-temporal-anchor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/research-temporal-anchor-2026-08-09
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply temporal anchor contract
        run: python .github/apply-temporal-anchor-patch.py
      - name: Run targeted regression tests
        run: |
          python -m unittest \
            automation.tests.test_temporal_anchor_contract \
            automation.tests.test_gapless_research_window \
            automation.tests.test_coverage_search_upgrade \
            automation.tests.test_coverage_audit_diagnostics
      - name: Commit patch
        run: |
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add \
            .github/workflows/daily-production.yml \
            AGENTS.md README.md automation/README.md \
            automation/prompts/research_candidates.md \
            automation/prompts/coverage_audit.md \
            automation/scripts/generate_digest_preview.py \
            automation/scripts/recover_digest_artifact.py \
            automation/scripts/ensure_story_coverage.py \
            automation/scripts/ensure_story_coverage_policy.py \
            automation/tests/test_temporal_anchor_contract.py
          git diff --cached --check
          git commit -m "Исправить temporal anchor ночного research"
          git push origin HEAD:fix/research-temporal-anchor-2026-08-09
