name: Temporary temporal anchor patch

on:
  push:
    branches:
      - fix/research-temporal-anchor-2026-08-09
    paths:
      - .github/workflows/apply-temporal-anchor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/research-temporal-anchor-2026-08-09
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply temporal anchor contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path: str, marker: str, block: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          # Main research prompt: the window end is authoritative task-time.
          replace_once(
              'automation/prompts/research_candidates.md',
              'Дата выпуска: {{CURRENT_DATE}}\nТочное редакционное окно: {{SEARCH_WINDOW_START_AT}} → {{SEARCH_WINDOW_END_AT}}\n',
              'Дата выпуска: {{CURRENT_DATE}}\nТочное редакционное окно: {{SEARCH_WINDOW_START_AT}} → {{SEARCH_WINDOW_END_AT}}\n'
              'Авторитетное текущее время этой исследовательской задачи: {{SEARCH_WINDOW_END_AT}}.\n'
              'Считай эту отметку фактическим «сейчас» независимо от системной даты модели,\n'
              'UTC-даты запуска API или календарной даты среды исполнения. Любой timestamp,\n'
              'который не позже {{SEARCH_WINDOW_END_AT}}, не является будущим. Не ищи события\n'
              'позже этой границы.\n',
          )

          # Every mandatory coverage pass gets the same task-time anchor.
          replace_once(
              'automation/prompts/coverage_audit.md',
              'Дата выпуска: {{PUBLICATION_DATE}}\nСтрогое редакционное окно: {{SEARCH_WINDOW_START_AT}} → {{SEARCH_WINDOW_END_AT}}\n',
              'Дата выпуска: {{PUBLICATION_DATE}}\nСтрогое редакционное окно: {{SEARCH_WINDOW_START_AT}} → {{SEARCH_WINDOW_END_AT}}\n'
              'Авторитетное текущее время этого audit-прохода: {{SEARCH_WINDOW_END_AT}}.\n'
              'Считай эту отметку фактическим «сейчас» независимо от системной даты модели,\n'
              'UTC-даты запуска API или календарной даты среды исполнения. Любой timestamp,\n'
              'который не позже {{SEARCH_WINDOW_END_AT}}, не является будущим. Не ищи события\n'
              'позже этой границы.\n',
          )

          # Persist the version in fresh main research artifacts.
          replace_once(
              'automation/scripts/generate_digest_preview.py',
              'DEFAULT_MAXIMUM_RESEARCH_WEB_SEARCH_CALLS = 12\n',
              'DEFAULT_MAXIMUM_RESEARCH_WEB_SEARCH_CALLS = 12\nTEMPORAL_ANCHOR_VERSION = 1\n',
          )
          replace_once(
              'automation/scripts/generate_digest_preview.py',
              '        run_info["research"]["prompt_sha256"] = sha256_text(research_prompt)\n',
              '        run_info["research"]["temporal_anchor_version"] = TEMPORAL_ANCHOR_VERSION\n'
              '        run_info["research"]["prompt_sha256"] = sha256_text(research_prompt)\n',
          )

          # Recovery: reject only vulnerable legacy research whose local end date is
          # already the next day while UTC is still the previous calendar day.
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              'from datetime import datetime\n',
              'from datetime import datetime, timezone\n',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              'IMAGE_RECOVERY_REQUIRED = (\n',
              'TEMPORAL_ANCHOR_VERSION = 1\n\nIMAGE_RECOVERY_REQUIRED = (\n',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              'def research_is_reusable(source_dir: Path) -> tuple[bool, str | None]:\n',
              '''def _legacy_cross_midnight_research(candidates: dict[str, Any]) -> bool:\n    search_window = candidates.get("search_window")\n    if not isinstance(search_window, dict):\n        return False\n    end_at = search_window.get("end_at")\n    if not isinstance(end_at, str) or not end_at.strip():\n        return False\n    try:\n        parsed = datetime.fromisoformat(end_at.replace("Z", "+00:00"))\n    except ValueError:\n        return False\n    if parsed.tzinfo is None:\n        return False\n    return parsed.date() > parsed.astimezone(timezone.utc).date()\n\n\ndef research_is_reusable(source_dir: Path) -> tuple[bool, str | None]:\n''',
          )
          replace_once(
              'automation/scripts/recover_digest_artifact.py',
              '''    if not isinstance(candidates, dict) or not isinstance(candidates.get("candidates"), list):\n        return False, "candidates.json не содержит candidates[]"\n    return True, None\n''',
              '''    if not isinstance(candidates, dict) or not isinstance(candidates.get("candidates"), list):\n        return False, "candidates.json не содержит candidates[]"\n    temporal_version = research.get("temporal_anchor_version")\n    if (\n        temporal_version != TEMPORAL_ANCHOR_VERSION\n        and _legacy_cross_midnight_research(candidates)\n    ):\n        return (\n            False,\n            "legacy cross-midnight research не содержит авторитетный temporal anchor",\n        )\n    return True, None\n''',
          )

          # Coverage runtime: v7 carries the temporal contract. Vulnerable legacy
          # cross-midnight plans are discarded as a whole; ordinary legacy plans can
          # still preserve already-paid six-direction work and only refresh sentinel.
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              'RECALL_SENTINEL_VERSION = 6\n',
              'TEMPORAL_ANCHOR_VERSION = 1\nRECALL_SENTINEL_VERSION = 7\n',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              'def _prepare_prior_plan(prior_plan: dict[str, Any] | None) -> dict[str, Any] | None:\n',
              '''def _legacy_cross_midnight_window(search_window: dict[str, Any] | None) -> bool:\n    if not isinstance(search_window, dict):\n        return False\n    end_at = search_window.get("end_at")\n    if not isinstance(end_at, str) or not end_at.strip():\n        return False\n    try:\n        parsed = datetime.fromisoformat(end_at.replace("Z", "+00:00"))\n    except ValueError:\n        return False\n    if parsed.tzinfo is None:\n        return False\n    return parsed.date() > parsed.astimezone(timezone.utc).date()\n\n\ndef _prepare_prior_plan(\n    prior_plan: dict[str, Any] | None,\n    search_window: dict[str, Any] | None = None,\n) -> dict[str, Any] | None:\n''',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              '''    if not isinstance(prior_plan, dict):\n        return prior_plan\n\n    prepared = copy.deepcopy(prior_plan)\n''',
              '''    if not isinstance(prior_plan, dict):\n        return prior_plan\n    if (\n        prior_plan.get("temporal_anchor_version") != TEMPORAL_ANCHOR_VERSION\n        and _legacy_cross_midnight_window(search_window)\n    ):\n        return None\n\n    prepared = copy.deepcopy(prior_plan)\n''',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              '    prepared_prior = _prepare_prior_plan(prior_plan)\n',
              '    prepared_prior = _prepare_prior_plan(prior_plan, search_window)\n',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              '''    plan = globals()["_BASE_EXECUTE_AUDIT_PLAN"](\n        api_key=api_key,\n        model=model,\n        template=template,\n        publication_date=publication_date,\n        search_window=search_window,\n        missing_total=missing_total,\n        maximum_web_search_calls=maximum_web_search_calls,\n        existing_candidates=existing_candidates,\n        archive=archive,\n        prior_plan=prepared_prior,\n    )\n\n    existing_sentinel = _existing_recall_sentinel(plan)\n''',
              '''    plan = globals()["_BASE_EXECUTE_AUDIT_PLAN"](\n        api_key=api_key,\n        model=model,\n        template=template,\n        publication_date=publication_date,\n        search_window=search_window,\n        missing_total=missing_total,\n        maximum_web_search_calls=maximum_web_search_calls,\n        existing_candidates=existing_candidates,\n        archive=archive,\n        prior_plan=prepared_prior,\n    )\n    plan["temporal_anchor_version"] = TEMPORAL_ANCHOR_VERSION\n\n    existing_sentinel = _existing_recall_sentinel(plan)\n''',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage.py',
              '''Строгое редакционное окно: {start_at} → {end_at}\nИдентификатор направления: general_coverage_gaps\n''',
              '''Строгое редакционное окно: {start_at} → {end_at}\nАвторитетное текущее время этого sentinel-прохода: {end_at}.\nСчитай эту отметку фактическим «сейчас» независимо от системной даты модели,\nUTC-даты запуска API или календарной даты среды исполнения. Любой timestamp,\nкоторый не позже {end_at}, не является будущим. Не ищи события позже этой границы.\nИдентификатор направления: general_coverage_gaps\n''',
          )

          # Ensure the marker is serialized into coverage-audit.json.
          replace_once(
              'automation/scripts/ensure_story_coverage_policy.py',
              '''                        "attempts",\n                        "search_budget",\n                        "time_precision_warnings",\n                        "api",\n''',
              '''                        "attempts",\n                        "search_budget",\n                        "time_precision_warnings",\n                        "api",\n                        "temporal_anchor_version",\n''',
          )
          replace_once(
              'automation/scripts/ensure_story_coverage_policy.py',
              '''        elif report["audit_needed"] and prior_complete:\n            report["prior_audit_reused"] = True\n''',
              '''        elif report["audit_needed"] and prior_complete:\n            report["prior_audit_reused"] = True\n            report["temporal_anchor_version"] = (prior_report or {}).get(\n                "temporal_anchor_version"\n            )\n''',
          )

          # Do not reuse a legacy zero-pool terminal stop before recovery has a
          # chance to invalidate the broken cross-midnight research.
          replace_once(
              '.github/workflows/daily-production.yml',
              '''          terminal = (\n              data.get("status") == "error"\n''',
              '''          temporal_anchor_current = (\n              data.get("temporal_anchor_version") == 1\n              and (data.get("recall_sentinel") or {}).get("version") == 7\n          )\n          terminal = (\n              temporal_anchor_current\n              and data.get("status") == "error"\n''',
          )

          # Documentation: this materially changes production/recovery behavior.
          append_once(
              'README.md',
              '## Временной контракт research и recovery',
              '''## Временной контракт research и recovery\n\nНочные запуски происходят около 02:17 МСК, когда в UTC ещё может быть предыдущий\nкалендарный день. Поэтому `search_window.end_at` является авторитетным текущим\nвременем задачи для основного research, всех coverage-проходов и recall sentinel.\nМодель обязана считать всё до этой отметки не будущим независимо от собственной\nсистемной даты или UTC-даты API-запуска.\n\nКонтракт версионируется. Recovery не переиспользует legacy research без текущей\nверсии temporal anchor, если локальная дата конца окна уже опережает UTC-дату.\nДля такого кросс-полуночного legacy artifact основной research выполняется заново.\nCoverage audit версии до temporal anchor также не считается окончательной\nнулевой остановкой в таком окне; обязательные проходы выполняются заново, а\nrecall sentinel использует текущую версию 7. Это сознательно жертвует повторной\nоплатой только для доказанно ненадёжного временного класса artifact, сохраняя\nобычный recovery для остальных случаев.''',
          )
          append_once(
              'automation/README.md',
              '## Temporal anchor ночного production',
              '''## Temporal anchor ночного production\n\n`SEARCH_WINDOW_END_AT` — авторитетное `now` для main research, targeted coverage\naudit и recall sentinel. Это защищает запуск около полуночи UTC от ложного вывода,\nчто московская часть окна следующего календарного дня находится в будущем.\n\nТекущая версия temporal contract — `1`, текущая версия recall sentinel — `7`.\n`run-info.json` сохраняет `research.temporal_anchor_version`; coverage report\nсохраняет `temporal_anchor_version`. Legacy кросс-полуночный research без этой\nверсии не считается reusable. Старый zero-pool terminal stop также не может\nобойти новый temporal contract до recovery.''',
          )
          append_once(
              'AGENTS.md',
              '## Temporal contract for nightly research',
              '''## Temporal contract for nightly research\n\nFor nightly production, the exact `search_window.end_at` timestamp is the\nauthoritative current time for research, every coverage pass, and the recall\nsentinel. Do not let model/system calendar dates override that timestamp.\nLegacy recovery data from a cross-midnight local/UTC window must not be reused\nas final research or a terminal zero-pool stop unless it carries the current\ntemporal-anchor contract version.''',
          )

          test = r'''from __future__ import annotations

import json
import sys
import tempfile
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
sys.path.insert(0, str(ROOT / "automation" / "scripts"))

import ensure_story_coverage as coverage
import recover_digest_artifact as recovery


CROSS_MIDNIGHT = {
    "start_at": "2026-08-08T02:48:25+03:00",
    "end_at": "2026-08-09T02:44:13+03:00",
}
SAME_UTC_DATE = {
    "start_at": "2026-08-08T02:48:25+03:00",
    "end_at": "2026-08-08T20:44:13+03:00",
}


class TemporalAnchorContractTests(unittest.TestCase):
    def test_research_prompt_declares_authoritative_now(self) -> None:
        text = (ROOT / "automation/prompts/research_candidates.md").read_text(encoding="utf-8")
        self.assertIn("Авторитетное текущее время этой исследовательской задачи", text)
        self.assertIn("{{SEARCH_WINDOW_END_AT}}", text)
        self.assertIn("не является будущим", text)

    def test_coverage_prompt_declares_authoritative_now(self) -> None:
        text = (ROOT / "automation/prompts/coverage_audit.md").read_text(encoding="utf-8")
        self.assertIn("Авторитетное текущее время этого audit-прохода", text)
        self.assertIn("не является будущим", text)

    def test_versions_are_current(self) -> None:
        self.assertEqual(coverage.TEMPORAL_ANCHOR_VERSION, 1)
        self.assertEqual(coverage.RECALL_SENTINEL_VERSION, 7)
        self.assertEqual(recovery.TEMPORAL_ANCHOR_VERSION, 1)

    def _write_research(self, root: Path, *, version: int | None, window: dict) -> None:
        research = {"status": "ok"}
        if version is not None:
            research["temporal_anchor_version"] = version
        (root / "run-info.json").write_text(
            json.dumps({"research": research}), encoding="utf-8"
        )
        (root / "candidates.json").write_text(
            json.dumps({"candidates": [], "search_window": window}), encoding="utf-8"
        )

    def test_legacy_cross_midnight_research_is_not_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            root = Path(temp)
            self._write_research(root, version=None, window=CROSS_MIDNIGHT)
            usable, reason = recovery.research_is_reusable(root)
            self.assertFalse(usable)
            self.assertIn("temporal anchor", reason or "")

    def test_current_cross_midnight_research_is_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            root = Path(temp)
            self._write_research(root, version=1, window=CROSS_MIDNIGHT)
            usable, reason = recovery.research_is_reusable(root)
            self.assertTrue(usable)
            self.assertIsNone(reason)

    def test_legacy_same_utc_date_research_remains_reusable(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            root = Path(temp)
            self._write_research(root, version=None, window=SAME_UTC_DATE)
            usable, reason = recovery.research_is_reusable(root)
            self.assertTrue(usable)
            self.assertIsNone(reason)

    def test_legacy_cross_midnight_coverage_plan_is_discarded(self) -> None:
        plan = {"attempts": [], "search_budget": {"maximum_calls": 7}}
        self.assertIsNone(coverage._prepare_prior_plan(plan, CROSS_MIDNIGHT))

    def test_current_cross_midnight_coverage_plan_can_be_reused(self) -> None:
        plan = {
            "temporal_anchor_version": 1,
            "attempts": [],
            "search_budget": {"maximum_calls": 7},
        }
        prepared = coverage._prepare_prior_plan(plan, CROSS_MIDNIGHT)
        self.assertIsInstance(prepared, dict)
        self.assertEqual(prepared.get("temporal_anchor_version"), 1)

    def test_sentinel_prompt_uses_authoritative_now(self) -> None:
        prompt = coverage.build_recall_sentinel_prompt(
            publication_date="2026-08-09",
            search_window=CROSS_MIDNIGHT,
            existing_candidates=[],
            archive={"items": []},
        )
        self.assertIn("Авторитетное текущее время этого sentinel-прохода", prompt)
        self.assertIn(CROSS_MIDNIGHT["end_at"], prompt)
        self.assertIn("не является будущим", prompt)

    def test_workflow_refuses_legacy_terminal_stop(self) -> None:
        workflow = (ROOT / ".github/workflows/daily-production.yml").read_text(encoding="utf-8")
        self.assertIn('data.get("temporal_anchor_version") == 1', workflow)
        self.assertIn('(data.get("recall_sentinel") or {}).get("version") == 7', workflow)

    def test_main_research_persists_temporal_version(self) -> None:
        source = (ROOT / "automation/scripts/generate_digest_preview.py").read_text(encoding="utf-8")
        self.assertIn('TEMPORAL_ANCHOR_VERSION = 1', source)
        self.assertIn('run_info["research"]["temporal_anchor_version"]', source)


if __name__ == "__main__":
    unittest.main()
'''
          (ROOT / 'automation/tests/test_temporal_anchor_contract.py').write_text(test, encoding='utf-8')
          PY
      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            automation.tests.test_temporal_anchor_contract \
            automation.tests.test_gapless_research_window \
            automation.tests.test_coverage_search_upgrade \
            automation.tests.test_coverage_audit_diagnostics
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herurg"
          git config user.email "77099658+Herurg123@users.noreply.github.com"
          git add \
            .github/workflows/daily-production.yml \
            AGENTS.md README.md automation/README.md \
            automation/prompts/research_candidates.md \
            automation/prompts/coverage_audit.md \
            automation/scripts/generate_digest_preview.py \
            automation/scripts/recover_digest_artifact.py \
            automation/scripts/ensure_story_coverage.py \
            automation/scripts/ensure_story_coverage_policy.py \
            automation/tests/test_temporal_anchor_contract.py
          git diff --cached --check
          git commit -m "Исправить temporal anchor ночного research"
          git push origin HEAD:fix/research-temporal-anchor-2026-08-09
