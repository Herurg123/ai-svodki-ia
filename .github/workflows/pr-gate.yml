name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.paths.outputs.main }}
      video: ${{ steps.paths.outputs.video }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Route changed paths to CI domains
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          raw = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", "--diff-filter=ACMRD", base, head]
          )
          changed = [
              os.fsdecode(path)
              for path in raw.split(b"\0")
              if path
          ]
          if not changed:
              raise SystemExit("PR Gate не нашёл изменённых путей; нельзя пропускать PR без маршрутизации CI")

          main = False
          video = False
          for path in changed:
              if path == ".github/workflows/pr-gate.yml":
                  main = True
                  video = True
              elif path.startswith("automation/notebooklm-video/") or path == ".github/workflows/video-ci.yml":
                  video = True
              else:
                  # Fail safe: every path that is not proven video-only belongs to Main CI.
                  # New root files/directories therefore cannot silently bypass repository checks.
                  main = True

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"main={'true' if main else 'false'}\n")
              stream.write(f"video={'true' if video else 'false'}\n")

          print(f"Изменённые файлы ({len(changed)}):")
          for path in changed:
              print(f"- {path}")
          print(f"Маршрутизация CI: main={main}, video={video}")
          PY

  main-ci:
    name: Main CI
    needs: classify
    if: needs.classify.outputs.main == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  video-ci:
    name: Video CI
    needs: classify
    if: needs.classify.outputs.video == 'true'
    uses: ./.github/workflows/video-ci.yml
    permissions:
      contents: read

  required:
    name: Required PR Gate
    needs:
      - classify
      - main-ci
      - video-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every routed CI domain to succeed
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          MAIN_REQUIRED: ${{ needs.classify.outputs.main }}
          MAIN_RESULT: ${{ needs.main-ci.result }}
          VIDEO_REQUIRED: ${{ needs.classify.outputs.video }}
          VIDEO_RESULT: ${{ needs.video-ci.result }}
        run: |
          set -euo pipefail

          [[ "${CLASSIFY_RESULT}" == "success" ]] || {
            echo "Классификация изменённых путей завершилась неуспешно: ${CLASSIFY_RESULT}" >&2
            exit 1
          }

          if [[ "${MAIN_REQUIRED}" == "true" ]]; then
            [[ "${MAIN_RESULT}" == "success" ]] || {
              echo "Main CI обязателен для этого PR, но завершился со статусом ${MAIN_RESULT}." >&2
              exit 1
            }
          elif [[ "${MAIN_RESULT}" != "skipped" ]]; then
            echo "Main CI не требовался, но завершился со статусом ${MAIN_RESULT}; маршрутизация CI противоречива." >&2
            exit 1
          fi

          if [[ "${VIDEO_REQUIRED}" == "true" ]]; then
            [[ "${VIDEO_RESULT}" == "success" ]] || {
              echo "Video CI обязателен для этого PR, но завершился со статусом ${VIDEO_RESULT}." >&2
              exit 1
            }
          elif [[ "${VIDEO_RESULT}" != "skipped" ]]; then
            echo "Video CI не требовался, но завершился со статусом ${VIDEO_RESULT}; маршрутизация CI противоречива." >&2
            exit 1
          fi

          {
            echo "# Required PR Gate"
            echo
            echo "✅ Маршрутизация CI и все обязательные проверки завершились успешно."
            echo
            echo "- **Main CI:** требуется=${MAIN_REQUIRED}, статус=${MAIN_RESULT}"
            echo "- **Video CI:** требуется=${VIDEO_REQUIRED}, статус=${VIDEO_RESULT}"
            echo "- **Head SHA:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Required PR Gate пройден: main=${MAIN_REQUIRED}/${MAIN_RESULT}, video=${VIDEO_REQUIRED}/${VIDEO_RESULT}."

      - name: Показать ошибку Required PR Gate
        if: failure()
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          MAIN_REQUIRED: ${{ needs.classify.outputs.main }}
          MAIN_RESULT: ${{ needs.main-ci.result }}
          VIDEO_REQUIRED: ${{ needs.classify.outputs.video }}
          VIDEO_RESULT: ${{ needs.video-ci.result }}
        run: |
          ru_status() {
            case "${1:-}" in
              success) echo "успешно" ;;
              failure) echo "ошибка" ;;
              skipped) echo "пропущено" ;;
              cancelled) echo "отменено" ;;
              "") echo "не запускалось" ;;
              *) echo "${1}" ;;
            esac
          }
          {
            echo "# ❌ Required PR Gate не пройден"
            echo
            echo "- **Классификация путей:** $(ru_status "${CLASSIFY_RESULT}")"
            echo "- **Main CI:** требуется=${MAIN_REQUIRED:-не определено}, результат=$(ru_status "${MAIN_RESULT}")"
            echo "- **Video CI:** требуется=${VIDEO_REQUIRED:-не определено}, результат=$(ru_status "${VIDEO_RESULT}")"
            echo "- **Head SHA:** \`${GITHUB_SHA}\`"
            echo
            echo "Открой соответствующий красный job выше. Его repository-controlled Summary и annotations должны содержать русское описание причины."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Required PR Gate не пройден::Одна из обязательных проверок или маршрутизация CI завершилась ошибкой. Подробности указаны в русскоязычном Summary."
