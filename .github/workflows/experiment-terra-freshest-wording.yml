name: Temporary Terra freshest-wording experiment

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/experiment-terra-freshest-wording.yml"

permissions:
  contents: read

jobs:
  experiment:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'experiment/terra-freshest-wording-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenAI SDK
        run: python -m pip install --disable-pip-version-check 'openai>=2.0.0,<3'
      - name: Run production-shaped relative-freshness repeats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/preview/terra-freshest-oneshot
          python - <<'PY'
          from __future__ import annotations
          import json, os, sys
          from pathlib import Path
          from openai import OpenAI

          sys.path.insert(0, str(Path('automation/scripts').resolve()))
          from ensure_story_coverage_policy import build_audit_api_metadata

          MODEL=os.environ['OPENAI_TEXT_MODEL']
          client=OpenAI(api_key=os.environ['OPENAI_API_KEY'], timeout=1200.0, max_retries=2)
          OUT=Path('automation/preview/terra-freshest-oneshot/report.json')

          cand_schema={'type':'object','additionalProperties':False,'properties':{
              'title':{'type':'string'},'publisher':{'type':'string'},'published_date':{'type':'string'},
              'url':{'type':'string'},'category':{'type':'string'},
              'significance':{'type':'integer','minimum':1,'maximum':5},'reason':{'type':'string'}},
              'required':['title','publisher','published_date','url','category','significance','reason']}
          result_schema={'type':'object','additionalProperties':False,'properties':{
              'status':{'type':'string','enum':['complete','complete_with_gaps']},
              'candidates':{'type':'array','maxItems':6,'items':cand_schema},'notes':{'type':'string'}},
              'required':['status','candidates','notes']}

          specs=[
              ('reuters_business','latest AI funding acquisition business news',['reuters.com']),
              ('models_products','latest AI model agent product launch news',None),
              ('infrastructure','latest AI chips cloud data centers news',None),
              ('business','latest AI funding acquisition partnership enterprise news',None),
          ]

          common='''Ищи самые свежие значимые новости об искусственном интеллекте на текущий момент. Приоритет — материалы и события, опубликованные совсем недавно.
          Не используй календарные даты, годы, названия месяцев, диапазоны дат, after:/before: или другие явные временные границы в фактическом search query.
          Discovery-first: сохрани проверяемые потенциально значимые события. Старые страницы, старые перепечатки без нового события, Reddit/Wikipedia/SEO-агрегаторы не являются кандидатами.
          Для кандидата проверь фактическую дату публикации и источник; не выдумывай дату или URL.'''

          def run_pass(round_no,name,query,domains):
              tool={'type':'web_search','search_context_size':'high','return_token_budget':'default'}
              if domains:
                  tool['filters']={'allowed_domains':domains}
              prompt=common+f'''\nЭто production-shaped one-shot контроль. Выполни РОВНО ОДИН Web Search search-operation и ровно один логический query, по смыслу максимально близкий к: {query}
              После поиска разрешена только навигация по найденным страницам. Не делай второй search. Верни до 6 лучших свежих кандидатов. Верни только JSON.'''
              resp=client.responses.create(model=MODEL,input=prompt,tools=[tool],tool_choice='required',max_tool_calls=4,
                  include=['web_search_call.action.sources'],reasoning={'effort':'medium'},max_output_tokens=3500,
                  text={'format':{'type':'json_schema','name':'terra_freshest_oneshot','strict':True,'schema':result_schema}},store=False)
              payload=json.loads(resp.output_text)
              meta=build_audit_api_metadata(resp,maximum_web_search_calls=1)
              searches=int(meta.get('web_search_search_operations_performed',0) or 0)
              logical=len(meta.get('actual_queries') or [])
              if searches != 1 or logical != 1:
                  raise RuntimeError(f'round {round_no} {name}: searches={searches} logical={logical}')
              return {'round':round_no,'name':name,'requested_query':query,'payload':payload,'api':meta}

          rounds=[]
          for round_no in range(1,4):
              passes=[run_pass(round_no,*spec) for spec in specs]
              rounds.append({'round':round_no,'passes':passes})

          report={'model':MODEL,'prompt_mode':'production_shaped_relative_freshest_no_dates','rounds':rounds,
              'summary':{'candidate_counts_by_round':[
                  sum(len(p['payload']['candidates']) for p in r['passes']) for r in rounds],
                  'titles_by_round':[[c['title'] for p in r['passes'] for c in p['payload']['candidates']] for r in rounds],
                  'queries_by_round':[[q for p in r['passes'] for q in (p['api'].get('actual_queries') or [])] for r in rounds]}}
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report['summary'],ensure_ascii=False,indent=2))
          PY
      - name: Upload experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-freshest-oneshot-2026-08-14
          path: automation/preview/terra-freshest-oneshot/report.json
          retention-days: 2
